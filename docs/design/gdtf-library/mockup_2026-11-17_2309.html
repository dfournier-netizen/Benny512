/* The count is a supporting fact, not the heading. Tabular figures so the two
   dividers' numbers line up as the pane drains. */
.b5-rcb-groupdiv__count {
  margin-left: auto;
  font-size: var(--b5-font-size-sm);
  font-weight: var(--b5-font-weight-regular);
  font-variant-numeric: tabular-nums;
  color: var(--b5-color-text-muted);
}

/* ---- "not read" vs "this fixture doesn't have it" -----------------------
   Two counts the server takes deliberate care to keep apart (see
   NotFittedCount in internal/web/reconcilecommit.go). They are rendered as
   two separate .b5-pill--tag chips, each carrying its own words, so they can
   never merge into one number on screen the way they must never merge on the
   wire. */
.b5-rcb-counts {
  display: flex;
  flex-wrap: wrap;
  gap: var(--b5-space-2);
  margin: var(--b5-space-2) 0 0;
}

/* ==========================================================================
   KIT-LEVEL TOUCH-TARGET AND TABLE-STACKING RESOLUTION
   --------------------------------------------------------------------------
   Two decisions the per-screen conversion agents correctly refused to make
   inside their own boundaries, resolved here once for every screen.

   1. .b5-btn--sm is a hard 32px, under this kit's own 44px minimum, and it is
      used by ui.js's shared buildApplyField (12x on the device detail panel
      alone) and by the global page-header Refresh button on EVERY screen. So
      it could not be fixed per-screen: raising half a row's buttons produces
      a mismatched row and leaves the other half under the minimum anyway.

      The resolution follows the precedent app.css already set for
      .b5-range-touch: give the touch size to COARSE pointers only. The owner
      works on a tablet in the dark under a truss, which is where the rule
      exists to protect him; on a laptop with a mouse the compact size is not
      a hazard and density is a feature on screens like Devices and Analyzer
      that are working instruments. A laptop touchscreen with a mouse also
      present correctly stays compact via the (hover: none) half, exactly as
      the slider rule does.

      This deliberately does NOT change the desktop rendering of any screen,
      so it cannot regress a layout that was signed off at a mouse pointer.

   2. .b5-table--responsive stacked into per-row cards only below 768px, which
      is narrower than every tablet this app is used on. At 820px portrait the
      Analyzer's Detail column (the "Full hex" button) was pushed outside the
      visible width and reachable only by scrolling the table sideways — the
      "control you cannot see" shape. Raised to 900px so a tablet in portrait
      gets the stacked card form, which is what that form was built for.
      Desktop widths are unaffected.
   ========================================================================== */

@media (hover: none) and (pointer: coarse) {
  .b5-btn--sm {
    min-height: var(--b5-size-touch-min);
    padding-block: var(--b5-space-2);
  }
}

@media (min-width: 768px) and (max-width: 899px) {
  .b5-table--responsive thead { display: none; }
  .b5-table--responsive,
  .b5-table--responsive tbody,
  .b5-table--responsive tr,
  .b5-table--responsive td { display: block; width: 100%; }
  .b5-table--responsive tr {
    border: 1px solid var(--b5-color-border-default);
    border-radius: var(--b5-radius-md);
    margin-bottom: var(--b5-space-3);
    padding: var(--b5-space-2);
  }
  .b5-table--responsive td { border: 0; padding: var(--b5-space-1) 0; }
  .b5-table--responsive td::before {
    content: attr(data-label) ": ";
    font-weight: 600;
    color: var(--b5-color-text-muted);
  }
}

/* 3. A bare <input type="radio">/<input type="checkbox"> renders ~20px and
      cannot be resized reliably across browsers, so the LABEL wrapping it is
      the real touch target. The port-selection radios on Nodes were 44px tall
      but only 28px wide — tall enough to pass a height-only audit and still
      awkward to hit with a thumb in the dark. Give any label that directly
      contains one a 44px minimum in BOTH dimensions on a coarse pointer.

      Scoped with :has() to labels that actually wrap such an input, so it
      cannot inflate ordinary field labels, and gated to coarse pointers for
      the same reason as rule 1 above: it must not change a desktop layout
      that was signed off at a mouse pointer. Labels whose input is visually
      hidden behind a styled control (the Patch row checkboxes, Rig Walk's
      toggle) are unaffected — their visible control is the target and is
      already sized by its own component. */

@media (hover: none) and (pointer: coarse) {
  label:has(> input[type="radio"]),
  label:has(> input[type="checkbox"]) {
    min-width: var(--b5-size-touch-min);
    min-height: var(--b5-size-touch-min);
  }
}

/* ---- K1: shared menu (ui.js UI.menu; W1 component-specs §2) ----
   A labelled trigger opens a panel of native buttons. A checked item shows
   the check symbol as well as aria-checked; danger items keep their words
   and sit after a separator (callers order them). */
.b5-menu { position: relative; display: inline-flex; }
.b5-menu__trigger { gap: var(--b5-space-1); }
.b5-menu__trigger .b5-menu__chev, .b5-menu__trigger svg.b5-menu__chev { width: 14px; height: 14px; flex: none; }
.b5-menu__panel {
  position: absolute; top: calc(100% + var(--b5-space-1)); right: 0; z-index: var(--b5-z-dropdown);
  display: flex; flex-direction: column; min-width: 14rem; max-height: min(70vh, 32rem); overflow: auto;
  padding: var(--b5-space-1); background: var(--b5-color-bg-surface-overlay);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-strong); border-radius: var(--b5-radius-md); box-shadow: var(--b5-shadow-md);
}
.b5-menu__panel[hidden] { display: none; }
.b5-menu__panel--start { right: auto; left: 0; }
.b5-menu__item {
  display: flex; align-items: center; gap: var(--b5-space-2); min-height: 40px; padding: 0 var(--b5-space-3);
  background: none; border: 0; border-radius: var(--b5-radius-sm); color: var(--b5-color-text-primary);
  font: inherit; text-align: left; white-space: nowrap; cursor: pointer;
}
.b5-menu__item:hover, .b5-menu__item:focus-visible { background: var(--b5-color-bg-hover); }
.b5-menu__item:focus-visible { outline: 2px solid var(--b5-color-border-focus); outline-offset: -2px; }
.b5-menu__item:disabled { color: var(--b5-color-text-disabled); cursor: default; }
.b5-menu__item--danger { color: var(--b5-color-text-danger); }
.b5-menu__item svg { width: 18px; height: 18px; flex: none; }
.b5-menu__check { display: inline-flex; width: 18px; flex: none; }
.b5-menu__sep { border-top: var(--b5-border-width-thin) solid var(--b5-color-border-subtle); margin: var(--b5-space-1) 0; }
.b5-menu__heading { padding: var(--b5-space-1) var(--b5-space-3); font-size: var(--b5-font-size-xs); color: var(--b5-color-text-muted); }
@media (pointer: coarse) { .b5-menu__item { min-height: var(--b5-size-touch-min); } }


/* ===== production: css/screens-devices.css ===== */
/* ===========================================================================
   screens-devices.css — the small number of things the Devices, device-detail
   and Analyzer conversion needed that the shared screen kit
   (benny512-components.css, "BENNY512 SCREEN KIT") does not yet have.

   The rule this file was written under is DESIGN.md's opening instruction:
   "find the component whose JOB matches yours, copy its markup exactly, and
   only then think about anything new." Everything on those three screens that
   the kit already covers uses the kit — .b5-step-section, .b5-toolbar,
   .b5-statecard, .b5-pill, .b5-group, .b5-param, .b5-choicecard,
   .b5-board__list, .b5-note, .b5-caption. What is left is three genuine gaps
   and one scoped nicety, and each one is written here rather than in the kit
   so that whoever folds these into benny512-components.css later can see
   exactly what was added and why.

   Nothing here introduces a colour-only state, and nothing here writes the
   literal 44px — the touch minimum is always var(--b5-size-touch-min), so a
   future change to that token still reaches every control on these screens.
   =========================================================================== */

/* ---------------------------------------------------------------------------
   GAP 1 — .b5-scrollbox: rule 4's missing container.

   DESIGN.md rule 4 says wide content "scrolls inside its own box" and that
   the page body must never scroll horizontally, and the worked example ends
   by telling you to put a genuinely tabular table "in its own overflow-x:
   auto box" — but the kit ships no such box, so every screen that kept a
   table had been inventing an inline style for it. The Analyzer's two packet
   tables and the device-detail Status table are exactly the case DESIGN.md
   blesses as "genuinely tabular data a tech scans down", so they need it.

   min-width: 0 is the load-bearing half: without it a scrollbox nested in a
   flex or grid parent takes its content's intrinsic width instead of its
   parent's, the overflow never engages, and the PAGE scrolls sideways
   instead — which is the failure rule 4 exists to prevent, arriving through
   the very component meant to prevent it.

   -webkit-overflow-scrolling gives the tablet its momentum scroll back,
   which an overflow container otherwise takes away.
   --------------------------------------------------------------------------- */
.b5-scrollbox {
  min-width: 0;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ---------------------------------------------------------------------------
   GAP 2 — .b5-statecard.is-current: "this is the row the pane below is
   showing".

   The kit's state card has five states — is-ok, is-warn, is-danger, is-open,
   is-armed — and they are all about the ITEM. None of them says "this is the
   one you are currently looking at", which is the single most important thing
   the Devices list has to communicate: the list and the detail pane are
   stacked vertically on a tablet, so when the pane below changes, the only
   way to know which card caused it is for that card to say so.

   is-armed is the closest existing state and is deliberately NOT reused:
   "armed" on this screen means a destructive action is one press from firing
   (the Clear buttons in step 2), and painting an ordinary selection with the
   same frame would teach the wrong reflex in the dark.

   Three independent signals, per rule 1 — a thick accent frame (border
   WIDTH, not just hue), the accent left rule, and a tinted ground. The word
   is carried in the markup: the card also renders an "Open below" pill and
   aria-current="true", so a greyscale screenshot and a screen reader both
   still identify it.
   --------------------------------------------------------------------------- */
.b5-statecard.is-current {
  border-color: var(--b5-color-accent-border);
  border-width: var(--b5-border-width-thick);
  border-left-width: 10px;
  border-left-color: var(--b5-color-accent-border);
  background: var(--b5-color-bg-selected);
}

/* ---------------------------------------------------------------------------
   GAP 3 — a state card that is also a step section's own frame.

   renderDestructiveActionsSection (device detail) renders the reset/factory-
   defaults block as a .b5-statecard so its armed state gets the same frame
   treatment every other armed thing in this app gets. A card used that way
   holds a stack of prose and buttons rather than one row, so it needs a
   little more room to breathe than a list row does.
   --------------------------------------------------------------------------- */
.b5-statecard.b5-panel--destructive {
  padding: var(--b5-space-4);
}

/* ---------------------------------------------------------------------------
   SCOPED NICETY — long read-only values inside a two-column fact grid.

   The device-detail Info tab puts .b5-param rows in a .b5-grid-2. A .b5-param
   value there can be a 17-character RDM UID, a manufacturer's full product
   string, or a whole "not read from the device yet" sentence, and in a
   half-width grid cell any of those will push the grid wider than its
   container unless it is allowed to break. Scoped to the grid rather than
   applied to .b5-param generally, because the kit's own .b5-param rows sit in
   full-width stacks where this is not needed and wrapping mid-token would be
   a regression.
   --------------------------------------------------------------------------- */
.b5-grid-2 > .b5-param { min-width: 0; }
.b5-grid-2 > .b5-param > .b5-param__value { overflow-wrap: anywhere; }

/* ---------------------------------------------------------------------------
   GAP 4 — a toolbar row that actually packs. DENSITY IS A FEATURE.

   `.b5-toolbar__row` is a `display: flex; flex-wrap: wrap` row, which is
   exactly right. But `.b5-input, .b5-select` in the kit carry `width: 100%`
   (benny512-components.css line ~237), and a flex item at width:100% claims
   the whole line and forces every sibling onto its own line after it. So the
   Devices screen's four filters — Class, Node, Universe, Sort — rendered as
   FOUR full-width stacked rows at 1024px, and the Analyzer's Kind filter as
   one more, pushing the actual list of devices and the actual packet feed
   most of a screen further down.

   That was caught by looking at a screenshot, not by an assertion: every
   check passed, and the screen was simply much less useful. This app is read
   standing up at arm's length while the tech is looking for one fixture in a
   list of hundreds, and DESIGN.md is explicit that where the kit's default
   treatment costs too much information per screen you say so and reach for
   the tighter option rather than abandoning the kit or inventing a new look.
   So this does not restyle the controls at all — same component, same border,
   same focus ring, same min-height (the 44px touch minimum is untouched and
   still comes from the token). It only lets them size to their content and
   share a line.

   Scoped to these two screens rather than written against `.b5-toolbar__row`
   generally: the other screens converting to the kit have not been looked at
   at this width yet, and a width change that reaches them unreviewed is the
   kind of drive-by that this codebase has been bitten by. Whoever folds this
   into the kit should widen the selector deliberately, with a screenshot.

   min-width: 0 is rule 4: without it a select with a long option label takes
   its intrinsic content width and pushes the toolbar — and therefore the
   page — sideways, which is the exact failure the flex row is meant to avoid.
   --------------------------------------------------------------------------- */
#screen-devices .b5-toolbar__row > .b5-select,
#screen-devices .b5-toolbar__row > .b5-input,
#screen-analyzer .b5-toolbar__row > .b5-select,
#screen-analyzer .b5-toolbar__row > .b5-input {
  width: auto;
  flex: 1 1 12rem;
  min-width: 0;
}

/* ---------------------------------------------------------------------------
   SCOPED NICETY — the Analyzer's per-row "Full hex" button on one line.

   The packet feed is the densest thing in the app: a tech scans down it
   looking for one packet among hundreds. That button is a full 44px control
   (DESIGN.md rule 2 — it was --sm, i.e. 32px, and is not any more), and in the
   narrow Detail column its two-word label wrapped onto a second line, which
   added roughly 25px to EVERY row of a 500-row feed and cost about a third of
   the rows visible on a 768px-tall tablet.

   Keeping the label at two words is deliberate: "Full hex" says what the
   button does, and DESIGN.md's worked example is explicit that an action's
   label should say what it does rather than being trimmed to fit. So the
   column gets wider instead of the label getting shorter — which is free
   here, because this table already lives inside a .b5-scrollbox and scrolls
   within its own box (rule 4). Nothing reaches the page edge.
   --------------------------------------------------------------------------- */
#screen-analyzer .b5-table td[data-label="Detail"] .b5-btn { white-space: nowrap; }

/* Devices is a working picker, not a four-step form. Keep discovery and the
   list compact; the inspector stays beside the list until it is explicitly
   closed, so changing from one device to another does not mean travelling to
   the bottom of the page. */
#screen-devices .b5-devices-target { margin-bottom: var(--b5-space-3); }
#screen-devices #btnStopDiscovery[hidden] { display: none; }
#screen-devices #discoverStatus {
  flex-basis: 100%;
  min-width: 0;
  overflow-wrap: anywhere;
}
#screen-devices #discoverStatus:empty { display: none; }
#screen-devices .b5-devices-clear { margin-bottom: var(--b5-space-4); }
#screen-devices .b5-devices-clear > summary { cursor: pointer; }
#screen-devices .b5-section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--b5-space-3);
  margin: 0 0 var(--b5-space-3);
}
#screen-devices .b5-section-head h2 { margin: 0; font-size: var(--b5-font-size-lg); }

/* The inspector is a fixed drawer, so it must clear the sticky app chrome
   (.b5-header + .b5-show-context) in BOTH senses or its bar is unreachable:

   z-index -- on the shared scale's dropdown layer, above chrome (sticky) and
   below modals/toasts. It was a hand-picked 20 against the strip's
   hand-picked 40, which is what put the close button under the strip.

   top -- offset by the chrome's MEASURED height (--b5-chrome-height,
   published by app.js; see publishChromeHeight there). A fixed guess would
   be wrong exactly when it matters: .b5-show-context wraps, so on a tablet
   in portrait the chrome is two rows tall, and that is the venue case. The
   fallback covers the moment before the first measurement lands. */
.b5-inspector {
  position: fixed;
  z-index: var(--b5-z-dropdown);
  top: calc(var(--b5-chrome-height, 3.5rem) + var(--b5-space-4));
  right: var(--b5-space-4);
  bottom: var(--b5-space-4);
  width: min(34rem, calc(100vw - (var(--b5-space-4) * 2)));
  overflow: auto;
  padding: var(--b5-space-4);
  border: var(--b5-border-width-thick) solid var(--b5-color-accent-border);
  border-radius: var(--b5-radius-lg);
  background: var(--b5-color-bg-surface-raised);
  box-shadow: var(--b5-shadow-lg);
  transform: translateX(calc(100% + var(--b5-space-4)));
  visibility: hidden;
  pointer-events: none;
  transition: transform 160ms ease, visibility 160ms ease;
}
.b5-inspector.is-open {
  transform: translateX(0);
  visibility: visible;
  pointer-events: auto;
}
.b5-inspector__bar {
  position: sticky;
  z-index: 1;
  top: calc(var(--b5-space-4) * -1);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--b5-space-3);
  min-height: var(--b5-size-touch-min);
  margin: calc(var(--b5-space-4) * -1) calc(var(--b5-space-4) * -1) var(--b5-space-4);
  padding: var(--b5-space-3) var(--b5-space-4);
  border-bottom: 1px solid var(--b5-color-border-default);
  background: var(--b5-color-bg-surface-raised);
}
.b5-inspector__actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--b5-space-2); }

.b5-discovery-summary {
  min-width: 0;
  padding: var(--b5-space-3) var(--b5-space-4);
  border-bottom: 1px solid var(--b5-color-border-default);
  overflow-wrap: anywhere;
}
.b5-discovery-summary summary {
  cursor: pointer;
  font-weight: 600;
  min-height: var(--b5-size-touch-min);
  align-content: center;
}
#devicePortSummaries { max-height: 18rem; overflow-y: auto; }

@media (max-width: 899px) {
  .b5-inspector {
    top: auto;
    right: 0;
    bottom: 0;
    left: 0;
    width: auto;
    max-height: min(82vh, 52rem);
    border-right: 0;
    border-bottom: 0;
    border-left: 0;
    border-radius: var(--b5-radius-lg) var(--b5-radius-lg) 0 0;
    transform: translateY(110%);
  }
  .b5-inspector.is-open { transform: translateY(0); }
}

/* ===== production: css/screens-tools.css ===== */
/* ===========================================================================
   screens-tools.css — the ONE thing the Send / Rig Walk / Settings / Patch
   Entries conversion needed that the shared screen kit
   (benny512-components.css, "BENNY512 SCREEN KIT") cannot express.

   Written under DESIGN.md's opening instruction: "find the component whose
   JOB matches yours, copy its markup exactly, and only then think about
   anything new." Everything else on those four screens uses the kit as it
   ships — .b5-step-section, .b5-toolbar, .b5-actionbar, .b5-bigbtn,
   .b5-statecard, .b5-pill, .b5-group, .b5-choicecard, .b5-field,
   .b5-scrollbox, .b5-note, .b5-caption. One gap is left, and it is here.

   NOTHING HERE IS A TOUCH-TARGET OVERRIDE. .b5-btn--sm was resolved
   kit-wide (32px on a mouse, var(--b5-size-touch-min) on a coarse pointer,
   benny512-components.css) and the Send park toggle deliberately uses that
   class so the kit's own rule reaches it. The literal 44px is never written
   here.

   IF THIS FILE IS NOT LINKED, NOTHING BREAKS. The park toggle is a plain
   .b5-btn .b5-btn--sm .b5-btn--ghost .b5-btn--block and renders, reads and
   presses correctly without a single rule below; the only difference is
   that its label sits a couple of pixels wider than a 64px grid cell and
   crowds its neighbour. That was deliberate: a screen must not depend on a
   stylesheet that has not been wired in yet.
   =========================================================================== */

/* ---------------------------------------------------------------------------
   GAP — a kit button inside Send's 64px DMX cell.

   Send's grid is .b5-dmx-grid's repeat(auto-fill, minmax(64px, 1fr)): at a
   1024px tablet width that is a ~66px column, 512 of them, and density there
   is the whole feature (DESIGN.md's worked example names "the Send grid" as
   data a tech scans down rather than something to turn into cards).

   The park control used to be a bare 13px native <input type=checkbox>,
   which is not a target a gloved thumb can find on a truss and is not a
   real button. It is now a kit .b5-btn .b5-btn--sm, which brings the
   kit-wide coarse-pointer touch height with it — but .b5-btn's horizontal
   padding (var(--b5-space-4), and var(--b5-space-3) at --sm) is sized for a
   toolbar row, and "Parked" plus 2x12px of padding is wider than the cell
   it has to live in.

   So the only thing adjusted is the INLINE padding, and only for this one
   control in this one place. The block padding, the min-height and every
   state colour are left entirely to the kit, so a future change to the
   touch minimum still reaches this button.
   --------------------------------------------------------------------------- */
.b5-dmx-cell .b5-tools-dmxpark {
  padding-inline: var(--b5-space-1);
  gap: var(--b5-space-1);
  min-width: 0;
}

/* The label is the state, in a word (rule 1) — it must never be the thing
   that gets clipped when a cell is narrow. */
.b5-dmx-cell .b5-tools-dmxpark .b5-dmx-cell__park-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------------------------------------------------------------------------
   GAP — the DMX cell's own numeric entry on a coarse pointer.

   This is NOT a per-screen override of a kit control: .b5-dmx-cell input is
   the kit's own rule (benny512-components.css, "Send grid"), and it pins
   every input in a cell to min-height: 36px — which beats .b5-numinput's 48px
   on specificity, so the kit's compact-numeric component cannot be used here
   to fix it.

   The kit already treats this exact grid this exact way: app.css gives
   .b5-range-touch the touch height ONLY on (hover: none) and (pointer:
   coarse), explicitly "so Send's 512-cell desktop grid stays usable" on a
   mouse. Without the rule below, the fader in a cell is 44px on the owner's
   tablet and the number box beside it is 36px — the two halves of one control
   disagreeing about whether this screen is touchable.

   Same query, same token, opposite half of the same decision. On a mouse
   nothing changes, and the literal 44px is never written.
   --------------------------------------------------------------------------- */
@media (hover: none) and (pointer: coarse) {
  .b5-dmx-cell input[type="number"] {
    min-height: var(--b5-size-touch-min);
  }
}
/* Universe Identify has its own inline controls; only the manual Send output
   bar sticks to the screen edge. Group labels with their inputs when wrapping. */
.b5-identify .b5-field { flex: 1 1 160px; min-width: 0; }
.b5-identify__actions { position: static; }
.b5-identify__actions .b5-actionbar__buttons { flex-wrap: wrap; }

/* ===== production: css/app.css ===== */
/*
  Benny512 app.css — presentation-layer glue the base design system doesn't
  cover, written in the same idiom (references --b5-* tokens only, b5-
  prefixed class names, BEM-ish modifiers). Load after the three
  benny512-*.css files. Every rule here is documented in the retheme report
  as a design-system extension.
*/

/* ---- SPA panel visibility -------------------------------------------------
   The delivered mockups model one screen per static HTML page; this app is
   a single page with app.js toggling which <section class="screen"> is
   visible. Not a component the design system needs to define, but the app
   needs it to exist somewhere. */
.screen { display: none; }
.screen.active { display: block; }

/* ---- Tag variant for "needs a second look" identity labels ---------------
   .b5-tag / .b5-tag--info cover the two device-class tiers used across
   Nodes/Devices/Patch/Rig Walk. A few labels (manufacturer-PID rows marked
   "raw / unverified", the generic-ESTA-PID fallback) want a neutral tag with
   a warning tint rather than a full status badge — reuses the existing
   warning ramp, same construction as .b5-tag--info. */
.b5-tag--warn { color: var(--b5-color-text-warning); border-color: var(--b5-color-warn-border); background: var(--b5-color-warn-fill); }

/* ---- Sensor gauge: recorded-value tick ------------------------------------
   design-spec's gauge covers track/normal-band/present-marker/min-max ticks.
   RDM sensors additionally report a separately-latched "recorded" value
   (distinct from the live lowest/highest range ticks) — same tick
   vocabulary, accent-400 so it reads as "a value", not a range edge. */
.b5-gauge__tick--recorded { background: var(--b5-color-accent-border); top: -1px; height: 16px; }

/* ---- Confirm-style walk/rig-check button ----------------------------------
   .b5-btn--walk covers size; Rig Walk and Rig Check both need a walk-sized
   button whose outline reads "affirmative" the same way --danger reads
   "destructive" — same construction, success ramp. */
.b5-btn--confirm { border-color: var(--b5-color-ok-border); color: var(--b5-color-text-success); }
.b5-btn--confirm:hover { background: var(--b5-color-ok-fill); border-color: var(--b5-color-ok-border); }
.b5-btn--confirm:active { background: var(--b5-color-ok-fill); }

/* ---- Native <details>/<summary> as an accordion trigger -------------------
   Patch's Reconcile groups use native <details> (free open/closed state,
   keyboard/AT support) rather than a hand-rolled JS accordion — restyled to
   read as .b5-accordion__trigger by suppressing the native marker and
   letting the component's own flex/padding/hover rules apply to <summary>. */
.b5-accordion__item > summary.b5-accordion__trigger { list-style: none; cursor: pointer; }
.b5-accordion__item > summary.b5-accordion__trigger::-webkit-details-marker { display: none; }
.b5-accordion__item > summary.b5-accordion__trigger::marker { content: ""; }

/* ---- DMX grid cell: inline trim fader --------------------------------------
   Send's 512-channel grid pairs a numeric field with a compact range input
   in the same cell (the mockup's separate 8-fader strip is folded into the
   grid itself here — every channel gets both controls, not just the first
   8, to preserve the existing feature set exactly). */
.b5-dmx-cell__range {
  width: 100%;
  margin-top: var(--b5-space-1);
  accent-color: var(--b5-color-accent-border);
  height: 18px;
}

/* ---- Rig Walk owns the bottom edge on a phone --------------------------
   .b5-walk-bar and .b5-nav--mobile are both position:fixed / bottom:0 in
   the base system (they're never on screen together in the mockups, one
   page per screen); this is a single-page app, so app.js toggles this body
   class and the tab bar steps aside while an active walk session's own
   Previous/Next bar owns that band. */
@media (max-width: 767px) {
  body.b5-walk-mode .b5-nav--mobile { display: none; }
}

/* ---- Rig Walk content must clear its own fixed Previous/Next bar --------
   ROOT CAUSE (2026-08-25, "Rig Walk is unusable on PC"): .b5-walk-bar
   (components.css) is position:fixed/bottom:0 at every breakpoint, but the
   kit's only bottom-space reservation is .b5-app__body's mobile-only
   padding-bottom, and even that was sized for the MOBILE NAV bar
   (--b5-size-touch-min + space-6 = 68px), not for the walk bar, which is
   --b5-size-touch-walk (76px) buttons plus space-3 padding top/bottom plus
   a hairline border plus the iOS home-indicator safe area — ~101px+. On
   desktop there was no reservation at all, so the bar permanently covered
   the auto-advance checkbox, the device-detail accordion and the Export
   buttons, and since the document was never taller than the viewport there
   was nothing to scroll to reach them; on a phone the (undersized)
   reservation meant the same content was clipped at the bottom of an
   otherwise-scrollable page.
   Fix: derive one shared "how tall is the bar" custom property from the
   same tokens .b5-walk-bar's own padding/min-height use (never a guessed
   px number), and reserve exactly that much bottom padding on the content
   column whenever walk mode is active — at EVERY breakpoint, replacing
   (not stacking with) the mobile nav reservation via a higher-specificity
   selector, since the mobile nav bar is hidden in walk mode anyway. */
:root {
  --b5-walk-bar-reserve: calc(var(--b5-size-touch-walk) + (var(--b5-space-3) * 2) + var(--b5-border-width-thin) + var(--b5-space-3) + env(safe-area-inset-bottom, 0px));
}
body.b5-walk-mode .b5-app__body {
  padding-bottom: var(--b5-walk-bar-reserve);
}

/* ---- Icon sprite: every icon in the app rendered as a solid black blob --
   ROOT CAUSE found while auditing Task A (a second, distinct instance of
   "the intended style never actually reaches the element" — not a UA
   default this time, but the exact same effect: an invisible/wrong-colored
   interactive glyph). benny512-icons.svg's root <svg style="display:none"
   fill="none" stroke="currentColor" stroke-width="1.75" ...> declares its
   intended outline style as presentation ATTRIBUTES on the sprite sheet's
   own root element. Every icon in the app is instanced via
   <svg><use href="/icons/benny512-icons.svg#b5-icon-NAME"/></svg> — but a
   <use> only clones the referenced <symbol> subtree, never the sprite
   sheet's own <svg> root, so those fill/stroke attributes are never part
   of what gets cloned. The result, confirmed via getComputedStyle on live
   icons app-wide: fill:rgb(0,0,0) / stroke:none on literally every icon in
   the app (nav, buttons, badges, alerts, the accordion chevron, the new
   Task C/reset-dialog icon) — a solid near-black shape on a near-black
   background, i.e. functionally invisible, which is a strictly worse
   contrast problem than the nav-button background bug this same task was
   sweeping for. Confirmed via direct pixel crop of the nav bar: icons
   render as solid dark blobs, not outline glyphs, at every call site.
   Fix: fill/stroke ARE ordinary inheritable CSS properties, and a <use>
   instance's shadow content inherits from the <use> element's OWN
   ancestor chain in the real document (not from the sprite's original,
   unrelated position) — so setting them on every <svg> that wraps a <use>
   fixes every call site in one rule. Safe as a blanket `svg` selector:
   grepped the whole static/ tree — literally every <svg> in this app wraps
   exactly one <use href=".../benny512-icons.svg#...">; there is no other
   inline SVG usage to collide with (the logo is a rasterized <img>, not
   inline markup). Values mirror the sprite's own declared intent exactly. */
svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---- Icon sprite, part two: every icon also needs a SIZE it does not carry
   The same <use>-instancing described above is also why no icon in this app
   has an intrinsic size worth trusting: the kit sizes icons per call site
   (.b5-btn svg, .b5-badge svg, .b5-nav__item svg, .b5-alert svg, .b5-empty
   svg, ...) and there is no default underneath them. Any NEW call site
   therefore renders its glyph at the symbol's own box — which is how the
   Reconcile toolbar's filter and warning glyphs first shipped blowing the
   control row apart, and how the reset dialog's checkmark shipped as a
   large blob (see .b5-dialog__title svg below). Both were caught by looking
   at a screenshot; no assertion in this project would have found either.
   Fix: one low-specificity default, so an unsized icon is merely
   ordinary-sized instead of broken. Every existing `... svg { width; height }`
   rule in the kit is more specific and still wins, so nothing that was
   already sized changes. Safe as a blanket `svg` selector for exactly the
   reason the fill/stroke rule above is: grepped the whole static/ tree —
   every <svg> in this app wraps exactly one <use href=".../benny512-icons.svg#...">,
   and the logo is an <img>, not inline markup.
   The scale itself lives with the components that consume it, at the top of
   the screen-kit block in benny512-components.css. */
svg {
  width: var(--b5-size-icon-md);
  height: var(--b5-size-icon-md);
  flex: none;
}

/* ---- Nav buttons: reset UA <button> defaults ----------------------------
   ROOT CAUSE (2026-08-25, "nav buttons too bright, text too low-contrast"):
   .b5-nav__item (layout.css) was authored for <a> elements — it sets
   text-decoration/color but never resets background/border/font — while
   index.html uses real <button> elements for every tab (desktop .b5-nav
   AND the phone .b5-nav--mobile bar). Absent a reset, every tab kept the
   UA's default button chrome (ButtonFace background, an inset 3D border,
   a non-body font) underneath the kit's --b5-color-text-secondary — a pale
   warm grey authored for a near-black ground — producing a bright grey
   button with barely-legible text. Same construction .b5-tabs__tab
   (components.css) already uses correctly for the identical <button>
   element, mirrored here; loading order (app.css last) plus this rule's
   explicit border-bottom/border-top re-declarations let the more-specific
   .b5-nav--mobile media-query rules in layout.css keep choosing their own
   side (top on phone, bottom on desktop) and their own font-size, so only
   the actually-broken properties (background, the other 3 border sides,
   font-family) are touched. Active tab keeps a background tint in ADDITION
   to its text-color change and underline/top-border — never identifiable
   by the accent line alone. Covers both .b5-nav and .b5-nav--mobile, both
   themes (token-driven, no hardcoded color). */
.b5-nav__item {
  background: none;
  border: none;
  border-bottom: var(--b5-border-width-thick) solid transparent;
  font: inherit;
  font-size: var(--b5-font-size-sm);
  font-weight: var(--b5-font-weight-medium);
  cursor: pointer;
}
.b5-nav__item.is-active {
  background: var(--b5-color-bg-selected);
}

/* ---- Analyzer expand-on-click affordance ----------------------------------
   .hexcell/tr.hexcell carry no styling of their own — they're JS query
   hooks (click to expand full hex/decoded detail) layered onto real
   b5-text-mono/b5-table cells; this just restores the pointer-cursor
   affordance the old stylesheet gave them. */
.hexcell { cursor: pointer; }

/* ---- Panel-level out-of-range echo -----------------------------------------
   Sensor cards render the gauge inside a .b5-panel; out-of-range state
   should be visible even when the gauge itself scrolls out of view at the
   top of a long sensor list, so the panel border also gets the danger tint. */
.b5-panel--out-of-range { border-color: var(--b5-color-danger-border); }

/* ---- Touch-safe range thumb (Send's trim fader, Rig Check's level) -------
   Standing accessibility gap: native <input type="range"> thumbs are a few
   px in every engine's default styling — far under the kit's own
   --b5-size-touch-min (44px) — and the delivered kit ships no touch-safe
   range variant. Dom bench-tests on real gear with a phone in hand. Applied
   to Send's per-channel trim fader (.b5-dmx-cell__range) and Rig Check's
   level slider (#rcLevel) via this added class; value/step/oninput
   behavior is untouched — purely a hit-target restyle, so the faders'
   immediate-effect behavior (one of the two signed-off Apply-to-confirm
   exceptions) is unchanged.
   Gated to (hover:none)+(pointer:coarse) — real touchscreens only — so a
   mouse/trackpad user (in particular, Send's 512-cell desktop grid) never
   sees a giant 44px thumb crammed into an 18px grid cell; a laptop
   touchscreen with a mouse also present correctly stays at the compact
   desktop sizing via the (hover:none) half of the query. */
@media (hover: none) and (pointer: coarse) {
  .b5-range-touch {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    height: var(--b5-size-touch-min);
    cursor: pointer;
  }
  .b5-range-touch::-webkit-slider-runnable-track {
    height: 6px;
    background: var(--b5-color-track);
    border: var(--b5-border-width-thin) solid var(--b5-color-track-border);
    border-radius: var(--b5-radius-full);
  }
  .b5-range-touch::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: var(--b5-size-touch-min);
    height: var(--b5-size-touch-min);
    margin-top: calc((6px - var(--b5-size-touch-min)) / 2);
    border-radius: var(--b5-radius-full);
    background: var(--b5-color-thumb);
    border: var(--b5-border-width-thin) solid var(--b5-color-thumb-border);
  }
  .b5-range-touch::-moz-range-track {
    height: 6px;
    background: var(--b5-color-track);
    border: var(--b5-border-width-thin) solid var(--b5-color-track-border);
    border-radius: var(--b5-radius-full);
  }
  .b5-range-touch::-moz-range-thumb {
    width: var(--b5-size-touch-min);
    height: var(--b5-size-touch-min);
    border-radius: var(--b5-radius-full);
    background: var(--b5-color-thumb);
    border: var(--b5-border-width-thin) solid var(--b5-color-thumb-border);
  }
}

/* ---- Rig Walk's device-detail accordion is desktop-visible too ----------
   ROOT CAUSE found while verifying Task B (not in the original bug
   report): the kit's generic .b5-tabs/.b5-accordion pattern
   (components.css) assumes a desktop TABS view is always paired with a
   mobile ACCORDION view of the same content — ".b5-accordion{display:none}"
   at >=768px, ".b5-tabs{display:none}" at <768px. walk.js never built a
   tabs variant: per its own file doc comment it deliberately uses "large
   collapsible accordions rather than small tabs" for the device-detail
   panel on EVERY viewport, because the whole Rig Walk screen is presented
   as a centered phone-width shell (.b5-shell--centered) even on desktop.
   So on any screen >=768px wide the entire Info/Parameters/Sensors/Status
   panel was `display:none` outright — nobody had reached it to notice,
   because Task B's own bug (the walk bar permanently covering the bottom
   of the page) hid the fact that this kit rule ALSO hid it; fixing the
   occlusion alone would have just revealed an empty band where the panel
   should be. Scoped to #walkAccordion specifically, not every .b5-accordion
   in the app — the Devices tab's own detail shell elsewhere still wants
   the kit's default desktop-tabs/mobile-accordion split; it isn't used by
   Rig Walk. */
#walkAccordion.b5-accordion { display: block; }

/* ---- Devices screen: clear-devices controls ------------------------------
   Scope buttons sit in the same filter bar row as the "Discover" button, and
   both act on the port chosen in #fixtureNodeSelect just above (the flat
   node/port select) — so the "which port" choice driving Discover is
   visually the same choice driving a scoped Clear (task ask). Danger-ghost
   by default; the arm-then-confirm
   step (js) swaps the armed button to solid .b5-btn--danger so "one more
   click deletes data" reads as a distinct, more alarming state than the
   resting button — never color alone, the label text changes too. */
.b5-clear-armed { animation: b5-clear-pulse 1.4s ease-in-out infinite; }
@keyframes b5-clear-pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--b5-color-danger-border) 35%, transparent); }
  50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--b5-color-danger-border) 12%, transparent); }
}

/* ---- Settings screen: full-reset panel -----------------------------------
   Deliberately separated from the rest of Settings (its own .b5-panel,
   danger border) and NOT wired into the page's Apply-to-confirm field
   component — the RESET-typed confirmation text IS the deliberate
   confirmation step for this one irreversible action, on top of (not
   instead of) the disabled-until-armed button. */
.b5-panel--danger-zone { border-color: var(--b5-color-danger-border); }
.b5-panel--danger-zone .b5-panel__header { border-bottom-color: var(--b5-color-danger-border); }

/* ---- Nodes: "not confirmed" caption beside the input-enable checkbox -----
   .b5-checkbox (components.css) is inline-flex around just the box+label
   text it owns; the config table's per-port input-enable cell adds a
   second, separate <span> after it (a hinted-default disclaimer — task
   ask: don't let an unconfirmed default read as confirmed state) that
   needs a little breathing room from the checkbox rather than touching it. */
td[data-label="Input enabled"] .b5-checkbox { margin-right: var(--b5-space-2); }

/* ---- Send grid: per-channel park toggle + frozen state --------------------
   Task ask ("send channels even at 0" bench fix): once every send always
   transmits all 512 slots, a stray drag on the wrong cell is one accidental
   mouse move away from lighting a hazer or moving a dowser — park exists as
   a client-side guard against exactly that, not a channel-ownership
   mechanism (the parked value is still transmitted every send). Nothing in
   the base kit models a per-cell freeze toggle or its frozen visual state,
   so both are added here rather than in components.css.
   .b5-dmx-cell__park keeps the checkbox+label compact enough to fit the
   existing 64px-min grid cell (kit's .b5-checkbox is sized for a full-width
   field row, not a cell this narrow). .is-parked recolors the cell AND
   swaps the label text (Park -> Parked, done in JS) — never color alone,
   per the standing accessibility rule — using the warning ramp so a parked
   cell reads as "handle with care", distinct from .is-active's accent tint
   for "non-zero". */
.b5-dmx-cell__park {
  display: flex;
  align-items: center;
  gap: var(--b5-space-1);
  font-size: var(--b5-font-size-xs);
  color: var(--b5-color-text-muted);
  cursor: pointer;
}
.b5-dmx-cell__park input { width: auto; min-height: 0; }
.b5-dmx-cell.is-parked {
  border-color: var(--b5-color-warn-border);
  background: var(--b5-color-warn-fill);
}
.b5-dmx-cell.is-parked .b5-dmx-cell__park-label {
  color: var(--b5-color-text-warning);
  font-weight: var(--b5-font-weight-medium);
}
.b5-dmx-cell.is-parked input:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* ---- Reset terminal dialog: title icon sizing -----------------------------
   .b5-dialog__title (components.css) is plain text in every existing kit
   usage — nothing paired it with an icon before, so it never got an
   `svg` sizing rule the way every other icon call site did
   (.b5-alert svg, .b5-badge svg, .b5-btn svg, .b5-nav__item svg, ...).
   Without one, the reset terminal state's checkmark rendered at the
   browser's unstyled default SVG size (a large solid-looking blob) instead
   of a small glyph — this is the "never color alone" pairing (status
   confirmed by icon+text, not text alone) applied to the one new usage
   site, sized the same way every other icon site already is. */
.b5-dialog__title svg { width: 22px; height: 22px; margin-right: var(--b5-space-2); vertical-align: -4px; flex: none; }

/* ---- Devices: "Benny512 has stopped asking this fixture" ------------------
   Round 4 (2026-08-25) bench finding. A fixture behind a saturated CRMX
   proxy answers nothing, so its row simply stopped filling in — at a bench
   that reads as Benny512 being broken, not as a radio-link problem. The row
   now carries a "Not answering" tag plus the server's finished sentence.

   Both signals are text; the tint is decoration on top of them, never the
   signal itself (standing accessibility constraint: never color alone). The
   warning ramp is used rather than the error red, which is reserved for
   error/destructive only — a fixture we will retry is not an error. */
.b5-table tbody tr.is-unreachable { background: var(--b5-color-warn-fill); }
.b5-device__note {
  margin-top: var(--b5-space-1);
  font-size: var(--b5-font-size-sm);
  line-height: 1.4;
  color: var(--b5-color-text-warning);
  max-width: 44ch;
  white-space: normal;
}

/* ---- Patch: floating entry/bulk editor -----------------------------------
   Phase A task ask: editing a patch entry used to mean scrolling to the
   bottom of the Patch screen every time. #patchEntryEditor (patch.js) is
   now a fixed panel that appears the instant a row is selected for
   edit/bulk-edit, with no scrolling required — but per the SAME lesson
   app.css's own --b5-walk-bar-reserve comment records ("previously bitten
   by fixed bars covering content, with nothing to scroll"), a fixed panel
   must always have matching reserved space on the content it sits over, at
   every breakpoint, or it just permanently covers whatever was there.

   Desktop/tablet (>=768px): a right-hand sidebar, narrow enough to leave
   the table's Universe/Address/Name columns visible so the editor rarely
   covers the exact row being edited. --b5-patch-editor-reserve-right
   becomes #main's padding-right whenever the editor is open, so the last
   table column and Actions buttons are never pushed under the panel with
   nothing to scroll sideways to reach (page never scrolls horizontally —
   standing responsive rule).

   Phone (<768px): there is no spare horizontal space to sit beside, so the
   panel becomes a fixed bottom sheet instead (same construction as
   .b5-walk-bar), and the reserve becomes padding-BOTTOM instead of RIGHT.
   Mirrors the walk-bar rule directly below it: derive the reserved amount
   from the panel's own sizing tokens, never a guessed px number, and
   replace (not stack with) the mobile nav bar's own reservation since here
   too the tab bar is not usable at the same time as an open editor. */
:root {
  --b5-patch-editor-reserve-right: min(400px, 92vw);
  --b5-patch-editor-reserve-bottom: min(70vh, 560px);
}
#patchEntryEditor:empty { display: none; }
/* .b5-panel already supplies background/border/border-radius (see
   benny512-layout.css) — this rule only adds the fixed positioning/sizing
   a floating panel needs on top of that. */
.b5-patch-editor__panel {
  position: fixed;
  z-index: 30;
  overflow-y: auto;
  box-shadow: var(--b5-shadow-md);
}
@media (min-width: 768px) {
  .b5-patch-editor__panel {
    top: calc(var(--b5-space-4) + 56px); /* clear the nav header */
    right: var(--b5-space-4);
    bottom: var(--b5-space-4);
    width: var(--b5-patch-editor-reserve-right);
  }
  body.b5-patch-editor-open #main.b5-app__body {
    padding-right: calc(var(--b5-patch-editor-reserve-right) + var(--b5-space-4) * 2);
  }
}
@media (max-width: 767px) {
  .b5-patch-editor__panel {
    left: 0;
    right: 0;
    bottom: 0;
    max-height: var(--b5-patch-editor-reserve-bottom);
    border-bottom: none;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body.b5-patch-editor-open .b5-nav--mobile { display: none; }
  body.b5-patch-editor-open #main.b5-app__body {
    padding-bottom: calc(var(--b5-patch-editor-reserve-bottom) + var(--b5-space-4));
  }
}
.b5-patch-editor__panel .b5-panel__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--b5-space-2);
}
.b5-patch-row--selected { background: var(--b5-color-bg-selected); }

/* ---- Nodes: device accordion (grouping ports by physical device —
   nodes.js's renderAccordion/renderDeviceGroup/renderPortRow). Moved here
   from the Devices screen (Phase B originally landed there; owner
   clarified "apply that same sorting and feature set... to the nodes tab,
   not devices... revert the changes to the device tab" — the Devices
   screen is back to a flat node/port <select>, see its own CSS elsewhere
   in this file). Each device group is a native <details>/<summary> (the
   established .b5-accordion__item/.b5-accordion__trigger pattern, see
   patch.js/walk.js); inside, one selectable row per port reuses the kit's
   .b5-checkbox label+input layout (inline-flex, touch-sized) with a radio
   input instead of a checkbox — accent-color styles either input type, so
   no new control CSS was needed there. is-selected on the row does NOT
   rely on color alone: it also gets a bordered/background tint, and the
   selected/unselected state is additionally carried by the native radio's
   own checked appearance, which remains visible regardless of custom
   styling. ---- */
#nodesAccordion .b5-accordion__panel { padding: 0 var(--b5-space-2) var(--b5-space-2); }
#nodesAccordion tr.is-selected {
  background: var(--b5-color-bg-selected);
}
#nodesAccordion tr.is-selected td:first-child {
  box-shadow: inset 3px 0 0 var(--b5-color-accent-border);
}
/* The kit hides .b5-accordion by default at >=768px (mobile-only fallback
   for the tab-strip pattern — see benny512-components.css / the existing
   #walkAccordion override above). This device grouping has no tab-strip
   equivalent and must show on every viewport, same reasoning as
   #walkAccordion. */
#nodesAccordion.b5-accordion { display: block; }

/* ============================================================
   Function Check (Phase 2b, patch.js's Rig Check screen). Additions
   appended at the end of the file per the ownership split for this piece
   of work — everything below is new, nothing above this block was
   touched.
   ============================================================ */

/* #fcAttrTree is the six-group attribute menu (Dimmer/Position/Colour/
   Beam/Focus/Shaper) — same reasoning as #nodesAccordion above: it must
   show on every viewport, not just the kit's mobile-only accordion
   fallback. */
#fcAttrTree.b5-accordion { display: block; }

/* b5-fc-stopbar: the "prominent, always-visible STOP" the task calls for.
   Sticky rather than fixed — fixed bars have bitten this app before (see
   the walk-bar/patch-editor reserve-space comments elsewhere in this
   file); sticky needs no body-class reserve dance and still stays on
   screen as the tech scrolls the attribute tree on a phone. Kept simple:
   always rendered (Stop only enabled while a pattern is running;
   Blackout always is, matching the classic rig check's own always-on
   Blackout button), status badge is text+icon (never color alone). */
.b5-fc-stopbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: var(--b5-space-3);
  flex-wrap: wrap;
  padding: var(--b5-space-2) var(--b5-space-3);
  margin-bottom: var(--b5-space-3);
  background: var(--b5-color-bg-surface-raised);
  border: 1px solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-md, 6px);
}
.b5-fc-stopbar__status { margin-right: auto; }
/* Touch-safe minimum (task ask: "touch targets >=44px on phones") — the
   kit's own .b5-btn is already close but STOP is the one control on this
   screen that must never be fumbled. */
.b5-fc-stopbar .b5-btn { min-height: 44px; min-width: 44px; }

/* b5-fc-funclist: the per-function listing inside an open attribute-group
   panel ("N of M fixtures" + provenance badge per function) and the
   per-fixture applied/skipped/inferred breakdown on a running pattern's
   status card. Plain list, generous touch-height rows since this is used
   at a rig, often on a phone. */
.b5-fc-funclist {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--b5-space-2);
}
.b5-fc-funclist li {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 32px;
}

/* C9 — Settings › Theme: the custom theme editor. Colours are roles only. */
.b5-theme-actions { flex-wrap: wrap; }
.b5-theme-editor { display: flex; flex-direction: column; gap: var(--b5-space-3); margin-top: var(--b5-space-3); padding: var(--b5-space-3);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-control); border-radius: var(--b5-radius-md); background: var(--b5-color-bg-surface-raised); }
.b5-theme-editor[hidden] { display: none; }
/* The verdict box keeps this browser's theme (theme-settings.js pins the
   roles on it), so Revert stays readable whatever a draft does. */
.b5-theme-verdict { padding: var(--b5-space-3);
  color: var(--b5-color-text-primary); background: var(--b5-color-bg-surface); border: var(--b5-size-state-border) solid var(--b5-color-border-control); }
/* Pinned under the chrome where there is room; on a phone it would cover
   the rows being edited, so it scrolls with them (Revert is at its top). */
@media (min-width: 768px) {
  .b5-theme-verdict { position: sticky; top: var(--b5-chrome-height, 0px); z-index: var(--b5-z-sticky); }
}
.b5-theme-verdict.is-fail { border-style: dashed; border-color: var(--b5-color-warn-border); }
.b5-theme-verdict__word { display: flex; align-items: center; gap: var(--b5-space-2); margin: 0; }
.b5-theme-failures { margin: var(--b5-space-2) 0; padding-left: 1.2em; max-height: 11em; overflow: auto; color: var(--b5-color-text-primary); }
.b5-theme-failures:empty { display: none; }
.b5-theme-group > summary { min-height: var(--b5-size-touch-min); padding: var(--b5-space-3) 0; cursor: pointer; font-weight: var(--b5-font-weight-bold); }
.b5-theme-row { display: grid; grid-template-columns: minmax(0, 1fr) var(--b5-size-touch-min) 7.5em; gap: var(--b5-space-2); align-items: center; padding: var(--b5-space-1) 0;
  border-bottom: var(--b5-border-width-thin) solid var(--b5-color-border-subtle); }
.b5-theme-row input[type="color"] { width: var(--b5-size-touch-min); height: var(--b5-size-touch-min); padding: 2px; border: var(--b5-border-width-thin) solid var(--b5-color-border-control); border-radius: var(--b5-radius-sm); background: var(--b5-color-bg-surface); }
.b5-theme-row__fail { grid-column: 1 / -1; color: var(--b5-color-text-warning); font-size: var(--b5-font-size-xs); }
.b5-theme-row__fail:empty { display: none; }
.b5-theme-row.is-fail .b5-theme-row__label { font-weight: var(--b5-font-weight-bold); }

/* ===== production: css/workspace.css ===== */
/* z-index is the SHARED SCALE's sticky layer, not a hand-picked 40. It was
   40 -- numerically equal to --b5-z-modal -- which put a page-chrome strip on
   the same layer as dialogs and above the Devices inspector (a hand-picked
   20), so the inspector's own bar, and therefore its close button, rendered
   UNDERNEATH this strip. Two components opting out of the token scale is
   exactly how that collision happens; both now use the tokens. */
.b5-show-context {
  position: sticky; top: 0; z-index: var(--b5-z-sticky);
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-2);
  padding: var(--b5-space-2) var(--b5-space-4);
  background: var(--b5-color-bg-surface); border-bottom: 1px solid var(--b5-color-border-strong);
}
.b5-show-context__name { overflow: hidden; text-overflow: ellipsis; max-width: 35vw; white-space: nowrap; }
/* Master output control (C3; restyled I2a per component-specs.md §1). The
   state is a WORD and an icon; the border repeats it without hue: 3 px solid
   when ARMED · LIVE, 3 px dashed when a lease or link is lost, thin dashed
   when disarmed. ARM is a pill in its own slot; DISARM · BLACKOUT is a
   square 60 px slab, rightmost, present in every state. */
/* The state group takes the free width and wraps INSIDE itself, so ARM and
   the slab stay on the strip's first line on wide screens. */
.b5-out { display: inline-flex; flex: 1 1 12em; flex-wrap: wrap; align-items: center; gap: var(--b5-space-1) var(--b5-space-2); min-width: 0; }
.b5-show-context > .b5-btn, .b5-show-context .b5-show-menu > .b5-btn { min-height: var(--b5-size-touch-min); }
.b5-out-state, .b5-out-sim, .b5-out-link { white-space: nowrap; }
@media (max-width: 1299px) { .b5-show-context [data-out-note] { display: none; } }
/* Tablets: state on the first line; the Show menu starts the second, with
   ARM beside the slab at its right end. (K1: from 1024 px the header and
   this strip share one row — see the K1 block at the end.) */
@media (min-width: 768px) and (max-width: 1023px) {
  .b5-show-context::before { content: ''; order: 9; flex-basis: 100%; height: 0; }
  .b5-show-context .b5-show-menu, .b5-show-context .b5-out-armslot, .b5-show-context [data-stop] { order: 10; }
  .b5-show-context .b5-out-armslot { margin-left: auto; }
  .b5-show-context > .b5-out-stop { margin-left: 0; }
  .b5-show-context .b5-out-armslot:empty + .b5-out-stop { margin-left: auto; }
}
.b5-out-state { display: inline-flex; align-items: center; gap: var(--b5-space-1); font-weight: 700; padding: 2px var(--b5-space-2);
  border: var(--b5-border-width-thin) dashed var(--b5-color-border-strong); border-radius: var(--b5-radius-sm); letter-spacing: 0.02em; }
.b5-out-state .b5-icon, .b5-out-state svg, .b5-out-sim svg, .b5-out-link svg { width: 1em; height: 1em; flex: none; }
.b5-out-state--ok { border: var(--b5-size-state-border) solid var(--b5-color-ok-border); color: var(--b5-color-text-success); }
.b5-out-state--lost { border: var(--b5-size-state-border) dashed var(--b5-color-warn-border); color: var(--b5-color-text-warning); }
.b5-out-state--error { border: var(--b5-size-state-border) solid var(--b5-color-danger-border); color: var(--b5-color-text-danger); }
/* Simulated: hatch always visible beside the words (never the only signal). */
.b5-out-sim { display: inline-flex; align-items: center; gap: var(--b5-space-1); font-size: var(--b5-font-size-xs); font-weight: 700;
  padding: 2px var(--b5-space-2); border: var(--b5-border-width-thin) solid var(--b5-color-info-border); border-radius: var(--b5-radius-sm);
  color: var(--b5-color-text-primary);
  background: repeating-linear-gradient(135deg, var(--b5-color-info-fill) 0 6px, transparent 6px 12px); }
.b5-out-link { display: inline-flex; align-items: center; gap: var(--b5-space-1); font-size: var(--b5-font-size-xs); color: var(--b5-color-text-secondary); }
.b5-out-note { font-size: var(--b5-font-size-xs); color: var(--b5-color-text-secondary); }
.b5-out-note--alert { color: var(--b5-color-text-warning); font-weight: 700; flex: 1 1 18em; min-width: 0; }
.b5-out-ack { min-height: var(--b5-size-touch-min); }
.b5-out-armslot { display: inline-flex; }
.b5-out-armslot:empty { display: none; }
.b5-out-arm { min-height: var(--b5-size-touch-min); min-width: 6.5em; font-weight: 700; letter-spacing: 0.04em; border-radius: var(--b5-radius-full); }
.b5-out-arm--go { border: var(--b5-border-width-thick) solid var(--b5-color-ok-border); color: var(--b5-color-text-success); }
.b5-out-stop { min-height: var(--b5-size-control-lg); min-width: var(--b5-size-control-lg); padding-inline: var(--b5-space-3);
  border: var(--b5-size-state-border) solid var(--b5-color-danger-border); border-radius: var(--b5-radius-none);
  color: var(--b5-color-text-danger); font-weight: 700; line-height: 1.1; letter-spacing: 0.04em; text-align: left; }
.b5-show-context > .b5-out-stop { min-height: var(--b5-size-control-lg); margin-left: auto; } /* rightmost, even when it wraps */
.b5-workspace-dialog {
  color: var(--b5-color-text-primary); background: var(--b5-color-bg-surface); border: 1px solid var(--b5-color-border-strong);
  width: min(960px, 94vw); max-width: 94vw; max-height: 88dvh;
  padding: var(--b5-space-4); border-radius: var(--b5-radius-md);
}
.b5-workspace-dialog::backdrop { background: var(--b5-color-scrim); }
.b5-workspace-dialog .b5-row { flex-wrap: wrap; }
.b5-workspace-dialog section, .b5-workspace-dialog details { margin-top: var(--b5-space-4); min-width: 0; }
.b5-workspace-list { display: grid; gap: var(--b5-space-2); max-height: 42dvh; overflow: auto; }
.b5-workspace-item { border: 1px solid var(--b5-color-border-strong); padding: var(--b5-space-3); overflow-wrap: anywhere; min-width: 0; }
.b5-workspace-item label { display: flex; gap: var(--b5-space-2); align-items: center; min-height: var(--b5-size-touch-min); }
.b5-workspace-dialog summary { cursor: pointer; min-height: var(--b5-size-touch-min); padding-block: var(--b5-space-2); }
.b5-workspace-dialog h2, .b5-workspace-dialog h3 { margin: 0; }
@media (max-width: 600px) {
  .b5-show-context { padding-inline: var(--b5-space-2); }
  .b5-show-context__nic { display: none; }
  .b5-show-context__name { max-width: 42vw; }
}

/* ---- C6c: the chrome never overlaps ------------------------------------
   The header and this strip were BOTH sticky at top:0, so as soon as the
   page scrolled the strip slid over "Benny512 / Connected" (at 390 px it
   covered it at rest too, being three rows tall). Wide screens: the strip
   sticks just below the header, at its measured height (--b5-header-height,
   app.js; the fallback is the header's own minimum). Phones: the header
   scrolls away with the page and only the strip sticks, compact, so ARM and
   DISARM · BLACKOUT are always on screen. */
.b5-show-context { top: var(--b5-header-height, calc(var(--b5-size-touch-min) + 2 * var(--b5-space-3) + 1px)); }
@media (max-width: 767px) {
  .b5-header { position: relative; top: auto; }
  .b5-show-context {
    top: 0;
    display: flex; flex-wrap: wrap; gap: var(--b5-space-1) var(--b5-space-2);
    padding: var(--b5-space-1) var(--b5-space-2);
  }
  .b5-show-context__nic { display: none; }
  /* Row 1: show name | state word. Row 2: simulated tag, link, notices.
     Last row: Show tools, Fixture library, ARM, then the slab rightmost. */
  .b5-show-context__name { flex: 1 1 0; min-width: 0; max-width: none; align-self: center; }
  /* I2f (owner 2026-10-09): while armed the name gave way to ARMED · LIVE
     and was squeezed to "D.". It is hidden visually instead — clipped, so
     assistive technology still reads it; Show tools names the show. */
  .b5-show-context[data-out-state="armed"] .b5-show-context__name {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; flex: none;
  }
  .b5-show-context .b5-out { display: contents; }
  .b5-show-context .b5-out-state { flex: 0 1 auto; max-width: 62%; font-size: var(--b5-font-size-xs); }
  .b5-show-context .b5-out-sim, .b5-show-context .b5-out-link, .b5-show-context .b5-out-note { flex: 1 1 auto; }
  .b5-show-context .b5-out-note--alert { flex: 1 1 12em; }
  .b5-show-context .b5-out-state { white-space: normal; }
  .b5-show-context [data-out-note] { display: none; }
  .b5-show-context .b5-out-armslot { display: contents; }
  .b5-show-context .b5-show-menu, .b5-show-context .b5-out-arm, .b5-show-context [data-stop] {
    order: 10; flex: 1 1 0; margin: 0;
  }
  .b5-show-context .b5-show-menu > .b5-btn { width: 100%; }
  .b5-show-context::before { content: ''; order: 9; flex-basis: 100%; height: 0; } /* line break before the buttons */
  .b5-show-context > .b5-btn, .b5-show-context .b5-show-menu > .b5-btn, .b5-show-context .b5-out-arm {
    min-width: 0; min-height: var(--b5-size-touch-min); padding-inline: var(--b5-space-1);
    white-space: normal; line-height: 1.15; font-size: var(--b5-font-size-xs); justify-content: center; text-align: center;
  }
  .b5-show-context > .b5-out-stop { min-height: var(--b5-size-control-lg); flex-direction: column; gap: 2px; letter-spacing: 0; padding-inline: 2px; }

  /* Every sticky bottom bar (Send's and Rig Check's output bars, the
     Console's selection summary) sits ABOVE the fixed bottom nav, at its
     measured height (--b5-nav-height, app.js), instead of under it. */
  .b5-actionbar { bottom: var(--b5-nav-height, calc(var(--b5-size-touch-min) + var(--b5-space-6))); }
}
/* I2d2: Show tools and the Fixture library open NON-modally (UI.showPanel)
   below the app chrome, so the master strip and DISARM stay operable. */
.b5-workspace-dialog.b5-nmpanel {
  position: fixed; top: calc(var(--b5-chrome-height, 120px) + var(--b5-space-2)); left: 0; right: 0; margin: 0 auto;
  max-height: calc(100dvh - var(--b5-chrome-height, 120px) - var(--b5-space-4)); overflow: auto;
  z-index: var(--b5-z-overlay); box-shadow: var(--b5-shadow-lg);
}

/* ---- K1: one-row header on laptop widths (W1 component-specs §1) --------
   From 1024 px the brand row and this strip share ONE sticky row: brand ·
   connection | show · adapter · output state · ARM slot · DISARM slab ·
   Show menu. The app shell becomes a grid so neither element moves in the
   DOM (phones and tablets keep their two-row chrome unchanged). The ARM
   slot keeps its width while armed so the slab never shifts. Below 1280
   the adapter and the "Shared control" link words step aside; Connected
   stays. */
@media (min-width: 1024px) {
  .b5-app { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; }
  .b5-app > * { grid-column: 1 / -1; min-width: 0; }
  .b5-app > .b5-header { grid-column: 1; grid-row: 1; border-bottom: var(--b5-border-width-thin) solid var(--b5-color-border-strong); padding-right: var(--b5-space-3); gap: var(--b5-space-3); }
  .b5-app > .b5-show-context { grid-column: 2; grid-row: 1; top: 0; flex-wrap: nowrap; padding-left: 0; }
  .b5-header__spacer { display: none; }
  .b5-show-context__name { max-width: 22vw; }
  .b5-show-context__nic { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 14vw; }
  .b5-show-context__name { flex: 0 1 auto; min-width: 4em; }
  /* The state group takes the free width and wraps INSIDE itself when a
     long state (SIMULATED, an alert) needs room; it never overlaps the
     show name or the connection pill. */
  .b5-show-context .b5-out { flex: 1 1 0; min-width: 0; flex-wrap: wrap; justify-content: flex-end; }
  .b5-show-context [data-out-note] { display: none; } /* its words are the state's tooltip (workspace.js) */
  .b5-show-context .b5-out-armslot:empty { display: inline-flex; min-width: 6.5em; }
  .b5-show-context > .b5-out-stop { margin-left: 0; }
}
@media (min-width: 1024px) and (max-width: 1279px) {
  .b5-show-context__nic, .b5-show-context .b5-out-link { display: none; }
}

/* K1 (W1b decision): the nav names the screen, so each screen's own page
   title is hidden visually from 1024 px but kept for assistive technology.
   A page header that held only the title collapses. */
@media (min-width: 1024px) {
  .b5-page-header__title {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }
  .b5-page-header:has(> .b5-page-header__title:only-child) { margin: 0; }
}


/* ===== production: css/screens-nodes.css ===== */
/* Parent-node picker + floating editor. Each pane owns its scrolling. */
.b5-nodes-workspace {
  display: grid;
  grid-template-columns: minmax(240px, 1fr) minmax(0, 2fr);
  gap: var(--b5-space-4);
  height: calc(100dvh - 15rem);
  min-height: 320px;
  min-width: 0;
}
.b5-nodes-picker, .b5-nodes-editor {
  display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
}
.b5-nodes-editor { border-color: var(--b5-color-border-strong); box-shadow: var(--b5-shadow-lg); }
.b5-nodes-workspace .b5-panel__header { flex-shrink: 0; flex-wrap: wrap; gap: var(--b5-space-2); }
#nodesAccordion, .b5-nodes-editor__body { overflow-y: auto; overscroll-behavior: contain; flex: 1; min-height: 0; }
.b5-nodes-parent { width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.b5-nodes-parent > span, .b5-nodes-parent > strong { display: block; }
.b5-nodes-tabs { display: flex; gap: var(--b5-space-2); padding: var(--b5-space-3); flex-shrink: 0; }
.b5-nodes-tabs [aria-selected="true"] { border-color: var(--b5-color-accent-border); background: var(--b5-color-bg-surface-raised); }
.b5-nodes-editor [hidden] { display: none !important; }
.b5-nodes-editor .b5-row { flex-wrap: wrap; }
@media (max-width: 767px) {
  .b5-nodes-workspace { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(100px, 1fr) minmax(0, 3fr); height: calc(100dvh - 16rem); }
  .b5-nodes-workspace .b5-panel__header { padding: var(--b5-space-2) var(--b5-space-3); }
}

/* ===== production: css/screens-console.css ===== */
/* Console-lite screen, chunk C6a: shell, selection grid, layout edit mode.
   Functional, not polished — a design agent replaces the placeholders
   (docs/design/console-lite-ui-brief.md). Every state here is a WORD, an
   icon or a border weight/style first, and a hue last (DESIGN.md rule 1). */

#screen-console { min-width: 0; }
.b5-con-ic { display: inline-flex; flex: none; }
.b5-con-ic svg { width: var(--b5-size-icon-md, 18px); height: var(--b5-size-icon-md, 18px); }

/* ---- toolbar ---- */
.b5-con-toolbar { display: flex; flex-direction: column; gap: var(--b5-space-2); min-width: 0; }
.b5-con-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-2); min-width: 0; }
.b5-con-rowlabel { font-weight: var(--b5-font-weight-bold); min-width: 4.5em; }
.b5-con-sep { flex: 0 0 var(--b5-space-2); }
/* Layer and group chips: one row that scrolls inside its own box (rule 4). */
.b5-con-chips { display: flex; gap: var(--b5-space-2); overflow-x: auto; flex: 1 1 0; min-width: 0; padding-bottom: var(--b5-space-1); }
.b5-con-chips > .b5-seg { flex: none; white-space: nowrap; }
.b5-con-chipnote { font-weight: var(--b5-font-weight-regular); color: var(--b5-color-text-secondary); }
/* I2b §4: every toolbar control is a full 44 px target on every pointer
   type (the kit's --sm button is 32 px on a mouse). */
.b5-con-toolbar .b5-btn, .b5-con-toolbar .b5-seg { min-height: var(--b5-size-touch-min); }
.b5-con-toolbar .b5-seg { display: inline-flex; align-items: center; gap: var(--b5-space-1); }
/* K2: below 1024 px the tools sit on their own line under the layer chips;
   a phone scrolls that line sideways inside itself, never the page. */
.b5-con-toolset { display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-2); flex: 1 0 100%; min-width: 0; }
@media (max-width: 767px) {
  .b5-con-toolset { flex-wrap: nowrap; overflow-x: auto; padding-bottom: var(--b5-space-1); }
  .b5-con-toolset > * { flex: none; }
}
@media (min-width: 1024px) { .b5-con-toolset { display: contents; } }

.b5-con-status { min-height: 1.5em; margin: var(--b5-space-2) 0; display: flex; align-items: center; gap: var(--b5-space-2); flex-wrap: wrap; }
.b5-con-status--error { color: var(--b5-color-text-danger); border-left: var(--b5-border-width-thick) solid var(--b5-color-danger-border); padding-left: var(--b5-space-2); }
/* Not sticky: the kit bar is translucent and the page chrome above it is
   only partly sticky, so a stuck bar would sit over the grid's text. */
.b5-con-modebar { position: static; }
.b5-con-modebar[hidden] { display: none; }

/* ---- two regions: grid | edit + controls ---- */
.b5-con-main { display: flex; flex-direction: column; gap: var(--b5-space-4); min-width: 0; }
.b5-con-pane { min-width: 0; display: flex; flex-direction: column; gap: var(--b5-space-3); }
@media (min-width: 1024px) {
  .b5-con-main { flex-direction: row; align-items: flex-start; }
  .b5-con-pane--grid { flex: 3 1 0; }
  .b5-con-pane--side { flex: 2 1 0; }
}

/* ---- the grid: scrolls in its own box, never the page ---- */
.b5-con-gridbox {
  overflow: auto; max-height: 62vh; min-width: 0;
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-md); background: var(--b5-color-bg-inset);
  padding: var(--b5-space-2);
}
@media (max-width: 767px) { .b5-con-gridbox { max-height: 52vh; } }
.b5-con-layer + .b5-con-layer { margin-top: var(--b5-space-4); }
.b5-con-layerhead { display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-2); justify-content: space-between; margin-bottom: var(--b5-space-2); position: sticky; left: 0; }
.b5-con-layername { margin: 0; font-size: var(--b5-font-size-md); }
.b5-con-layerhead .b5-btn { min-height: var(--b5-size-touch-min); }
.b5-con-canvaswrap { display: inline-block; }
.b5-con-canvas {
  position: relative;
  background-color: var(--b5-color-bg-surface);
  background-image:
    linear-gradient(to right, var(--b5-color-border-subtle) 1px, transparent 1px),
    linear-gradient(to bottom, var(--b5-color-border-subtle) 1px, transparent 1px);
  background-size: var(--b5-con-cell) var(--b5-con-cell);
}
.b5-con-layer--unplaced .b5-con-canvas { background-color: var(--b5-color-bg-surface-raised); }
/* M2: Grid off (View menu) — display only. Ghost canvases keep their own background-color. */
.b5-con-gridbox.is-grid-off .b5-con-canvas { background-image: none; }

/* ---- tiles: unselected = hairline; selected = thick double outline +
   check icon + order number; partial group = dashed. ---- */
.b5-con-tile {
  position: absolute; box-sizing: border-box; padding: 2px;
  display: flex; flex-direction: column; gap: 2px;
}
.b5-con-tile__main {
  position: relative; flex: 1 1 auto; min-height: var(--b5-size-touch-min); min-width: 0; width: 100%;
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  padding: var(--b5-space-1); overflow: hidden; text-align: left;
  font: inherit; font-size: var(--b5-font-size-xs); line-height: 1.25;
  color: var(--b5-color-text-primary); background: var(--b5-color-bg-surface-raised);
  border: var(--b5-border-width-thin) solid var(--b5-color-text-muted); border-radius: var(--b5-radius-sm);
  cursor: pointer;
}
.b5-con-tile__main:focus-visible, .b5-con-cell:focus-visible, .b5-con-cellsbtn:focus-visible, .b5-con-obj__handle:focus-visible { outline: 3px solid var(--b5-color-border-focus); outline-offset: 1px; }
.b5-con-tile__name { min-width: 0; line-height: 1.15; font-weight: var(--b5-font-weight-bold); font-size: var(--b5-font-size-sm); max-width: 100%;
  overflow: hidden; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.b5-con-tile__meta { color: var(--b5-color-text-secondary); max-width: 100%; overflow: hidden; overflow-wrap: anywhere; }
.b5-con-tile__meta--line { white-space: nowrap; text-overflow: ellipsis; }
/* A multi-cell tile is at least as wide as its cells: glyph beside the
   name, so the name survives the short main button above the cell strip. */
.b5-con-tile.has-cells > .b5-con-tile__main { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--b5-space-1); align-content: start; }
.b5-con-tile.has-cells .b5-con-tile__top { grid-row: 1 / span 2; }
/* A tile that also carries a cell control keeps its name to one line. */
.b5-con-tile.has-cells .b5-con-tile__name { -webkit-line-clamp: 1; }
.b5-con-tile.has-cells .b5-con-tile__meta { white-space: nowrap; text-overflow: ellipsis; }
.b5-con-tile.has-cells .b5-con-tile__main { gap: 0 var(--b5-space-1); }
/* I2b §3: fixture glyph (sprite fx-*, chosen from capabilities) with the
   order badge in its reserved top-left corner and the flag words beside
   it. 32 px at small zooms, 48 px from 128 px cells (--b5-con-glyph). */
.b5-con-tile__top { position: relative; display: flex; align-items: flex-start; gap: var(--b5-space-1); min-height: var(--b5-con-glyph, 32px); max-width: 100%; }
.b5-con-glyph {
  flex: none; display: inline-flex; width: var(--b5-con-glyph, 32px); height: var(--b5-con-glyph, 32px);
  color: var(--b5-color-fixture-idle);
}
.b5-con-glyph svg { width: 100%; height: 100%; }
.b5-con-glyph__count {
  position: absolute; left: calc(var(--b5-con-glyph, 32px) * 0.1875); top: calc(var(--b5-con-glyph, 32px) * 0.333);
  width: calc(var(--b5-con-glyph, 32px) * 0.5625); height: calc(var(--b5-con-glyph, 32px) * 0.479);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--b5-font-mono); font-weight: var(--b5-font-weight-bold); font-size: var(--b5-font-size-xs); color: var(--b5-color-text-primary);
}
.b5-con-glyph__count::before { content: ''; position: absolute; inset: 2px; z-index: -1; background: var(--b5-color-bg-surface-overlay); }
.b5-con-glyph__count { z-index: 0; isolation: isolate; }
.b5-con-flags { align-self: center; min-width: 0; font-size: var(--b5-font-size-xs); font-weight: var(--b5-font-weight-bold); color: var(--b5-color-text-primary); overflow-wrap: anywhere; line-height: 1.15; }
.b5-con-badge {
  display: inline-flex; align-items: center; justify-content: center; min-width: 1.5em; padding: 0 3px;
  font-family: var(--b5-font-mono); font-weight: var(--b5-font-weight-bold); font-size: var(--b5-font-size-xs); line-height: 1.4;
  color: var(--b5-color-text-on-accent); background: var(--b5-color-fixture-selected); border-radius: var(--b5-radius-sm);

.b5-con-gridbox.is-compact .b5-con-glyph, .b5-con-gridbox.is-compact .b5-con-glyph__count { display: none; }
.b5-con-gridbox.is-compact .b5-con-tile__top { min-height: 0; }
.b5-con-gridbox.is-compact .b5-con-tile__top > .b5-con-badge { position: static; }
.b5-con-gridbox.is-compact .b5-con-flags { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* L2: below 56 px a tile is its fixture number only (K5 adds the intensity
   bar here). Selection keeps its outline, Highlight its outer ring; the

.b5-con-gridbox.is-tiny .b5-con-tile { padding: 1px; gap: 0; }
.b5-con-gridbox.is-tiny .b5-con-tile__main { min-height: 0; padding: 0 2px; justify-content: center; align-items: center; }
.b5-con-gridbox.is-tiny .b5-con-tile__top { justify-content: center; width: 100%; }
.b5-con-gridbox.is-tiny .b5-con-glyph, .b5-con-gridbox.is-tiny .b5-con-glyph__count,
.b5-con-gridbox.is-tiny .b5-con-tile__type, .b5-con-gridbox.is-tiny .b5-con-flags,
.b5-con-gridbox.is-tiny .b5-con-tile__meta, .b5-con-gridbox.is-tiny .b5-con-badge,
.b5-con-gridbox.is-tiny .b5-con-tag, .b5-con-gridbox.is-tiny .b5-con-cellsnote { display: none; }
.b5-con-gridbox.is-tiny .b5-con-tile__fid { font-size: clamp(10px, calc(var(--b5-con-cell) * 0.34), 15px); line-height: 1; }

/* L2: drag to pan (Lasso off, not editing). */
#consoleRoot:not(.is-editing):not(.is-lasso) .b5-con-gridbox { cursor: grab; }

.b5-con-badge[hidden] { display: none; }
/* Parent selected: 3 px outline + order badge. Highlight adds a second,
   outer ring (double outline) and the word in the accessible name. */
.b5-con-tile.is-selected > .b5-con-tile__main {
  border: var(--b5-size-state-border) solid var(--b5-color-fixture-selected); background: var(--b5-color-bg-selected);
}
.b5-con-tile.is-selected .b5-con-glyph { color: var(--b5-color-fixture-selected); }
