.b5-con-tile.is-highlight > .b5-con-tile__main { box-shadow: 0 0 0 2px var(--b5-color-bg-canvas), 0 0 0 5px var(--b5-color-fixture-highlight); }
.b5-con-tile.has-cells-selected > .b5-con-tile__main { border-left: 6px solid var(--b5-color-fixture-cell-selected); }
.b5-con-tile--group.is-partial > .b5-con-tile__main { border: var(--b5-size-state-border) dashed var(--b5-color-fixture-selected); }
.b5-con-tile--group > .b5-con-tile__main { background: var(--b5-color-bg-surface-overlay); }
/* No profile / RDM labels: dashed body. Not on wire: hatched body. Each
   also carries its words (.b5-con-flags), never the line style alone. */
.b5-con-tile.is-unprofiled > .b5-con-tile__main { border-style: dashed; }
.b5-con-tile.is-unprofiled:not(.is-selected) > .b5-con-tile__main { border-color: var(--b5-color-fixture-unprofiled); }
.b5-con-tile.is-offwire > .b5-con-tile__main {
  background-image: repeating-linear-gradient(135deg, transparent 0 7px, var(--b5-color-border-strong) 7px 8px);
}

/* Unplaced: full-contrast dashed outline plus its words ("no position"). */
.b5-con-tile.is-unplaced > .b5-con-tile__main { border-style: dashed; }

   never faded, never buttons. */

.b5-con-ghostword { font-weight: var(--b5-font-weight-bold); color: var(--b5-color-text-primary); }

.b5-con-hiddennote { margin: var(--b5-space-3) 0 0; }

/* cell strip: direct cell buttons when they fit at full touch size */
.b5-con-cells { display: flex; gap: 2px; min-height: var(--b5-size-touch-min); }
.b5-con-cell {
  position: relative; flex: 1 1 0; min-width: var(--b5-size-touch-min); min-height: var(--b5-size-touch-min);
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font: inherit; font-size: var(--b5-font-size-xs); color: var(--b5-color-text-primary);
  background: var(--b5-color-bg-surface-raised); border: var(--b5-border-width-thin) solid var(--b5-color-text-muted);
  border-radius: var(--b5-radius-sm); cursor: pointer; padding: 0;
}
.b5-con-cell.is-selected { border: var(--b5-size-state-border) solid var(--b5-color-fixture-cell-selected); background: var(--b5-color-bg-selected); }
/* Cell selected: 3 px cell outline + filled top tab + cell order (§3). */
.b5-con-cell.is-selected::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--b5-color-fixture-cell-selected); }
.b5-con-cell.is-highlight { box-shadow: 0 0 0 2px var(--b5-color-bg-canvas), 0 0 0 5px var(--b5-color-fixture-highlight); }
.b5-con-cellsbtn {
  min-height: var(--b5-size-touch-min); width: 100%; line-height: 1.1; text-align: left; display: inline-flex; align-items: center; justify-content: space-between; gap: 2px;
  font: inherit; font-size: var(--b5-font-size-xs); color: var(--b5-color-text-primary);
  background: var(--b5-color-bg-surface); border: var(--b5-border-width-thin) dashed var(--b5-color-text-muted); border-radius: var(--b5-radius-sm);
  padding: 0 var(--b5-space-1); cursor: pointer; overflow: hidden;
}
.b5-con-tile.has-cells-selected .b5-con-cellsbtn { border-style: solid; border-width: var(--b5-size-state-border); border-color: var(--b5-color-fixture-cell-selected); }
.b5-con-cellsbtn__label { flex: 1 1 auto; min-width: 0; }
.b5-con-cellsnote { font-size: var(--b5-font-size-xs); color: var(--b5-color-text-secondary); }

/* cell picker: full-size buttons below the grid */
.b5-con-picker { border: var(--b5-border-width-thick) solid var(--b5-color-accent-border); border-radius: var(--b5-radius-md); padding: var(--b5-space-3); min-width: 0; }
.b5-con-picker[hidden] { display: none; }
.b5-con-pickhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--b5-space-2); }
.b5-con-pickrow { display: flex; flex-wrap: wrap; gap: var(--b5-space-2); max-height: 40vh; overflow: auto; }
.b5-con-pickn { font-family: var(--b5-font-mono); }

/* ---- selection order list (I2b §3) ---- */
.b5-con-order { min-width: 0; border: var(--b5-border-width-thin) solid var(--b5-color-border-strong); border-radius: var(--b5-radius-md); padding: var(--b5-space-2) var(--b5-space-3); }
.b5-con-order__total { margin: var(--b5-space-1) 0; }
.b5-con-order__list { list-style: none; margin: 0; padding: 0; max-height: 30vh; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.b5-con-order__list[hidden] { display: none; }
.b5-con-order__item { display: flex; gap: var(--b5-space-2); align-items: baseline; overflow-wrap: anywhere; min-width: 0; }
.b5-con-order__n { flex: none; min-width: 2.5ch; text-align: right; font-family: var(--b5-font-mono); font-weight: var(--b5-font-weight-bold); color: var(--b5-color-text-accent); }

/* ---- lasso (I2b §4): only while Lasso is ON does a finger drag stop
   scrolling the plan. ---- */
#consoleRoot.is-lasso .b5-con-gridbox { touch-action: none; cursor: crosshair; border: var(--b5-size-state-border) dashed var(--b5-color-fixture-selected); }
.b5-con-lassobox { position: fixed; z-index: var(--b5-z-dropdown); pointer-events: none; box-sizing: border-box; border: 2px dashed var(--b5-color-fixture-selected); }
.b5-con-lassobox[hidden] { display: none; }
.b5-con-lassobox__word { position: absolute; left: 2px; top: 2px; padding: 0 4px; font-size: var(--b5-font-size-xs); font-weight: var(--b5-font-weight-bold);
  color: var(--b5-color-text-on-accent); background: var(--b5-color-fixture-selected); border-radius: var(--b5-radius-sm); }

/* ---- objects: drawn, never selectable outside edit mode ---- */
.b5-con-obj { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }

  border-top: 2px solid var(--b5-color-text-secondary); border-bottom: 2px solid var(--b5-color-text-secondary);
  background: repeating-linear-gradient(45deg, transparent 0 6px, var(--b5-color-border-strong) 6px 7px);
}
.b5-con-obj--mark .b5-con-obj__line { height: 0; margin-top: 0; border-top: 3px dashed var(--b5-color-text-warning); }
.b5-con-obj__rect { position: absolute; box-sizing: border-box; border: 2px dashed var(--b5-color-text-secondary); border-radius: var(--b5-radius-sm); }
.b5-con-obj__text { position: absolute; transform-origin: 0 0; font-weight: var(--b5-font-weight-bold); color: var(--b5-color-text-secondary); white-space: nowrap; }
.b5-con-obj__word { position: absolute; font-size: var(--b5-font-size-xs); color: var(--b5-color-text-secondary); white-space: nowrap; left: 4px; top: 2px; }
.b5-con-obj__word--line { transform: translate(-50%, 4px); }

/* ---- edit mode: drags must not scroll the page under a finger ---- */
#consoleRoot.is-editing .b5-con-tile,
#consoleRoot.is-editing .b5-con-obj__handle { touch-action: none; cursor: grab; }

.b5-con-edit { min-width: 0; border: var(--b5-border-width-thick) dashed var(--b5-color-text-warning); border-radius: var(--b5-radius-md); padding: var(--b5-space-3); }
.b5-con-edit[hidden] { display: none; }
.b5-con-editgroup { margin-top: var(--b5-space-3); display: flex; flex-direction: column; gap: var(--b5-space-2); min-width: 0; }
.b5-con-editname { margin: 0; overflow-wrap: anywhere; }
.b5-con-nudge { display: flex; flex-wrap: wrap; gap: var(--b5-space-2); }
.b5-con-inline { display: inline-flex; align-items: center; gap: var(--b5-space-2); }
.b5-con-inline .b5-select { min-height: var(--b5-size-touch-min); max-width: 60vw; }
.b5-con-layerlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--b5-space-2); }
.b5-con-layeritem { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--b5-space-2);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-strong); border-radius: var(--b5-radius-sm); padding: var(--b5-space-2); }
.b5-con-layeritem__name { overflow-wrap: anywhere; min-width: 0; }

/* ---- C6b placeholder ---- */
.b5-con-controls { border: var(--b5-border-width-thin) dashed var(--b5-color-border-strong); border-radius: var(--b5-radius-md); padding: var(--b5-space-3); min-width: 0; }

/* ---- selection summary (I2a): in flow above the grid, never sticky, so it
   can never sit over the grid or the controls. The phone's More menu hangs
   from the buttons, downward. ---- */
.b5-con-summary { position: static; margin-top: var(--b5-space-2); min-width: 0; }
.b5-con-summary__buttons { position: relative; }
.b5-con-summary__status { min-width: 0; flex: 1 1 20em; }
.b5-con-summary__names { flex: 1 1 100%; min-width: 0; color: var(--b5-color-text-secondary); font-size: var(--b5-font-size-sm);
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.b5-con-summary__buttons { flex-wrap: wrap; }
/* C6c: Store group, Highlight and Locate are inline on wide screens; on a
   phone they sit behind "More" so the bar is ONE line (count, Clear, More)
   and the grid keeps the screen. */
.b5-con-summary__morebtn { display: none; }
.b5-con-summary__more { display: contents; }
/* I2d3: the Highlight state beside the count, phone only (desktop and
   tablet show the Highlight: ON toggle itself on the bar). */
.b5-con-summary__hlstate { display: none; }
@media (max-width: 767px) {
  .b5-con-summary .b5-actionbar__title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .b5-con-summary {
    flex-wrap: nowrap; padding: var(--b5-space-1) var(--b5-space-2); gap: var(--b5-space-2); margin-top: var(--b5-space-3); }
  .b5-con-summary__status { flex: 1 1 auto; flex-wrap: nowrap; gap: var(--b5-space-2); min-width: 0; }
  /* I2e: never cut the count off ("4 selected · 4 cells" lost its end at
     390 px): its two parts are unbreakable and the cell count wraps to a
     second line inside the pill when the row is too narrow. */
  .b5-con-summary__status .b5-pill { flex-wrap: wrap; column-gap: var(--b5-space-1); row-gap: 0; max-width: 100%; border-radius: var(--b5-radius-md); }
  .b5-con-summary__countn, .b5-con-summary__countcells { white-space: nowrap; }
  .b5-con-summary__names, .b5-con-summary__long { display: none; }
  .b5-con-summary__status { flex-direction: column; align-items: flex-start; gap: var(--b5-space-1); }
  .b5-con-summary__hlstate { display: inline-flex; align-items: center; gap: var(--b5-space-1); white-space: nowrap;
    font-size: var(--b5-font-size-sm); font-weight: var(--b5-font-weight-bold); color: var(--b5-color-text-primary); }
  .b5-con-summary__buttons { flex: 0 0 auto; flex-basis: auto; flex-wrap: nowrap; gap: var(--b5-space-2); }
  /* I2d3: 8 px side padding (was 12) so "3 selected" is never clipped at 360 px. */
  .b5-con-summary__buttons > .b5-btn { min-height: var(--b5-size-touch-min); padding-inline: var(--b5-space-2); }
  .b5-con-summary__morebtn { display: inline-flex; }
  .b5-con-summary__more { display: none; }
  .b5-con-summary__more.is-open {
    display: flex; flex-direction: column; gap: var(--b5-space-2);
    position: absolute; right: 0; top: calc(100% + var(--b5-space-1)); z-index: var(--b5-z-dropdown);
    min-width: 12rem; padding: var(--b5-space-2);
    background: var(--b5-color-bg-surface-raised); border: var(--b5-border-width-thick) solid var(--b5-color-border-strong);
    border-radius: var(--b5-radius-md); box-shadow: var(--b5-shadow-lg);
  }
  .b5-con-summary__more .b5-btn, .b5-con-summary__more .b5-seg { min-height: var(--b5-size-touch-min); width: 100%; justify-content: flex-start; }
}

/* ---- I2d §15 action bar: 44 px controls, 8 px gaps; Highlight stepping;
   the Clear / Fan / Lowlight-level panel in flow under the bar. ---- */
.b5-con-summary__buttons { gap: var(--b5-space-2); align-items: flex-start; }
.b5-con-actpanel .b5-cc-fanform { display: block; }
.b5-con-actpanel .b5-btn { min-height: var(--b5-size-touch-min); }
.b5-con-summary__buttons .b5-btn, .b5-con-summary__buttons .b5-seg { min-height: var(--b5-size-touch-min); }
.b5-con-act.is-on { border-color: var(--b5-color-accent-border); background: var(--b5-color-bg-selected); }
/* M3 (owner 2026-11-17): the Plan panel reuses the action panel's look. The
   open state is the thicker border as well as the surface colour. */
.b5-con-planbtn.is-on { border-color: var(--b5-color-accent-border); border-width: var(--b5-size-state-border); background: var(--b5-color-bg-selected); }
.b5-con-planpanel .b5-btn, .b5-con-planpanel .b5-input { min-height: var(--b5-size-touch-min); }
.b5-con-planpanel { max-width: 44rem; }
.b5-con-planpanel h3 + .b5-caption { margin-top: 0; }
.b5-con-scalerow { flex-wrap: wrap; align-items: center; gap: var(--b5-space-2) var(--b5-space-3); margin-bottom: var(--b5-space-3); }
.b5-con-scaleslider { flex: 1 1 12em; min-width: 8em; min-height: var(--b5-size-touch-min); }
.b5-con-scaleinput { width: 7em; }
.b5-con-scalevalue { font-weight: var(--b5-font-weight-bold); }
.b5-con-planacts { flex-wrap: wrap; gap: var(--b5-space-2); }
.b5-con-scaleslider:focus-visible { outline: none; box-shadow: var(--b5-shadow-focus); }
.b5-con-hlstep { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-2); }
.b5-con-hlstep__words { flex: 1 1 12em; min-width: 0; overflow-wrap: anywhere; }
.b5-con-actpanel { margin-top: var(--b5-space-2); padding: var(--b5-space-3) var(--b5-space-4); min-width: 0;
  background: var(--b5-color-bg-surface-raised); border: var(--b5-border-width-thick) solid var(--b5-color-border-strong); border-radius: var(--b5-radius-md); }
.b5-con-actpanel h3 { margin: 0 0 var(--b5-space-2); font-size: var(--b5-font-size-md); }
.b5-con-actpanel__close { justify-content: flex-end; margin-top: var(--b5-space-3); }
.b5-con-scopes { display: grid; gap: var(--b5-space-2); }
.b5-con-scope { display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-1) var(--b5-space-3); }
.b5-con-scope .b5-btn { min-height: var(--b5-size-touch-min); min-width: 12em; justify-content: flex-start; }
.b5-con-scope .b5-caption { flex: 1 1 14em; min-width: 0; }
.b5-con-fanshapes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 9.5em), 1fr)); gap: var(--b5-space-2); margin-bottom: var(--b5-space-3); }
.b5-con-fanshape { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: var(--b5-size-touch-min); padding: var(--b5-space-2); text-align: left; }
.b5-con-fanshape .b5-con-ic svg { width: var(--b5-size-icon-lg, 24px); height: var(--b5-size-icon-lg, 24px); }
.b5-con-fanshape__word { font-weight: var(--b5-font-weight-bold); }
.b5-con-fanshape.is-on { border-width: var(--b5-size-state-border); }
.b5-con-fanfields { flex-wrap: wrap; gap: var(--b5-space-2) var(--b5-space-4); }
@media (max-width: 767px) {
  .b5-con-hlstep { display: flex; flex-direction: column; align-items: stretch; }
  .b5-con-hlstep .b5-btn { width: 100%; justify-content: flex-start; }
  .b5-con-hlstep__words { flex: none; }
  .b5-con-summary__more.is-open { max-height: 70vh; overflow: auto; }
}

.b5-con-dialog__actions { justify-content: flex-end; margin-top: var(--b5-space-3); }
/* I2d §14 Replace / Merge / Save-as-new: NON-modal, below the master strip
   so Disarm stays visible and operable. */
.b5-con-floatdialog {
  position: fixed; top: max(30vh, 180px); left: var(--b5-space-4); right: var(--b5-space-4);
  margin: 0 auto; width: auto; max-width: 480px; max-height: calc(100dvh - max(30vh, 180px) - var(--b5-space-4)); overflow: auto;
  z-index: var(--b5-z-overlay); padding: var(--b5-space-5);
  background: var(--b5-color-bg-surface-overlay); color: var(--b5-color-text-primary);
  border: var(--b5-border-width-thick) solid var(--b5-color-border-strong); border-radius: var(--b5-radius-md); box-shadow: var(--b5-shadow-lg);
}
.b5-con-floatdialog h3 { margin: 0 0 var(--b5-space-2); }

/* I2d2: every in-app question is a non-modal .b5-con-floatdialog (ui.js
   UI.ask / choose / notice); long confirm texts keep their line breaks. */

/* ==== K2: the Console workspace (W1 component-specs §2, §3, §5, §6, §7) ====
   ON grammar for toggles (every width): a check symbol in a reserved slot,
   bold word, 2 px accent border, pressed surface (.b5-seg.is-on). */
.b5-toggle__check { display: inline-flex; width: 1em; height: 1em; flex: none; }

.b5-con-gridbox.is-names-off .b5-con-tile__type { display: none; }
.b5-con-tile__meta[hidden] { display: none; }
.b5-con-tag { flex: none; align-self: center; margin-left: auto; padding: 0 3px; font-size: 10.5px; font-weight: var(--b5-font-weight-bold); line-height: 1.35;
  border: var(--b5-border-width-thin) solid var(--b5-color-warn-border); color: var(--b5-color-text-warning); background: var(--b5-color-bg-surface); border-radius: var(--b5-radius-sm); }

.b5-con-tile--entry.has-cells .b5-con-tile__top { grid-row: auto; }
@media (pointer: fine) {
  .b5-con-tile--entry .b5-con-cell { min-width: 22px; min-height: 22px; }
}
.b5-con-layerselect { display: none; width: auto; min-height: var(--b5-size-touch-min); }

/* Wide screens: Lowlight, Fan, Store group and Tests are in the More menu. */
.b5-con-moremenu { display: none; }
@media (min-width: 768px) {
  .b5-con-moremenu { display: inline-flex; }
  .b5-con-summary__buttons [data-lowlight], .b5-con-summary__buttons [data-fan-open],
  .b5-con-summary__buttons [data-store-group], .b5-con-summary__buttons [data-tests-jump] { display: none; }
  .b5-con-moremenu > .b5-btn { min-height: var(--b5-size-touch-min); }
}

/* From 1024 px the Console is a workspace that fills the window (its height
   is set by console.js between the chrome and the fader bar): toolbar,
   selection bar, then grid | side pane, each scrolling inside itself. */
@media (min-width: 1024px) {
  body.b5-console-mode .b5-app__body { max-width: none; padding-top: var(--b5-space-2); padding-bottom: 0; }

  #consoleRoot > .b5-page-header { display: none; }
  #consoleRoot > .b5-con-toolbar { flex: none; margin: 0; padding: 0; gap: var(--b5-space-1); }
  #consoleRoot .b5-con-tools { flex-wrap: wrap; gap: var(--b5-space-2); }
  #consoleRoot .b5-con-tools > .b5-con-rowlabel { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #consoleRoot .b5-con-tools > .b5-con-chips { flex-wrap: nowrap; }

  #consoleRoot .b5-con-grouprow:has(.b5-con-chips > .b5-caption:only-child) { display: none; } /* "no stored groups yet" */
  #consoleRoot .b5-con-pane--grid > .b5-con-order { display: none; } /* K3: it lives in the Selection order window */

  #consoleRoot .b5-con-summary__buttons { flex: none; flex-wrap: nowrap; }

  #consoleRoot .b5-con-pane--grid { min-height: 0; overflow: hidden; gap: var(--b5-space-2); }
  #consoleRoot .b5-con-pane--grid > .b5-board__head { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #consoleRoot .b5-con-gridbox { flex: 1 1 auto; min-height: 0; max-height: none; }

  /* M3 (owner 2026-11-17): the Arrange button needs room too, so below 1280 px
     the zoom slider is hidden (− / +, Fit and Ctrl+wheel/pinch still zoom) and
     the Layer selector gives up some width; Windows stays on the row. */
  #consoleRoot .b5-con-zoomslider { display: none; }
  /* K3: room for Windows on the one row (W1 §2: decorative icons go first;
     the words stay). */
  #consoleRoot .b5-con-tools .b5-menu__trigger > svg:not(.b5-menu__chev), #consoleRoot [data-lasso-toggle] > .b5-con-ic { display: none; }
  #consoleRoot .b5-con-tools { gap: var(--b5-space-1); }
  #consoleRoot .b5-con-tools .b5-seg, #consoleRoot .b5-con-tools .b5-btn { padding-inline: var(--b5-space-2); }
}


/* K3 — docked and floating windows (console-windows.js; W1 component-specs
   §4 and §8). Only from 1024 px: narrower, the regions are back in the old
   stacked layout and none of this chrome exists on screen. The workspace is
   its own stacking context (isolation), so floating windows sit above the
   grid but under every menu, the chrome and dialogs. Borders use the
   control-border role (>= 3:1 against grid, surface and selected fills in
   both themes, W1 contrast.md); the shadow is decoration, never the edge. */
.b5-con-winmenu, .b5-dock__edge, .b5-dock__drop { display: none; }
.b5-win[hidden], .b5-dock__drop[hidden], .b5-win__resize[hidden], .b5-win__body[hidden] { display: none !important; }
@media (min-width: 1024px) {
  #consoleRoot .b5-con-winmenu { display: inline-flex; margin-left: auto; }
  /* K3: long layer names scroll inside the chip strip rather than run
     under Plan | Compact (W1 §2: the toolbar's own horizontal scroll). */
  #consoleRoot .b5-con-tools { flex-wrap: nowrap; }
  #consoleRoot .b5-con-tools > .b5-con-chips { flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
  #consoleRoot .b5-con-grouprow:not(:has(> .b5-con-chips)) { display: none; } /* the chips are in the Groups window */
  #consoleRoot > .b5-con-main.is-windowed { position: relative; isolation: isolate; grid-template-columns: minmax(0, 1fr) var(--b5-dock-w, 440px); }
  #consoleRoot > .b5-con-main.is-windowed.is-dock-empty { grid-template-columns: minmax(0, 1fr); }
  #consoleRoot > .b5-con-main.is-dock-empty > .b5-dock { display: none; }
  /* The dock: its edge (a separator) on the left, layout editing when on,
     then the docked windows sharing the height. */
  #consoleRoot .is-windowed > .b5-dock { position: relative; display: flex; flex-direction: column; gap: var(--b5-space-2); overflow: hidden; padding: 0 0 0 var(--b5-space-3); border-left: var(--b5-border-width-thin) solid var(--b5-color-border-strong); }
  #consoleRoot .is-windowed > .b5-dock > .b5-con-edit:not([hidden]) { flex: 0 1 auto; max-height: 55%; overflow: auto; }
  .b5-dock__stack { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: var(--b5-space-2); }
  .is-windowed .b5-dock__edge { display: block; position: absolute; left: -6px; top: 0; bottom: 0; width: 12px; cursor: col-resize; z-index: 2; touch-action: none; }
  .is-windowed .b5-dock__edge::after { content: ''; position: absolute; left: 5px; top: 50%; width: 2px; height: 48px; margin-top: -24px; border-radius: 1px; background: var(--b5-color-border-control); }
  .b5-dock__edge:hover::after, .b5-dock__edge:focus-visible::after { background: var(--b5-color-accent-border); height: 96px; margin-top: -48px; }
  .b5-dock__edge:focus-visible { outline: 3px solid var(--b5-color-border-focus); outline-offset: -3px; }
  /* A window: title bar, then a body that scrolls inside itself. */
  .is-windowed .b5-win { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--b5-color-bg-surface); border: var(--b5-border-width-thin) solid var(--b5-color-border-control); border-radius: var(--b5-radius-md); }
  .b5-win.is-docked { flex: 1 1 0; }
  .b5-win.is-docked.is-collapsed { flex: none; }
  .b5-win.is-floating { position: absolute; z-index: 3; border-width: 2px; box-shadow: var(--b5-shadow-md); }
  .b5-win.is-floating.is-front { z-index: 4; }
  .b5-win__bar { flex: none; display: flex; align-items: center; gap: var(--b5-space-2); min-height: 44px; padding: 2px var(--b5-space-1) 2px var(--b5-space-2); background: var(--b5-color-bg-surface-raised); border-bottom: var(--b5-border-width-thin) solid var(--b5-color-border-strong); border-radius: var(--b5-radius-md) var(--b5-radius-md) 0 0; user-select: none; }
  .b5-win.is-collapsed .b5-win__bar { border-bottom: none; border-radius: var(--b5-radius-md); }
  .b5-win.is-floating .b5-win__bar { cursor: grab; touch-action: none; }
  .b5-win__bar:focus-visible { outline: 3px solid var(--b5-color-border-focus); outline-offset: -3px; }
  .b5-win__grip { display: inline-flex; color: var(--b5-color-text-muted); }
  .b5-win.is-docked .b5-win__grip { display: none; }
  .b5-win__grip svg, .b5-win__ic svg { width: 18px; height: 18px; }
  .b5-win__ic { display: inline-flex; }
  .b5-win__title { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: var(--b5-space-2); white-space: nowrap; overflow: hidden; }
  .b5-win__name { flex: none; font-weight: var(--b5-font-weight-bold); }
  .b5-win__sub { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--b5-color-text-secondary); font-size: var(--b5-font-size-sm); }
  .b5-win__acts { flex: none; display: flex; gap: var(--b5-space-1); }
  .b5-win__act { gap: var(--b5-space-1); padding-inline: var(--b5-space-2); }
  .b5-win__iconbtn { min-width: 36px; justify-content: center; }
  .b5-win__body { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: var(--b5-space-2) var(--b5-space-3) var(--b5-space-3); container-type: inline-size; }
  .b5-win.is-floating .b5-win__body { padding-bottom: 28px; } /* room for the resize grip */
  .b5-win__resize { position: absolute; right: 0; bottom: 0; width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: none; background: transparent; color: var(--b5-color-text-secondary); cursor: nwse-resize; touch-action: none; }
  .b5-win__resize:focus-visible { outline: 3px solid var(--b5-color-border-focus); outline-offset: -3px; }
  .b5-dock__drop { position: absolute; top: 0; right: 0; bottom: 0; width: min(var(--b5-dock-w, 440px), 40%); z-index: 2; display: flex; align-items: center; justify-content: center; pointer-events: none; border: 2px dashed var(--b5-color-accent-border); border-radius: var(--b5-radius-md); background: var(--b5-color-accent-fill); color: var(--b5-color-text-primary); font-weight: var(--b5-font-weight-bold); }
  /* What the windows hold: their own headings give way to the title bar. */
  .b5-win [data-controls-region] { border: none; padding: 0; }
  .b5-win [data-controls-region] > .b5-board__head, .b5-win .b5-con-order > h3 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .b5-win .b5-con-order { border: none; padding: 0; }
  .b5-win .b5-con-order__list { max-height: none; }
  .b5-win .b5-con-groupwin { display: flex; flex-direction: column; gap: var(--b5-space-2); }
  /* The chips' base rule (flex: 1 1 0, overflow-x: auto) is for a toolbar
     ROW; in this COLUMN it made the list's height 0 and clipped it to a 4 px
     sliver (owner report 2026-11-17). In the window the list takes its own
     height and wraps; the window body scrolls. */
  .b5-win .b5-con-groupwin > .b5-con-chips { flex: none; overflow: visible; padding-bottom: 0; }
  #consoleRoot .b5-win .b5-con-chips { flex-wrap: wrap; }
  #consoleRoot .b5-win .b5-con-chips .b5-con-chipnote { display: inline; }
  .b5-win .b5-con-tools, .b5-win .b5-con-tests { margin-top: var(--b5-space-3); }
  .b5-win > .b5-win__body > .b5-con-tests:first-child { margin-top: 0; }
  /* Controls tabs (W1 §8): a label is never clipped and breaks only after
     its slash. W1 asks for seven columns at a 440 px dock, but measured on
     real labels seven columns there leave 56 px a tab and the bold
     "Dimmer" runs into "Position"; so four over three until the body is
     wider than 420 px (a dock of about 460 px), seven from there. */
  .b5-win .b5-cc-tabs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); overflow: visible; }
  .b5-win .b5-cc-tab { min-width: 0; max-width: none; padding-inline: 2px; }
  .b5-win .b5-cc-tab__word { white-space: normal; overflow-wrap: normal; word-break: keep-all; }
  @container (max-width: 420px) { .b5-win .b5-cc-tabs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
}
@media (min-width: 1024px) and (pointer: coarse) {
  .is-windowed .b5-dock__edge { left: -22px; width: 44px; }
  .is-windowed .b5-dock__edge::after { left: 21px; }
  .b5-win__iconbtn { min-width: 44px; }
  .b5-win__resize { width: 44px; height: 44px; }
  .b5-win.is-floating .b5-win__body { padding-bottom: 44px; }
}

/* K4 — the Tests tab (W1 §9). From 1024 px only: the nav item is hidden
   narrower, where Tests stays inside the Console. The Tests tab is the same
   workspace (grid, toolbar, selection bar) with the Tests panel on the
   right and no fixture controls, windows or dock (W1b owner answer:

.b5-con-testpane { display: none; }
@media (max-width: 1023px) {
  .b5-nav__item--wide { display: none; }
}
/* The extra item must not push Settings off a 1024 px nav: tighter item
   padding up to 1279 px (targets stay 44 px tall). */
@media (min-width: 1024px) and (max-width: 1279px) {
  #tabs { padding-inline: var(--b5-space-3); }
  #tabs .b5-nav__item { padding-inline: var(--b5-space-2); }
}
@media (min-width: 1024px) {
  body.b5-tests-mode #consoleRoot > .b5-con-main.is-windowed { grid-template-columns: minmax(0, 1fr) clamp(420px, 34vw, 560px); }
  body.b5-tests-mode #consoleRoot .b5-dock, body.b5-tests-mode #consoleRoot .b5-win,
  body.b5-tests-mode #consoleRoot .b5-dock__drop, body.b5-tests-mode #consoleRoot .b5-con-winmenu { display: none; }
  body.b5-tests-mode #consoleRoot .b5-con-testpane { display: block; min-height: 0; overflow: auto; overscroll-behavior: contain; padding-left: var(--b5-space-3); border-left: var(--b5-border-width-thin) solid var(--b5-color-border-strong); }
  .b5-con-testpane:focus-visible { outline: 3px solid var(--b5-color-border-focus); outline-offset: -3px; }
  .b5-con-testpane > .b5-con-tests { margin: 0; }
  .b5-con-testpane [data-tests-toggle] { display: none; } /* always open here; the tab says Tests */
}

/* ===== production: css/screens-console-controls.css ===== */
/* Console-lite attribute controls (C6b), console-controls.js. Functional,
   not polished: the design agent's assets replace the placeholders. Every
   state is a word first (SET / default / MIXED / ACTIVE / ON / HOLD), then a
   border weight, then a hue. Wide content scrolls in its own box. */

.b5-cc-body { display: flex; flex-direction: column; gap: var(--b5-space-3); min-width: 0; }
.b5-cc-status { min-width: 0; }
.b5-cc-status p { display: flex; gap: var(--b5-space-2); align-items: flex-start; margin: var(--b5-space-1) 0; overflow-wrap: anywhere; }
.b5-cc-status--error { color: var(--b5-color-text-danger); border-left: var(--b5-border-width-thick) solid var(--b5-color-danger-border); padding-left: var(--b5-space-2); }
.b5-cc-cmdprogress strong { font-weight: var(--b5-font-weight-bold); }
.b5-cc-status--warn { color: var(--b5-color-text-warning); border-left: var(--b5-border-width-thick) dashed var(--b5-color-text-warning); padding-left: var(--b5-space-2); }
.b5-cc-output { display: flex; gap: var(--b5-space-2); align-items: flex-start; margin: 0; padding: var(--b5-space-2);
  border: var(--b5-border-width-thick) dashed var(--b5-color-text-warning); border-radius: var(--b5-radius-sm); color: var(--b5-color-text-secondary); }
/* I2d2: the note is kept and hidden while output is live (display:flex above
   would otherwise beat the hidden attribute). */
.b5-cc-output[hidden] { display: none; }

/* attribute family tabs (specs §14): icon, word, "n set"; the row scrolls
   in its own box on a phone. Active = bold + 3 px underline; a family the
   selection lacks says "— not on these fixtures" and is skipped. */
.b5-cc-tabs { display: flex; gap: var(--b5-space-1); overflow-x: auto; min-width: 0; border-bottom: var(--b5-border-width-thin) solid var(--b5-color-border-default); }
.b5-cc-tab {
  flex: none; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: var(--b5-size-touch-min); min-width: 5.5em; max-width: 8.5em; padding: var(--b5-space-1) var(--b5-space-2);
  font: inherit; font-size: var(--b5-font-size-sm); color: var(--b5-color-text-secondary); background: transparent; cursor: pointer;
  border: none; border-bottom: var(--b5-size-state-border) solid transparent; text-align: center;
}
.b5-cc-tab__ic { display: inline-flex; }
.b5-cc-tab__ic svg { width: var(--b5-size-icon-lg, 24px); height: var(--b5-size-icon-lg, 24px); }
.b5-cc-tab__word { white-space: nowrap; }
.b5-cc-tab.is-on { color: var(--b5-color-text-primary); font-weight: var(--b5-font-weight-bold); border-bottom-color: var(--b5-color-accent-border); }
.b5-cc-tab.is-none { cursor: default; color: var(--b5-color-text-muted); }
.b5-cc-tab:focus-visible { outline: 3px solid var(--b5-color-border-focus); outline-offset: -3px; }
.b5-cc-tabcount { font-weight: var(--b5-font-weight-regular); font-size: var(--b5-font-size-xs); line-height: 1.3; }
.b5-cc-panel { display: flex; flex-direction: column; gap: var(--b5-space-3); min-width: 0; container-type: inline-size; }
.b5-cc-valuebar { align-items: center; }
.b5-cc-units { min-height: var(--b5-size-touch-min); }

/* toolbar */
.b5-cc-toolbar { display: flex; flex-direction: column; gap: var(--b5-space-2); min-width: 0; }
.b5-cc-num { width: 6em; min-height: var(--b5-size-touch-min); }
.b5-cc-rowlabel { font-weight: var(--b5-font-weight-bold); min-width: 3.5em; }
.b5-cc-tool { border: var(--b5-border-width-thin) solid var(--b5-color-border-strong); border-radius: var(--b5-radius-sm); padding: 0 var(--b5-space-2); min-width: 0; }
.b5-cc-tool > summary { min-height: var(--b5-size-touch-min); display: flex; align-items: center; cursor: pointer; font-weight: var(--b5-font-weight-bold); }
.b5-cc-fanform { display: flex; flex-wrap: wrap; gap: var(--b5-space-2); align-items: center; padding-bottom: var(--b5-space-2); }
.b5-cc-fanform .b5-select { min-height: var(--b5-size-touch-min); max-width: 70vw; }
.b5-cc-presets, .b5-cc-presetmanage { display: flex; flex-wrap: wrap; gap: var(--b5-space-2); padding-bottom: var(--b5-space-2); }
.b5-cc-presetmanage { flex-direction: column; }

/* attribute cards */
.b5-cc-attr { border: var(--b5-border-width-thin) solid var(--b5-color-border-strong); border-radius: var(--b5-radius-sm); min-width: 0; }
.b5-cc-attrhead { display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-1) var(--b5-space-3); min-height: var(--b5-size-touch-min); padding: var(--b5-space-1) var(--b5-space-2); cursor: pointer; }
.b5-cc-attrlabel { display: inline-flex; flex-direction: column; min-width: 0; }
.b5-cc-attrname { font-size: var(--b5-font-size-md); }
.b5-cc-scope:empty { display: none; }
/* value readout (§13): the chosen unit large, the rest under it, mono */
.b5-cc-readout { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 0 var(--b5-space-2); min-width: 0; overflow-wrap: anywhere; font-variant-numeric: slashed-zero tabular-nums; }
.b5-cc-val { font-size: var(--b5-font-size-xl); color: var(--b5-color-text-primary); }
.b5-cc-valsub { flex-basis: 100%; font-size: var(--b5-font-size-xs); color: var(--b5-color-text-secondary); }
.b5-cc-markers { display: inline-flex; flex-wrap: wrap; gap: var(--b5-space-1); }
/* source words (state S): filled dot + SET, hollow circle + default */
.b5-cc-src--set { border-color: var(--b5-color-accent-border); border-width: var(--b5-border-width-thick); color: var(--b5-color-value-set); font-weight: var(--b5-font-weight-bold); }
.b5-cc-src--default { color: var(--b5-color-value-default); }
.b5-cc-src__dot { margin-right: 0.3em; }
.b5-cc-quickrow .b5-btn { min-width: var(--b5-size-touch-min); min-height: var(--b5-size-touch-min); }
.b5-cc-attrbody { padding: 0 var(--b5-space-2) var(--b5-space-2); display: flex; flex-direction: column; gap: var(--b5-space-2); min-width: 0; }
.b5-cc-fn { display: flex; flex-direction: column; gap: var(--b5-space-1); min-width: 0; }
.b5-cc-fnname { margin: var(--b5-space-1) 0 0; overflow-wrap: anywhere; }
.b5-cc-fader { min-width: 0; }
.b5-cc-faderhead { display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-1) var(--b5-space-2); min-width: 0; }
.b5-cc-faderhead .b5-param__label { flex: 1 1 10em; min-width: 0; overflow-wrap: anywhere; }
/* name, then DMX / physical range: the caption wraps to its own line before
   the name is ever broken mid-word */
.b5-cc-faderhead .b5-param__label { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--b5-space-2); }
.b5-cc-faderhead .b5-caption { white-space: normal; }
.b5-cc-exact { width: 6.5em; }
.b5-cc-faderrow { display: flex; align-items: center; gap: var(--b5-space-2); min-width: 0; }
.b5-cc-track { position: relative; flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
.b5-cc-track input[type="range"] { flex: 1 1 auto; min-width: 0; position: relative; min-height: var(--b5-size-touch-min); }
/* 44 px pressable boxes on every pointer type (specs: all pointer types) */
.b5-cc-faderrow .b5-btn, .b5-cc-position .b5-btn { min-width: var(--b5-size-touch-min); min-height: var(--b5-size-touch-min); flex: none; }
.b5-cc-fnstate { font-weight: var(--b5-font-weight-bold); color: var(--b5-color-text-accent); }
.b5-cc-faderval { display: block; font-size: var(--b5-font-size-sm); overflow-wrap: anywhere; font-variant-numeric: slashed-zero tabular-nums; }
/* MIXED: dashed band over the span the selection covers (never an average) */
.b5-cc-band { position: absolute; top: calc(50% - 7px); height: 14px; border: 2px dashed var(--b5-color-value-mixed-band); border-radius: var(--b5-radius-sm); pointer-events: none; }
.b5-cc-band[hidden] { display: none; }
/* Fine ON: a veil takes the pointer so the thumb never jumps; 1:10 drag */
.b5-cc-veil { display: none; position: absolute; inset: 0; touch-action: none; cursor: ew-resize; }
.b5-cc-body.is-fine .b5-cc-veil { display: block; }
/* keyboard hints show on focus/hover only (optional help, not the label) */
.b5-cc-hint { margin: 0; font-size: var(--b5-font-size-xs); color: var(--b5-color-text-secondary); display: none; }
.b5-cc-fader:focus-within .b5-cc-hint, .b5-cc-position:focus-within .b5-cc-hint { display: block; }
@media (hover: hover) { .b5-cc-fader:hover .b5-cc-hint { display: block; } }

/* slot and set buttons: the slot in the beam is "ON" by border + word (aria-pressed) */
.b5-cc-slots, .b5-cc-sets, .b5-cc-swatches { display: flex; flex-wrap: wrap; gap: var(--b5-space-2); }
.b5-cc-slot, .b5-cc-quick {
  display: inline-flex; align-items: center; gap: var(--b5-space-2); min-height: var(--b5-size-touch-min); min-width: var(--b5-size-touch-min);
  padding: var(--b5-space-1) var(--b5-space-2); font: inherit; font-size: var(--b5-font-size-sm); text-align: left; cursor: pointer;
  color: var(--b5-color-text-primary); background: var(--b5-color-bg-surface-raised);
  border: var(--b5-border-width-thin) solid var(--b5-color-text-muted); border-radius: var(--b5-radius-sm); max-width: 100%;
}
/* wheel slots (specs §8): 64 × 64 minimum (56 on a phone), glyph or capped
   colour, name (from file), slot number, IN word; a slot whose media or
   colour is not reported is dashed and says so. */
.b5-cc-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 9.5em), 1fr)); }
.b5-cc-slot { flex-direction: column; align-items: flex-start; min-height: var(--b5-size-slot-btn); min-width: var(--b5-size-slot-btn); gap: 2px; }
@media (max-width: 767px) {
  .b5-cc-slots { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .b5-cc-slot { min-height: 56px; min-width: 56px; }
}
.b5-cc-slot.is-unreported { border-style: dashed; }
.b5-cc-slot.is-on, .b5-cc-sets .b5-btn.is-on, .b5-cc-seglabel.is-on { border: var(--b5-size-state-border) solid var(--b5-color-accent-border); background: var(--b5-color-bg-selected); }
.b5-cc-slot.is-partial, .b5-cc-sets .b5-btn.is-partial { border: var(--b5-size-state-border) dashed var(--b5-color-accent-border); }
/* set and function-label buttons are pressable: 44 px on every pointer type (specs §7) */
.b5-cc-sets .b5-btn, .b5-cc-seglabel { min-height: var(--b5-size-touch-min); min-width: var(--b5-size-touch-min); }
.b5-cc-in { font-weight: var(--b5-font-weight-bold); color: var(--b5-color-text-primary); }
.b5-cc-in:empty { display: none; }
.b5-cc-slot__glyph { display: inline-flex; }
.b5-cc-slot__glyph svg { width: var(--b5-size-icon-xl); height: var(--b5-size-icon-xl); }
.b5-cc-slot__name { overflow-wrap: anywhere; font-weight: var(--b5-font-weight-bold); }
.b5-cc-slot__num, .b5-cc-slot__media { font-size: var(--b5-font-size-xs); color: var(--b5-color-text-secondary); overflow-wrap: anywhere; }
/* Swatches are content, never state: the frame stays full contrast, the
   colour inside is capped to the dark-venue preview brightness
   (theme-contract: content below overlay luminance). */
.b5-cc-swatch { display: inline-flex; flex: none; width: 24px; height: 24px; border-radius: var(--b5-radius-full); overflow: hidden;
  border: var(--b5-border-width-thin) solid var(--b5-color-border-control); }
.b5-cc-swatch--slot { width: var(--b5-size-icon-xl); height: var(--b5-size-icon-xl); }
.b5-cc-swatch__c { flex: 1 1 auto; filter: brightness(var(--b5-preview-max-brightness)); }

/* range rail (specs §7): proportional segments on the channel's whole
   span (overlaps stack in lanes), the current one IN by fill + thick
   underline + word; full-size label buttons below, wrapping (scrolling
   on a phone). */
.b5-cc-rail { display: flex; flex-direction: column; gap: var(--b5-space-1); min-width: 0; }
.b5-cc-rail > .b5-caption { margin: 0; }
.b5-cc-segtrack { position: relative; min-width: 0; background: var(--b5-color-track); border: var(--b5-border-width-thin) solid var(--b5-color-track-border); border-radius: var(--b5-radius-sm); }
.b5-cc-seg { position: absolute; height: 12px; box-sizing: border-box; border: var(--b5-border-width-thin) solid var(--b5-color-border-control); }
.b5-cc-seg.is-in { background: var(--b5-color-bg-selected); border: 2px solid var(--b5-color-accent-border); border-bottom-width: 4px; }
.b5-cc-segcursor { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--b5-color-text-primary); }
.b5-cc-segcursor[hidden] { display: none; }
.b5-cc-seglabels { display: flex; flex-wrap: wrap; gap: var(--b5-space-2); min-width: 0; }
.b5-cc-seglabel { display: inline-flex; flex-direction: column; align-items: flex-start; max-width: 16em; text-align: left; }
.b5-cc-seg__name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b5-cc-seg__range { font-size: var(--b5-font-size-xs); color: var(--b5-color-text-secondary); }
@media (max-width: 767px) { .b5-cc-seglabels { flex-wrap: nowrap; overflow-x: auto; } .b5-cc-seglabel { flex: none; } }
.b5-cc-fnname .b5-con-ic, .b5-param__label .b5-con-ic { display: inline-flex; vertical-align: middle; margin-right: var(--b5-space-1); }

/* shutter (specs §10): OPEN / CLOSED radios with glyph + word; CLOSED
   is a thick outline and a bold "beam blocked" line */
.b5-cc-shutbox { display: flex; flex-direction: column; gap: var(--b5-space-1); }
.b5-cc-shutter > .b5-seg { min-height: var(--b5-size-touch-min); min-width: 7em; }
.b5-cc-shutter > .b5-seg svg { width: var(--b5-size-icon-lg); height: var(--b5-size-icon-lg); }
.b5-cc-shut[aria-checked="true"] { border: var(--b5-size-state-border) solid var(--b5-color-accent-border); font-weight: var(--b5-font-weight-bold); color: var(--b5-color-text-primary); }
.b5-cc-shutstate { margin: 0; font-weight: var(--b5-font-weight-bold); }
.b5-cc-shutstate.is-closed { padding-left: var(--b5-space-2); border-left: var(--b5-size-state-border) solid var(--b5-color-warn-border); color: var(--b5-color-text-warning); }

/* hold-to-fire */
.b5-cc-hold { position: relative; overflow: hidden; border-style: dashed; border-color: var(--b5-color-text-warning); }
.b5-cc-hold__word { font-weight: var(--b5-font-weight-bold); color: var(--b5-color-text-warning); }
.b5-cc-hold__fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--b5-color-bg-selected); pointer-events: none; }
.b5-cc-hold.is-holding { border-style: solid; }
.b5-cc-hold.is-holding .b5-cc-hold__fill { width: 100%; transition: width 0.75s linear; }
.b5-cc-hold > * { position: relative; }

/* XY pad (specs §5): square 240–340 px, phone fills the width; Pan/Tilt
   labelled; centre tick; 44 px handle = first selected; dashed dots = the
   other selected fixtures (only while MIXED). */
.b5-cc-position { display: flex; flex-direction: column; gap: var(--b5-space-2); min-width: 0; }
.b5-cc-pad, .b5-cc-hold { user-select: none; -webkit-user-select: none; }
.b5-cc-pad {
  position: relative; width: min(100%, var(--b5-size-xypad-max)); aspect-ratio: 1 / 1; touch-action: none; cursor: crosshair;
  background: var(--b5-color-xypad-bg); border: var(--b5-border-width-thin) solid var(--b5-color-border-control); border-radius: var(--b5-radius-sm);
  overflow: hidden; /* a handle at an edge is clipped, never drawn over the readout */
}
.b5-cc-pad:focus-visible { outline: 3px solid var(--b5-color-border-focus); outline-offset: 3px; }
.b5-cc-pad__h, .b5-cc-pad__v { position: absolute; background: var(--b5-color-xypad-crosshair); pointer-events: none; }
.b5-cc-pad__h { left: 0; right: 0; top: 50%; height: 1px; }
.b5-cc-pad__v { top: 0; bottom: 0; left: 50%; width: 1px; }
.b5-cc-pad__tick { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; transform: translate(-50%, -50%); border: 2px solid var(--b5-color-xypad-crosshair); pointer-events: none; }
.b5-cc-pad__ax { position: absolute; font-size: var(--b5-font-size-xs); color: var(--b5-color-text-secondary); pointer-events: none; }
.b5-cc-pad__ax--x { right: 8px; bottom: 6px; }
.b5-cc-pad__ax--y { left: 8px; top: 6px; }
.b5-cc-pad__dot {
  position: absolute; width: var(--b5-size-pad-handle); height: var(--b5-size-pad-handle); transform: translate(-50%, -50%);
  border: 3px solid var(--b5-color-accent-border); border-radius: var(--b5-radius-full); pointer-events: none; background: var(--b5-color-bg-selected);
}
.b5-cc-pad__others { position: absolute; inset: 0; pointer-events: none; }
.b5-cc-pad__other { position: absolute; width: 14px; height: 14px; transform: translate(-50%, -50%); border: 2px dashed var(--b5-color-border-control); border-radius: var(--b5-radius-full); }
.b5-cc-padread { margin: 0; font-size: var(--b5-font-size-sm); overflow-wrap: anywhere; font-variant-numeric: slashed-zero tabular-nums; }
.b5-cc-poslayout { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--b5-space-3); min-width: 0; }
.b5-cc-pospair { display: flex; flex-direction: column; gap: var(--b5-space-3); min-width: 0; }
@container (min-width: 620px) {
  .b5-cc-poslayout { grid-template-columns: minmax(var(--b5-size-xypad-min), var(--b5-size-xypad-max)) minmax(0, 1fr); align-items: start; }
}

/* colour */
.b5-cc-colour { display: flex; flex-direction: column; gap: var(--b5-space-2); }
.b5-cc-capline { margin: 0; }
.b5-cc-capline { display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-1); }
.b5-cc-modetabs { display: flex; flex-wrap: wrap; gap: var(--b5-space-2); }
.b5-cc-cmodepanel, .b5-cc-picker, .b5-cc-colother { display: flex; flex-direction: column; gap: var(--b5-space-2); min-width: 0; }
.b5-cc-colother > h4 { margin: var(--b5-space-2) 0 0; }
/* hue/saturation field (specs §9): content capped by the preview
   multiplier (theme-contract); handle and words outside the dimmed area */
.b5-cc-mix { position: relative; height: 160px; max-width: 520px; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none;
  background: var(--b5-color-xypad-bg); border: var(--b5-border-width-thin) solid var(--b5-color-border-control); border-radius: var(--b5-radius-sm); overflow: hidden; }
.b5-cc-mix:focus-visible { outline: 3px solid var(--b5-color-border-focus); outline-offset: 3px; }
.b5-cc-mix__content { position: absolute; inset: 0; filter: brightness(var(--b5-preview-max-brightness)); pointer-events: none; }
.b5-cc-mix__handle { position: absolute; width: var(--b5-size-touch-min); height: var(--b5-size-touch-min); transform: translate(-50%, -50%); pointer-events: none;
  border: 3px solid var(--b5-color-border-focus); border-radius: var(--b5-radius-full); box-sizing: border-box; }
.b5-cc-mixread, .b5-cc-nearest { margin: 0; font-size: var(--b5-font-size-sm); overflow-wrap: anywhere; }
.b5-cc-nearest { font-weight: var(--b5-font-weight-bold); }
.b5-cc-nearest:empty { display: none; }

/* shaper (specs §11): 230 px numbered diagram over (phone) or beside
   (wider panel) the labelled A/B faders; blades told apart by number and
   A/B letters, never by fill; MIXED blades dashed */
.b5-cc-shaperlayout { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--b5-space-3); min-width: 0; }
.b5-cc-shaperlist { display: flex; flex-direction: column; gap: var(--b5-space-2); min-width: 0; }
@container (min-width: 620px) { .b5-cc-shaperlayout { grid-template-columns: 240px minmax(0, 1fr); align-items: start; } }
.b5-cc-shaperfig { margin: 0; display: flex; flex-direction: column; gap: var(--b5-space-1); }
.b5-cc-shaper { width: 230px; max-width: 100%; background: var(--b5-color-xypad-bg); border: var(--b5-border-width-thin) solid var(--b5-color-border-control); }
.b5-cc-shaper svg { display: block; width: 100%; height: auto; }
.b5-cc-shaper__beam { fill: none; stroke: var(--b5-color-border-control); stroke-width: 2; }
.b5-cc-shaper__blade { fill: var(--b5-color-bg-selected); stroke: var(--b5-color-accent-border); stroke-width: 2; }
.b5-cc-shaper__blade.is-mixed { stroke-dasharray: 6 4; }
.b5-cc-shaper__num { fill: var(--b5-color-text-primary); font: bold 15px var(--b5-font-mono); }
.b5-cc-shaper__ab { fill: var(--b5-color-text-secondary); font: 11px var(--b5-font-mono); }
.b5-cc-blade > h4 { margin: var(--b5-space-2) 0; }

/* raw DMX */
.b5-cc-rawsec { min-width: 0; }
.b5-cc-raw { display: flex; flex-direction: column; gap: var(--b5-space-3); }
.b5-cc-rawhead { margin: 0; }
.b5-cc-rawbank { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: var(--b5-space-2); max-height: 60vh; overflow: auto; min-width: 0; }
.b5-cc-rawch { border: var(--b5-border-width-thin) solid var(--b5-color-border-strong); border-radius: var(--b5-radius-sm); padding: var(--b5-space-2); min-width: 0; }

/* I2d §12 fixture commands: one caution section at the end of the panel,
   amber (not red), each command a 44 px button that opens a NON-modal
   confirmation dialog placed below the master strip so Disarm stays
   visible and operable. */
.b5-cc-cmdzone { margin-top: var(--b5-space-4); padding: var(--b5-space-3); border: var(--b5-border-width-thick) solid var(--b5-color-warn-border); border-radius: var(--b5-radius-md); }
.b5-cc-cmdzone h4 { display: flex; align-items: center; gap: var(--b5-space-2); margin: 0 0 var(--b5-space-2); color: var(--b5-color-text-warning); }
.b5-cc-cmdrow { flex-wrap: wrap; gap: var(--b5-space-2); }
.b5-cc-cmd { min-height: var(--b5-size-touch-min); border-color: var(--b5-color-warn-border); color: var(--b5-color-text-warning); }
.b5-cc-cmd:hover:not(:disabled) { background: var(--b5-color-warn-fill); border-color: var(--b5-color-warn-border); }
.b5-cc-seglabel--cmd { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-1); padding: var(--b5-space-1) var(--b5-space-2); border: var(--b5-border-width-thin) dashed var(--b5-color-warn-border); border-radius: var(--b5-radius-sm); }
.b5-cc-cmddialog {
  position: fixed; top: max(30vh, 180px); left: var(--b5-space-4); right: var(--b5-space-4);
  margin: 0 auto; width: auto; max-width: 440px; max-height: calc(100dvh - max(30vh, 180px) - var(--b5-space-4)); overflow: auto;
  z-index: var(--b5-z-overlay); padding: var(--b5-space-5);
  background: var(--b5-color-bg-surface-overlay); color: var(--b5-color-text-primary);
  border: var(--b5-border-width-thick) solid var(--b5-color-warn-border); border-radius: var(--b5-radius-md); box-shadow: var(--b5-shadow-lg);
}
.b5-cc-cmddialog h3 { margin: 0 0 var(--b5-space-2); }
.b5-cc-cmdlist { margin: var(--b5-space-2) 0; padding-left: var(--b5-space-5); }
.b5-cc-cmdchanged:not(:empty) { color: var(--b5-color-text-warning); font-weight: var(--b5-font-weight-bold); }
.b5-cc-cmddialog .b5-btn { min-height: var(--b5-size-touch-min); }
/* §12 optional hold component: a 60 px target for the remaining holds */
.b5-cc-hold { min-height: var(--b5-size-control-lg); }

/* I2d §14 presets: family glyph + name, "applies to n of m selected" when
   partial; T/D wrap, P scrolls in its own box. */
.b5-cc-presets { display: flex; flex-wrap: wrap; gap: var(--b5-space-2); }
.b5-cc-preset { min-height: var(--b5-size-touch-min); flex-wrap: wrap; justify-content: flex-start; text-align: left; }
.b5-cc-preset__applies { flex-basis: 100%; }
@media (max-width: 767px) { .b5-cc-presets { flex-wrap: nowrap; overflow-x: auto; padding-bottom: var(--b5-space-1); } .b5-cc-preset { flex: none; } }

/* I2e §18 raw bank: T/D cells at least 160 px, P two compact columns; the
   bank scrolls inside itself; every control 44 px. */
.b5-cc-rawbank { grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); }
.b5-cc-rawch { display: flex; flex-direction: column; gap: var(--b5-space-1); }
.b5-cc-rawslot { overflow-wrap: anywhere; }
.b5-cc-rawval { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-1); }
.b5-cc-rawch .b5-btn, .b5-cc-rawfix .b5-btn { min-height: var(--b5-size-touch-min); }
.b5-cc-rawfix { display: flex; flex-direction: column; gap: var(--b5-space-2); min-width: 0; margin-bottom: var(--b5-space-3); }
@media (max-width: 767px) { .b5-cc-rawbank { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.b5-cc-rawch .b5-param__label { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 0 var(--b5-space-1); }

/* ===== production: css/screens-console-tests.css ===== */
/* Console-lite chunk C6c: the Tests panel (console-tests.js). Functional,
   not polished. It reuses the Rig Check kit (.b5-tile toggle tiles,
   .b5-segmented, .b5-param, .b5-range-touch); this file only lays it out.
   Every state is a WORD first (ON/OFF, NOW, RUNNING, testing/skipped), then
   an icon and a border weight/style, and a hue last. */

.b5-con-tests {
  min-width: 0; margin-top: var(--b5-space-4);
  border: var(--b5-border-width-thick) solid var(--b5-color-border-strong);
  border-radius: var(--b5-radius-md); padding: var(--b5-space-3);
}
.b5-ct-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-2); margin: 0; }
.b5-ct-toggle { min-height: var(--b5-size-touch-min); font-weight: var(--b5-font-weight-bold); }
.b5-ct-headword { display: inline-flex; min-width: 0; }
.b5-ct-body { display: flex; flex-direction: column; gap: var(--b5-space-3); min-width: 0; }
.b5-ct-body[hidden] { display: none; }
.b5-ct-rule { margin: 0; }
.b5-ct-body .b5-con-inline > span { white-space: nowrap; }
.b5-ct-body p { margin-block: 0; }
.b5-ct-warn { display: flex; gap: var(--b5-space-2); align-items: flex-start; border-left: var(--b5-border-width-thick) solid var(--b5-color-text-warning); padding-left: var(--b5-space-2); }
.b5-ct-section { min-width: 0; display: flex; flex-direction: column; gap: var(--b5-space-2); }
.b5-ct-section .b5-group__head { margin: 0; }
.b5-ct-cathead { justify-content: space-between; align-items: center; flex-wrap: wrap; }
.b5-ct-scoperow { flex-wrap: wrap; align-items: center; }
.b5-ct-scope { flex: 1 1 100%; }
.b5-ct-scope > .b5-seg { min-width: 0; flex: 1 1 8em; min-height: var(--b5-size-touch-min); }
.b5-ct-scoperow .b5-select, .b5-ct-fade .b5-select, .b5-ct-editor .b5-select { min-height: var(--b5-size-touch-min); max-width: 100%; }
.b5-ct-group .b5-group__head { font-size: var(--b5-font-size-sm); }
/* Tiles: keep the kit's >= 88 px toggle; let them shrink to the pane. */
.b5-ct-tiles { grid-template-columns: repeat(auto-fill, minmax(min(12rem, 100%), 1fr)); }
.b5-ct-tile .b5-tile__toggle:disabled { cursor: not-allowed; opacity: 0.75; }
.b5-ct-tile .b5-tile__more { min-height: var(--b5-size-touch-min); }
.b5-ct-params { display: flex; flex-direction: column; gap: var(--b5-space-2); min-width: 0; }
.b5-ct-params .b5-segmented--sm > .b5-seg { min-width: 0; }
.b5-ct-fixtures { margin-top: var(--b5-space-2); }
/* I2f §16 Isolate: the kit's caution choice card (amber + explanation, not error styling). */
.b5-ct-isolate { position: relative; }
.b5-ct-isolate.is-unavailable { cursor: not-allowed; border-style: dashed; }
.b5-ct-isolate__why { color: var(--b5-color-text-primary); font-weight: var(--b5-font-weight-bold); }
/* I2f §16: a masked test stays ON and says what overrides it (words + icon + a dashed rule, never colour alone). */
.b5-ct-masked { display: flex; gap: var(--b5-space-1); align-items: flex-start; margin: 0; padding: var(--b5-space-1) var(--b5-space-2);
  border-left: var(--b5-border-width-thick) dashed var(--b5-color-text-warning); overflow-wrap: anywhere; }
.b5-ct-fixlist { list-style: none; margin: var(--b5-space-2) 0 0; padding: 0; display: flex; flex-direction: column; gap: var(--b5-space-1); overflow-wrap: anywhere; }
.b5-ct-fixlist li { display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-1); }
.b5-ct-warnings { border-left: var(--b5-border-width-thick) dashed var(--b5-color-text-warning); padding-left: var(--b5-space-2); }

/* The running sequence: a solid thick frame (paused: dashed), the step
   counter and the time left in words, the current step marked NOW. */
.b5-ct-run {
  border: 4px solid var(--b5-color-text-accent); border-radius: var(--b5-radius-md);
  padding: var(--b5-space-3); display: flex; flex-direction: column; gap: var(--b5-space-2); min-width: 0;
  background: var(--b5-color-bg-surface-raised);
}
.b5-ct-run.is-paused { border-style: dashed; }
.b5-ct-run p { margin: 0; }
.b5-ct-run__title { display: flex; align-items: center; gap: var(--b5-space-2); font-size: var(--b5-font-size-lg); overflow-wrap: anywhere; }
.b5-ct-run__step { font-weight: var(--b5-font-weight-bold); overflow-wrap: anywhere; }
.b5-ct-run__left { font-family: var(--b5-font-mono); }
.b5-ct-run__buttons { flex-wrap: wrap; }
.b5-ct-run__buttons > .b5-btn { min-height: var(--b5-size-touch-min); flex: 1 1 6em; }
.b5-ct-steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--b5-space-1); max-height: 14rem; overflow: auto; }
.b5-ct-step { display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-2); padding: var(--b5-space-1) var(--b5-space-2);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-subtle); border-radius: var(--b5-radius-sm); overflow-wrap: anywhere; }
.b5-ct-step.is-now { border: 3px solid var(--b5-color-text-accent); font-weight: var(--b5-font-weight-bold); }
.b5-ct-step__word { font-family: var(--b5-font-mono); font-size: var(--b5-font-size-xs); min-width: 3.5em; }

/* Sequences list and editor */
.b5-ct-seqlist, .b5-ct-edsteps, .b5-ct-chips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--b5-space-2); }
.b5-ct-seq { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--b5-space-2);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-strong); border-radius: var(--b5-radius-sm); padding: var(--b5-space-2); }
.b5-ct-seq.is-now { border-width: 3px; border-color: var(--b5-color-text-accent); }
.b5-ct-seq__name { overflow-wrap: anywhere; min-width: 0; }
.b5-ct-seq .b5-row, .b5-ct-editor .b5-row { flex-wrap: wrap; }
.b5-ct-edstep { border: var(--b5-border-width-thin) dashed var(--b5-color-border-strong); border-radius: var(--b5-radius-sm); padding: var(--b5-space-2);
  display: flex; flex-direction: column; gap: var(--b5-space-2); min-width: 0; }
.b5-ct-edstep__head { align-items: center; }
.b5-ct-chips { flex-direction: row; flex-wrap: wrap; }
.b5-ct-chip { display: inline-flex; align-items: center; gap: var(--b5-space-2); padding: 2px var(--b5-space-2);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-strong); border-radius: var(--b5-radius-full); overflow-wrap: anywhere; }
.b5-ct-editor .b5-input { min-height: var(--b5-size-touch-min); max-width: 100%; }
.b5-ct-editor .b5-numinput { width: 6em; }
.b5-ct-editor .b5-btn, .b5-ct-seq .b5-btn, .b5-ct-cathead .b5-btn { min-height: var(--b5-size-touch-min); }

/* ---- I2e §16 test tiles: 88 px, glyph + ON/OFF word, 1 px idle / 3 px on
   border on the control role, Settings as its own <details>. ---- */
.b5-ct-tile { border-color: var(--b5-color-border-control); }
.b5-ct-tile.is-on { border-width: var(--b5-size-state-border); }
.b5-ct-tile__top { display: flex; align-items: center; justify-content: space-between; gap: var(--b5-space-2); width: 100%; }
.b5-ct-tile__glyph { display: inline-flex; }
.b5-ct-tile__glyph svg { width: 24px; height: 24px; }
.b5-ct-settings > summary { list-style: none; cursor: pointer; }
.b5-ct-settings > summary::-webkit-details-marker { display: none; }
/* §16 P: the open panel is a full working-area sheet below the master
   strip and above the fader bar and bottom nav, with its own scroll. */
.b5-ct-sheethead { display: none; }
@media (max-width: 767px) {
  .b5-con-tests .b5-ct-body:not([hidden]) {
    position: fixed; left: 0; right: 0; z-index: var(--b5-z-overlay);
    top: var(--b5-ct-sheet-top, var(--b5-chrome-height, 0px));
    bottom: calc(var(--b5-nav-height, 0px) + var(--b5-faders-height, 0px));
    overflow-y: auto; overscroll-behavior: contain;
    padding: 0 var(--b5-space-4) var(--b5-space-4);
    background: var(--b5-color-bg-canvas); border-top: var(--b5-border-width-thick) solid var(--b5-color-border-strong);
  }
  .b5-ct-sheethead { display: flex; align-items: center; justify-content: space-between; gap: var(--b5-space-2);
    position: sticky; top: 0; z-index: 1; padding: var(--b5-space-2) 0; background: var(--b5-color-bg-canvas); }
  .b5-ct-sheethead .b5-btn { min-height: var(--b5-size-touch-min); }
}

/* ---- I2e §17 transport and editor ---- */
.b5-ct-transport > .b5-ct-stepbtn { min-height: var(--b5-size-control-lg); flex: 1 1 8em; font-size: var(--b5-font-size-lg); }
.b5-ct-transport > .b5-seg { min-height: var(--b5-size-control-lg); flex: 1 1 8em; }
/* CURRENT: word + aria-current + a 3 px leading rule (not the frame alone) */
.b5-ct-step.is-now { border: var(--b5-border-width-thin) solid var(--b5-color-border-control); border-left: var(--b5-size-state-border) solid var(--b5-color-accent-border);
  background: var(--b5-color-bg-selected); font-weight: var(--b5-font-weight-bold); }
.b5-ct-step__word { min-width: 5.5em; }
.b5-ct-edstep.is-selected { border-style: solid; border-width: var(--b5-size-state-border); border-color: var(--b5-color-accent-border); }
.b5-ct-edstep__head { flex-wrap: wrap; gap: var(--b5-space-2); }
.b5-ct-edstep__head strong { flex: 1 1 100%; }
.b5-ct-announce:empty { display: none; }

/* ===== production: css/screens-console-tools.css ===== */
/* Console-lite chunk C7: the Tools panel (console-tools.js) — raw universe
   levels and Universe Identify, the old Send screen's tools, in the Console's
   side pane. The channel cells are the kit's Send grid (.b5-dmx-grid /
   .b5-dmx-cell, with screens-tools.css's park button fit); this file only
   lays the panel out. Its action bars are NOT sticky: in a side pane under
   the Tests panel a sticky bar would ride over the Console's own sticky
   selection bar and, on a phone, the bottom nav. */
.b5-con-tools .b5-tools-raw,
.b5-con-tools .b5-tools-identify,
.b5-con-tools .b5-tools-rdm { display: flex; flex-direction: column; gap: var(--b5-space-3); min-width: 0; }
.b5-con-tools .b5-tools-rdm[hidden] { display: none; }
.b5-con-tools .b5-tools-rdm p { margin: 0; }
.b5-con-tools .b5-tools-raw .b5-step-section__head,
.b5-con-tools .b5-tools-identify .b5-step-section__head,
.b5-con-tools .b5-tools-rdm .b5-step-section__head { margin: 0; flex-wrap: wrap; }
.b5-con-tools .b5-toolbar { margin-bottom: 0; }
.b5-con-tools .b5-toolbar__row { flex-wrap: wrap; align-items: center; }
.b5-con-tools .b5-tools-pager .b5-select { min-height: var(--b5-size-touch-min); max-width: 100%; }
.b5-con-tools .b5-tools-jump { width: 6.5em; }
.b5-con-tools .b5-scrollbox { max-height: 28rem; overflow: auto; }
.b5-con-tools .b5-actionbar { position: static; margin-top: 0; }
.b5-con-tools .b5-tools-identify .b5-step-section { margin: 0; }
.b5-con-tools .b5-tools-identify .b5-bigbtn { min-width: 0; }
.b5-con-tools .b5-tools-tallyline { margin: 0; }

/* ===== production: css/screens-console-midi.css ===== */
/* Console-lite MIDI encoders (C8), console-midi.js. Functional, not
   polished. Every state is a word first (FINE / not bound / default unknown
   / Bank n of m), then a border, then a hue. 44 px targets throughout. */

.b5-midi {
  display: flex; flex-direction: column; gap: var(--b5-space-2); min-width: 0;
  padding: var(--b5-space-2); margin-bottom: var(--b5-space-2);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-strong); border-radius: var(--b5-radius-sm);
}
.b5-midi-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-2); min-width: 0; }
.b5-midi-title { font-size: var(--b5-font-size-md); }
.b5-midi-bar .b5-btn { min-height: var(--b5-size-touch-min); }
.b5-midi-input { min-height: var(--b5-size-touch-min); max-width: 100%; min-width: 0; }
.b5-midi-phase, .b5-midi-say, .b5-midi-why { margin: 0; overflow-wrap: anywhere; }
.b5-midi-phase { color: var(--b5-color-text-secondary); }
.b5-midi-phase--ok { color: var(--b5-color-text-success); }
.b5-midi-phase--warn, .b5-midi-say--warn {
  color: var(--b5-color-text-warning); border-left: var(--b5-border-width-thick) dashed var(--b5-color-text-warning); padding-left: var(--b5-space-2);
}
.b5-midi-phase--error, .b5-midi-say--error {
  color: var(--b5-color-text-danger); border-left: var(--b5-border-width-thick) solid var(--b5-color-danger-border); padding-left: var(--b5-space-2);
}
.b5-midi-say:empty { display: none; }
.b5-midi-why { color: var(--b5-color-text-secondary); grid-column: 1 / -1; }

.b5-midi-learn {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-2);
  padding: var(--b5-space-2); border: var(--b5-border-width-thick) solid var(--b5-color-accent-border); border-radius: var(--b5-radius-sm);
}
.b5-midi-learn[hidden] { display: none; }
.b5-midi-learn__words { margin: 0; font-weight: var(--b5-font-weight-bold); flex: 1 1 16em; min-width: 0; overflow-wrap: anywhere; }

/* the strip: one cell per encoder, as many per row as fit */
.b5-midi-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--b5-space-2); min-width: 0; }
.b5-midi-enc {
  display: flex; flex-direction: column; gap: var(--b5-space-1); min-width: 0; min-height: var(--b5-size-touch-min);
  padding: var(--b5-space-2); background: var(--b5-color-bg-surface-raised);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-control); border-radius: var(--b5-radius-sm);
}
.b5-midi-enc.is-empty { border-style: dashed; background: transparent; }
.b5-midi-enc__num { font-size: var(--b5-font-size-sm); color: var(--b5-color-text-secondary); font-weight: var(--b5-font-weight-bold); }
.b5-midi-enc__attr { font-weight: var(--b5-font-weight-bold); font-size: var(--b5-font-size-md); overflow-wrap: anywhere; }
.b5-midi-enc.is-empty .b5-midi-enc__attr { font-weight: var(--b5-font-weight-regular); font-size: var(--b5-font-size-sm); color: var(--b5-color-text-muted); }
.b5-midi-enc__val { font-size: var(--b5-font-size-sm); color: var(--b5-color-text-secondary); overflow-wrap: anywhere; min-height: 1.2em; }
.b5-midi-enc__tags { display: flex; flex-wrap: wrap; gap: var(--b5-space-1); }
.b5-midi-enc__tags:empty { display: none; }
.b5-midi-fine { min-height: var(--b5-size-touch-min); width: 100%; }

.b5-midi-bank { display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-2); }
.b5-midi-bank:empty { display: none; }
.b5-midi-bank .b5-btn { min-height: var(--b5-size-touch-min); min-width: var(--b5-size-touch-min); }
.b5-midi-bank__words { font-weight: var(--b5-font-weight-bold); overflow-wrap: anywhere; min-width: 0; }

.b5-midi-setupbody { display: flex; flex-direction: column; gap: var(--b5-space-3); padding-bottom: var(--b5-space-2); min-width: 0; }
.b5-midi-encrow {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-2); min-width: 0;
  padding-top: var(--b5-space-2); border-top: var(--b5-border-width-thin) solid var(--b5-color-border-default);
}
.b5-midi-encrow .b5-btn, .b5-midi-encrow .b5-select, .b5-midi-encrow .b5-input { min-height: var(--b5-size-touch-min); }
.b5-midi-encrow .b5-select { max-width: 100%; min-width: 0; }
.b5-midi-encrow__edit { flex-wrap: wrap; min-width: 0; }
.b5-midi-check { min-height: var(--b5-size-touch-min); }
.b5-midi-check input[type="checkbox"] { width: 24px; height: 24px; }

/* I2e restyle: the link state is a glyph + word pill in the bar; the strip
   cells take the control border; the encoder number is a word. */
.b5-midi-bar .b5-pill { display: inline-flex; align-items: center; gap: var(--b5-space-1); }
.b5-midi-bar .b5-pill svg { width: 18px; height: 18px; }
.b5-midi-enc.is-empty { border-color: var(--b5-color-border-control); }
.b5-midi-setup > summary { min-height: var(--b5-size-touch-min); display: flex; align-items: center; }

/* ===== production: css/faders.css ===== */
/* faders.css — the always-visible group fader bar (Console-lite G3,
   faders.js). Owner: "Always visible, on the bottom of the screen."

   PLACEMENT. A fixed bar at the bottom of every screen: on a phone just
   ABOVE the fixed bottom nav (its measured height, --b5-nav-height, app.js),
   on wide screens at the very bottom (the nav is hidden there, so the
   measured height is 0). In Rig Walk the walk bar owns the bottom edge, so
   the faders sit above its reserve. faders.js publishes the bar's own height
   as --b5-faders-height; every other bottom-sticky bar and the page body
   add it, so nothing sits under the bar and nothing is hidden behind it.
   Loaded after every screen sheet so these offsets are the last word. */
.b5-faders {
  position: fixed; left: 0; right: 0;
  bottom: var(--b5-nav-height, 0px);
  z-index: var(--b5-z-sticky);
  background: var(--b5-color-bg-surface);
  border-top: var(--b5-border-width-thick) solid var(--b5-color-border-strong);
  box-shadow: var(--b5-shadow-lg);
  min-width: 0;
}
body.b5-walk-mode .b5-faders { bottom: var(--b5-walk-bar-reserve); }
.b5-faders__head {
  display: flex; align-items: center; gap: var(--b5-space-2);
  padding: var(--b5-space-1) var(--b5-space-3);
  min-width: 0;
}
.b5-faders__toggle { font-weight: var(--b5-font-weight-bold); }
.b5-faders__head > .b5-btn { min-height: var(--b5-size-touch-min); } /* 44 px on every pointer (specs: minimum pressable box) */
.b5-faders__status { flex: 1 1 auto; min-width: 0; font-size: var(--b5-font-size-xs); color: var(--b5-color-text-warning);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b5-faders__body { padding: 0 var(--b5-space-3) var(--b5-space-2); min-width: 0; }
.b5-faders__body[hidden] { display: none; }
/* One line: a dashed border (not just a colour) marks it as a warning about
   the output state. */
.b5-faders__hint { margin: 0 0 var(--b5-space-1); padding: 2px var(--b5-space-2);
  font-size: var(--b5-font-size-xs); color: var(--b5-color-text-warning);
  border: 1px dashed var(--b5-color-warn-border); border-radius: var(--b5-radius-sm); }
/* One line where it fits; on a phone it wraps rather than cut off "ARM". */
.b5-faders__hint[hidden] { display: none; }
/* Wide content scrolls inside its own box (DESIGN.md rule 4). */
.b5-faders__rows { display: flex; gap: var(--b5-space-4); overflow-x: auto; min-width: 0; padding-bottom: var(--b5-space-1); }
.b5-faders__section { flex: 0 0 auto; display: flex; flex-direction: column; gap: var(--b5-space-1); min-width: 0; }
.b5-faders__section + .b5-faders__section { border-left: var(--b5-border-width-thick) solid var(--b5-color-border-strong); padding-left: var(--b5-space-4); }
.b5-faders__heading { margin: 0; font-size: var(--b5-font-size-xs); font-weight: var(--b5-font-weight-bold); color: var(--b5-color-text-secondary); }
.b5-faders__row { display: flex; gap: var(--b5-space-2); }
.b5-faders__empty { margin: 0; font-size: var(--b5-font-size-xs); color: var(--b5-color-text-muted); align-self: center; }

.b5-fader {
  width: 6.5rem; flex: 0 0 auto; display: flex; flex-direction: column; align-items: stretch; gap: 2px;
  padding: var(--b5-space-1); border: var(--b5-border-width-thin) solid var(--b5-color-border-strong);
  border-radius: var(--b5-radius-sm); background: var(--b5-color-bg-surface-raised); min-width: 0;
}
/* Untouched: dashed (DESIGN.md: dashed = nothing attached) and "—". */
.b5-fader.is-untouched { border-style: dashed; }
.b5-fader__label { font-size: var(--b5-font-size-xs); font-weight: var(--b5-font-weight-bold); line-height: 1.25;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere;
  min-height: 2.5em; }
.b5-fader__meta { font-size: var(--b5-font-size-xs); color: var(--b5-color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b5-fader__nc { color: var(--b5-color-text-warning); white-space: normal; line-height: 1.2; }
.b5-fader__value { margin-top: auto; font-family: var(--b5-font-mono); font-size: var(--b5-font-size-sm); font-weight: var(--b5-font-weight-bold); }
.b5-fader__track {
  position: relative; height: 80px; width: 100%; min-height: var(--b5-size-touch-min);
  background: var(--b5-color-bg-inset); border: var(--b5-border-width-thin) solid var(--b5-color-border-strong);
  border-radius: var(--b5-radius-sm); touch-action: none; cursor: ns-resize;
}
.b5-fader__track:focus-visible { outline: none; box-shadow: var(--b5-shadow-focus); }
.b5-fader__fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--b5-color-bg-selected); border-radius: inherit; }
.b5-fader__thumb { position: absolute; left: -2px; right: -2px; height: 8px; margin-bottom: -4px;
  background: var(--b5-color-text-primary); border-radius: 2px; }
.b5-fader.is-untouched .b5-fader__thumb { background: transparent; border: 2px dashed var(--b5-color-text-muted); }
.b5-fader__release { width: 100%; justify-content: center; }

/* J1 sub-fixture faders: a type with several intensity parts is one framed
   cluster — the type's name over its Master and its part faders. The frame
   and the words ("Master", the part names) carry the grouping, not colour. */
.b5-fader-cluster { flex: 0 0 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0;
  padding: 2px var(--b5-space-1) var(--b5-space-1); border: var(--b5-border-width-thick) solid var(--b5-color-border-strong);
  border-radius: var(--b5-radius-sm); }
.b5-fader-cluster__label { font-size: var(--b5-font-size-xs); font-weight: var(--b5-font-weight-bold); line-height: 1.25;
  color: var(--b5-color-text-primary); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b5-fader-cluster > .b5-faders__row { gap: var(--b5-space-1); }
/* A part's name is its only word on the fader ("Spark LED Strobe Module"):
   up to three lines, so it is read whole on a phone. */
.b5-fader-cluster .b5-fader__label { -webkit-line-clamp: 3; }
/* The Master is the first fader of its cluster: a thick rule after it. */
.b5-fader--master { border-right-width: var(--b5-border-width-thick); }

/* Phones: a shorter track so the open bar leaves the screen usable. */
@media (max-width: 767px) {
  .b5-faders__head { padding-inline: var(--b5-space-2); }
  .b5-faders__body { padding-inline: var(--b5-space-2); }
  .b5-fader { width: 5.25rem; }
  .b5-fader__track { height: var(--b5-size-touch-min); }
}

/* ---- everything else at the bottom clears the bar ---------------------- */
.b5-app__body { padding-bottom: calc(var(--b5-space-5) + var(--b5-faders-height, 0px)); }
.b5-actionbar { bottom: var(--b5-faders-height, 0px); }
.b5-toast-region { bottom: calc(var(--b5-space-4) + var(--b5-faders-height, 0px) + var(--b5-nav-height, 0px)); }
body.b5-walk-mode .b5-app__body { padding-bottom: calc(var(--b5-walk-bar-reserve) + var(--b5-faders-height, 0px)); }
@media (max-width: 767px) {
  .b5-app__body { padding-bottom: calc(var(--b5-size-touch-min) + var(--b5-space-6) + var(--b5-faders-height, 0px)); }
  .b5-actionbar { bottom: calc(var(--b5-nav-height, calc(var(--b5-size-touch-min) + var(--b5-space-6))) + var(--b5-faders-height, 0px)); }
  body.b5-walk-mode .b5-app__body { padding-bottom: calc(var(--b5-walk-bar-reserve) + var(--b5-faders-height, 0px)); }
}
