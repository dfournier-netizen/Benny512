  --b5-color-info-400: #4a6ba8;
  --b5-color-info-300: #6f8fc4;
  --b5-color-info-200: #a9c0e0;

  --b5-z-dropdown: 20;
  --b5-z-overlay: 30;
  --b5-z-modal: 40;

  --b5-color-value-set: #075e58; /* 4.5:1 minimum; pairs in contrast.json */
  --b5-color-value-default: #5d5448; /* 4.5:1 minimum; pairs in contrast.json */
  --b5-color-value-test: #2a4d85; /* 4.5:1 minimum; pairs in contrast.json */
  --b5-color-value-mixed-band: #6b6255; /* 3:1 minimum; pairs in contrast.json */
  --b5-color-grid-bg: #f7f5f0; /* 4.5:1 Background: measured against text; tone borders checked separately */
  --b5-color-grid-line: #ded9ce; /* exempt:1 Decoration only; never an essential boundary */
  --b5-color-grid-line-major: #c7c0b0; /* exempt:1 Decoration only; never an essential boundary */
  --b5-color-grid-layer-label: #423c33; /* 4.5:1 minimum; pairs in contrast.json */
  --b5-color-track: #e7e4dc; /* 4.5:1 Background: measured against text; tone borders checked separately */
  --b5-color-track-border: #6b6255; /* 3:1 minimum; pairs in contrast.json */
  --b5-color-thumb: #423c33; /* 3:1 minimum; pairs in contrast.json */
  --b5-color-thumb-border: #1c1815; /* 3:1 minimum; pairs in contrast.json */
  --b5-color-xypad-bg: #f7f5f0; /* 4.5:1 Background: measured against text; tone borders checked separately */
  --b5-color-xypad-crosshair: #6b6255; /* 3:1 minimum; pairs in contrast.json */
  /* I1b additions; see the dark block. */
  --b5-color-bg-pressed: #d9d4c9; /* 4.5:1 Background: pressed control surface; measured against text */
  --b5-color-info-border: #2a4d85; /* 3:1 minimum; info tone outline */
  --b5-color-info-fill: #dfe6f3; /* 4.5:1 Background: info tone tint; measured against text */
  --b5-color-scrim: rgba(28, 24, 21, 0.45); /* exempt: modal backdrop */
  /* C9: stale-row hatch from roles (was the base file's #efece4 / #e5e1d7);
     both endpoints are contract surfaces. */
  --b5-color-bg-stale: repeating-linear-gradient(135deg, var(--b5-color-bg-surface-raised) 0 6px, var(--b5-color-bg-inset) 6px 12px);
  --b5-color-simulated-bg: repeating-linear-gradient(135deg, var(--b5-color-bg-surface) 0 6px, var(--b5-color-bg-surface-overlay) 6px 12px);
  --b5-shadow-focus: 0 0 0 3px var(--b5-color-border-focus);
}
:root {
  --b5-size-icon-xl: 32px;
  --b5-size-control-lg: 60px;
  --b5-size-tile-min: 88px;
  --b5-size-xypad-min: 240px;
  --b5-size-xypad-max: 340px;
  --b5-size-slot-btn: 64px;
  --b5-size-fader-track: 8px;
  --b5-size-fixture-glyph: 48px;
  --b5-size-thumb-mouse: 28px;
  --b5-size-fader-length: 176px;
  --b5-size-fader-dimmer-length: 240px;
  --b5-size-pad-handle: var(--b5-size-touch-min);
  --b5-size-state-border: 3px;
  --b5-size-group-fader-width: 160px;
  --b5-preview-max-brightness: 0.12; /* content only; not a state signal */
}
/* C9c (owner, 2026-10-09): Daylight shows colour previews (the colour
   picker's swatches) at full brightness. The 0.12 default and 0.15 cap are
   dark-venue limits (theme-contract.md); Dark keeps them. */
[data-theme="light"] {
  --b5-preview-max-brightness: 1;
}

/* ===== production: css/benny512-layout.css ===== */
/*
  Benny512 layout — app shell, navigation, page grid, responsive breakpoints.
  Breakpoints: phone < 640px, tablet 640–1023px, desktop >= 1024px.
  References tokens only.
*/

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--b5-color-bg-canvas);
  color: var(--b5-color-text-primary);
  font-family: var(--b5-font-body);
  font-size: var(--b5-font-size-md);
  line-height: var(--b5-line-height-body);
  -webkit-text-size-adjust: 100%;
}

.b5-app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---- Header ---- */
.b5-header {
  display: flex;
  align-items: center;
  gap: var(--b5-space-4);
  padding: var(--b5-space-3) var(--b5-space-5);
  background: var(--b5-color-bg-surface);
  border-bottom: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  position: sticky;
  top: 0;
  z-index: var(--b5-z-sticky);
  min-height: var(--b5-size-touch-min);
}

.b5-header__brand {
  display: flex;
  align-items: center;
  gap: var(--b5-space-2);
  font-weight: var(--b5-font-weight-medium);
  font-size: var(--b5-font-size-lg);
  color: var(--b5-color-text-primary);
  text-decoration: none;
  white-space: nowrap;
}

.b5-header__logo {
  width: 28px;
  height: 28px;
  flex: none;
}

.b5-header__spacer { flex: 1 1 auto; }

.b5-connection {
  display: flex;
  align-items: center;
  gap: var(--b5-space-2);
  font-size: var(--b5-font-size-sm);
  color: var(--b5-color-text-secondary);
  padding: var(--b5-space-1) var(--b5-space-3);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-full);
  white-space: nowrap;
}

.b5-connection__dot {
  width: 8px;
  height: 8px;
  border-radius: var(--b5-radius-full);
  background: var(--b5-color-ok-border);
  flex: none;
}
.b5-connection--offline .b5-connection__dot { background: var(--b5-color-danger-border); }
.b5-connection--stale .b5-connection__dot { background: var(--b5-color-warn-border); }

/* ---- Primary nav (desktop: horizontal bar) ---- */
.b5-nav {
  display: flex;
  gap: var(--b5-space-1);
  padding: 0 var(--b5-space-5);
  background: var(--b5-color-bg-surface);
  border-bottom: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  overflow-x: auto;
}

.b5-nav__item {
  display: flex;
  align-items: center;
  gap: var(--b5-space-2);
  padding: var(--b5-space-3) var(--b5-space-4);
  color: var(--b5-color-text-secondary);
  text-decoration: none;
  font-size: var(--b5-font-size-sm);
  font-weight: var(--b5-font-weight-medium);
  border-bottom: var(--b5-border-width-thick) solid transparent;
  white-space: nowrap;
  min-height: var(--b5-size-touch-min);
}

.b5-nav__item svg { width: 18px; height: 18px; flex: none; }

.b5-nav__item:hover { color: var(--b5-color-text-primary); background: var(--b5-color-bg-hover); }
.b5-nav__item:focus-visible { outline: 2px solid var(--b5-color-border-focus); outline-offset: -2px; }
.b5-nav__item.is-active {
  color: var(--b5-color-text-primary);
  border-bottom-color: var(--b5-color-accent-border);
}

/* K1 (W1b owner answer A): Show / Network groups, Settings last. The
   group name is a word in the bar, not a colour; a rule separates groups. */
.b5-nav__group {
  display: flex; align-items: stretch; gap: var(--b5-space-1);
  padding-right: var(--b5-space-2); margin-right: var(--b5-space-2);
  border-right: var(--b5-border-width-thin) solid var(--b5-color-border-default);
}
.b5-nav__grouplabel {
  align-self: center; padding-right: var(--b5-space-1);
  font-size: var(--b5-font-size-xs); color: var(--b5-color-text-muted);
  letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
}

/* ---- Mobile bottom nav (thumb-reachable) ---- */
.b5-nav--mobile {
  display: none;
}

@media (max-width: 767px) {
  .b5-nav { display: none; }
  .b5-nav--mobile {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--b5-color-bg-surface);
    border-top: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
    z-index: var(--b5-z-sticky);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .b5-nav--mobile .b5-nav__item {
    flex: 1 1 0;
    flex-direction: column;
    gap: var(--b5-space-1);
    padding: var(--b5-space-2);
    font-size: var(--b5-font-size-xs);
    border-bottom: none;
    border-top: var(--b5-border-width-thick) solid transparent;
    min-height: var(--b5-size-touch-min);
  }
  .b5-nav--mobile .b5-nav__item.is-active { border-top-color: var(--b5-color-accent-border); }
  .b5-app__body { padding-bottom: calc(var(--b5-size-touch-min) + var(--b5-space-6)); }
}

/* ---- Page body / grid ---- */
.b5-app__body {
  flex: 1 1 auto;
  padding: var(--b5-space-5);
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
}

.b5-page-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--b5-space-4);
  flex-wrap: wrap;
  margin-bottom: var(--b5-space-5);
}

.b5-page-header__title {
  font-size: var(--b5-font-size-2xl);
  font-weight: var(--b5-font-weight-medium);
  margin: 0;
}

.b5-page-header__meta {
  color: var(--b5-color-text-muted);
  font-size: var(--b5-font-size-sm);
}

/* Two-pane layout: list + detail panel (Nodes, Devices) */
.b5-split {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr);
  gap: var(--b5-space-5);
  align-items: start;
}

@media (max-width: 1023px) {
  .b5-split { grid-template-columns: 1fr; }
}

.b5-panel {
  background: var(--b5-color-bg-surface);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  border-radius: var(--b5-radius-lg);
}

.b5-panel__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--b5-space-3);
  padding: var(--b5-space-4);
  border-bottom: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
}

.b5-panel__title {
  font-size: var(--b5-font-size-md);
  font-weight: var(--b5-font-weight-medium);
  margin: 0;
}

.b5-panel__body { padding: var(--b5-space-4); }
.b5-panel__body--flush { padding: 0; }

/* Centered constrained layout for phone-first Rig Walk on desktop */
.b5-shell--centered {
  max-width: 480px;
  margin: 0 auto;
}

/* Grid helpers */
.b5-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--b5-space-4); }
.b5-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--b5-space-4); }
@media (max-width: 767px) {
  .b5-grid-2, .b5-grid-3 { grid-template-columns: 1fr; }
}

.b5-stack { display: flex; flex-direction: column; gap: var(--b5-space-4); }
.b5-row { display: flex; align-items: center; gap: var(--b5-space-3); flex-wrap: wrap; }

.b5-visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

:focus-visible {
  outline: 2px solid var(--b5-color-border-focus);
  outline-offset: 2px;
}

/* ===== production: css/benny512-components.css ===== */
/*
  Benny512 components — references tokens only (benny512-tokens.css must be loaded first).
*/

/* =========================================================
   Buttons
   ========================================================= */
.b5-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--b5-space-2);
  min-height: var(--b5-size-touch-min);
  padding: var(--b5-space-2) var(--b5-space-4);
  border-radius: var(--b5-radius-md);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-control);
  background: var(--b5-color-bg-surface-raised);
  color: var(--b5-color-text-primary);
  font: inherit;
  font-size: var(--b5-font-size-sm);
  font-weight: var(--b5-font-weight-medium);
  cursor: pointer;
  transition: background var(--b5-motion-fast) var(--b5-motion-ease), border-color var(--b5-motion-fast) var(--b5-motion-ease);
}
.b5-btn svg { width: 18px; height: 18px; flex: none; }
.b5-btn:hover { background: var(--b5-color-bg-hover); border-color: var(--b5-color-border-strong); }
.b5-btn:active { background: var(--b5-color-bg-pressed); }
.b5-btn:disabled, .b5-btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }

.b5-btn--primary {
  background: transparent;
  border-color: var(--b5-color-accent-border);
  color: var(--b5-color-text-accent);
}
.b5-btn--primary:hover { background: var(--b5-color-accent-fill); border-color: var(--b5-color-accent-border); }
.b5-btn--primary:active { background: var(--b5-color-bg-selected); }

.b5-btn--secondary { background: transparent; }

.b5-btn--danger {
  background: transparent;
  border-color: var(--b5-color-danger-border);
  color: var(--b5-color-text-danger);
}
.b5-btn--danger:hover { background: var(--b5-color-danger-fill); border-color: var(--b5-color-danger-border); }
.b5-btn--danger:active { background: var(--b5-color-danger-fill); }

.b5-btn--ghost { background: transparent; border-color: transparent; }
.b5-btn--ghost:hover { background: var(--b5-color-bg-hover); }

.b5-btn--icon { padding: var(--b5-space-2); width: var(--b5-size-touch-min); }

.b5-btn--sm { min-height: 32px; padding: var(--b5-space-1) var(--b5-space-3); font-size: var(--b5-font-size-xs); }

.b5-btn--walk {
  min-height: var(--b5-size-touch-walk);
  font-size: var(--b5-font-size-lg);
  border-radius: var(--b5-radius-md);
  flex: 1 1 0;
}

.b5-btn--block { width: 100%; }

/* =========================================================
   Status badges — text + glyph, never color alone
   ========================================================= */
.b5-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--b5-space-1);
  padding: var(--b5-space-1) var(--b5-space-2);
  border-radius: var(--b5-radius-sm);
  font-size: var(--b5-font-size-xs);
  font-weight: var(--b5-font-weight-medium);
  letter-spacing: var(--b5-letter-spacing-sm);
  border: var(--b5-border-width-thin) solid transparent;
  white-space: nowrap;
}
.b5-badge svg { width: 14px; height: 14px; flex: none; }

.b5-badge--ok { color: var(--b5-color-text-success); border-color: var(--b5-color-ok-border); background: var(--b5-color-ok-fill); }
.b5-badge--warning { color: var(--b5-color-text-warning); border-color: var(--b5-color-warn-border); background: var(--b5-color-warn-fill); }
.b5-badge--error { color: var(--b5-color-text-danger); border-color: var(--b5-color-danger-border); background: var(--b5-color-danger-fill); }
.b5-badge--pending { color: var(--b5-color-text-muted); border-color: var(--b5-color-border-default); background: var(--b5-color-bg-surface-raised); }
.b5-badge--stale { color: var(--b5-color-text-muted); border-color: var(--b5-color-border-default); background: var(--b5-color-bg-stale); background-size: 12px 12px; }
.b5-badge--unknown { color: var(--b5-color-text-disabled); border-color: var(--b5-color-border-subtle); border-style: dashed; }

/* Device class label — neutral identity tag, not a status */
.b5-tag {
  display: inline-flex;
  align-items: center;
  padding: var(--b5-space-1) var(--b5-space-2);
  border-radius: var(--b5-radius-sm);
  font-size: var(--b5-font-size-xs);
  font-weight: var(--b5-font-weight-medium);
  background: var(--b5-color-bg-surface-raised);
  color: var(--b5-color-text-secondary);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
}
.b5-tag--info { color: var(--b5-color-text-info); border-color: var(--b5-color-info-border); background: var(--b5-color-info-fill); }

/* =========================================================
   Data table
   ========================================================= */
.b5-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--b5-font-size-sm);
  background: var(--b5-color-bg-surface);
}
.b5-table th, .b5-table td {
  padding: var(--b5-space-3) var(--b5-space-3);
  text-align: left;
  border-bottom: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  vertical-align: middle;
}
.b5-table thead th {
  color: var(--b5-color-text-muted);
  font-weight: var(--b5-font-weight-medium);
  font-size: var(--b5-font-size-xs);
  text-transform: none;
  letter-spacing: var(--b5-letter-spacing-sm);
  background: var(--b5-color-bg-surface-raised);
  position: sticky;
  top: 0;
  z-index: var(--b5-z-base);
}
.b5-table__sort {
  display: inline-flex;
  align-items: center;
  gap: var(--b5-space-1);
  background: none;
  border: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
  padding: 0;
  min-height: 32px;
}
.b5-table__sort svg { width: 14px; height: 14px; opacity: 0.5; }
.b5-table__sort.is-active svg { opacity: 1; color: var(--b5-color-text-accent); }
.b5-table__sort:hover { color: var(--b5-color-text-primary); }

.b5-table tbody tr { cursor: pointer; }
.b5-table tbody tr:hover { background: var(--b5-color-bg-hover); }
.b5-table tbody tr.is-selected { background: var(--b5-color-bg-selected); box-shadow: inset 2px 0 0 var(--b5-color-accent-border); }
.b5-table tbody tr.is-stale { background: var(--b5-color-bg-stale); background-size: 14px 14px; color: var(--b5-color-text-muted); }
.b5-table td.b5-table__mono, .b5-table th.b5-table__mono { font-family: var(--b5-font-mono); }

/* Mobile: collapse table to stacked rows/cards */
@media (max-width: 767px) {
  .b5-table--responsive thead { display: none; }
  .b5-table--responsive, .b5-table--responsive tbody, .b5-table--responsive tr, .b5-table--responsive td { display: block; width: 100%; }
  .b5-table--responsive tr {
    border: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
    border-radius: var(--b5-radius-md);
    margin-bottom: var(--b5-space-3);
    padding: var(--b5-space-2) var(--b5-space-3);
  }
  .b5-table--responsive td {
    border-bottom: none;
    padding: var(--b5-space-2) 0;
    display: flex;
    justify-content: space-between;
    gap: var(--b5-space-3);
  }
  .b5-table--responsive td::before {
    content: attr(data-label);
    color: var(--b5-color-text-muted);
    font-size: var(--b5-font-size-xs);
    flex: none;
    padding-right: var(--b5-space-3);
  }
}

/* =========================================================
   Filter / sort bar
   ========================================================= */
.b5-filterbar {
  display: flex;
  align-items: center;
  gap: var(--b5-space-2);
  flex-wrap: wrap;
  padding: var(--b5-space-3);
  background: var(--b5-color-bg-surface-raised);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  border-radius: var(--b5-radius-lg);
  margin-bottom: var(--b5-space-4);
}
.b5-filterbar__group { display: flex; align-items: center; gap: var(--b5-space-2); flex-wrap: wrap; }
.b5-filterbar__summary {
  display: flex;
  align-items: center;
  gap: var(--b5-space-1);
  color: var(--b5-color-text-muted);
  font-size: var(--b5-font-size-xs);
  margin-left: auto;
}
.b5-filterbar__chip {
  display: inline-flex;
  align-items: center;
  gap: var(--b5-space-1);
  padding: var(--b5-space-1) var(--b5-space-2);
  border-radius: var(--b5-radius-full);
  background: var(--b5-color-bg-selected);
  color: var(--b5-color-text-accent);
  font-size: var(--b5-font-size-xs);
  border: var(--b5-border-width-thin) solid var(--b5-color-accent-border);
}
.b5-filterbar__chip button { background: none; border: none; color: inherit; cursor: pointer; padding: 0; display: flex; }
.b5-filterbar__chip svg { width: 12px; height: 12px; }

/* =========================================================
   Form fields (default select/checkbox appearance kept native)
   ========================================================= */
.b5-field { display: flex; flex-direction: column; gap: var(--b5-space-1); }
.b5-field__label {
  font-size: var(--b5-font-size-sm);
  color: var(--b5-color-text-secondary);
  display: flex;
  align-items: center;
  gap: var(--b5-space-2);
}
.b5-field__hint { font-size: var(--b5-font-size-xs); color: var(--b5-color-text-muted); }
.b5-field__error { font-size: var(--b5-font-size-xs); color: var(--b5-color-text-danger); display: flex; align-items: center; gap: var(--b5-space-1); }
.b5-field__error svg { width: 14px; height: 14px; }

.b5-input, .b5-select {
  min-height: var(--b5-size-touch-min);
  padding: var(--b5-space-2) var(--b5-space-3);
  background: var(--b5-color-bg-inset);
  color: var(--b5-color-text-primary);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-md);
  font: inherit;
  font-size: var(--b5-font-size-sm);
  width: 100%;
}
.b5-input:hover, .b5-select:hover { border-color: var(--b5-color-border-strong); }
.b5-input:focus-visible, .b5-select:focus-visible { border-color: var(--b5-color-border-focus); box-shadow: var(--b5-shadow-focus); }
.b5-input--mono { font-family: var(--b5-font-mono); letter-spacing: 0.03em; }
.b5-input:disabled, .b5-select:disabled { opacity: 0.5; cursor: not-allowed; }

/* Dirty / pending / applying / success / error field states — applied to .b5-field */
.b5-field--dirty .b5-input,
.b5-field--dirty .b5-select { border-color: var(--b5-color-warn-border); box-shadow: inset 0 0 0 1px var(--b5-color-warn-border); }
.b5-field--applying .b5-input,
.b5-field--applying .b5-select { border-color: var(--b5-color-info-border); opacity: 0.8; }
.b5-field--success .b5-input,
.b5-field--success .b5-select { border-color: var(--b5-color-ok-border); }
.b5-field--error .b5-input,
.b5-field--error .b5-select { border-color: var(--b5-color-danger-border); }
.b5-field--readonly .b5-input { background: transparent; border-style: dashed; color: var(--b5-color-text-secondary); }

.b5-field__status {
  display: inline-flex;
  align-items: center;
  gap: var(--b5-space-1);
  font-size: var(--b5-font-size-xs);
  font-weight: var(--b5-font-weight-medium);
}
.b5-field--dirty .b5-field__status { color: var(--b5-color-text-warning); }
.b5-field--applying .b5-field__status { color: var(--b5-color-text-info); }
.b5-field--success .b5-field__status { color: var(--b5-color-text-success); }
.b5-field--error .b5-field__status { color: var(--b5-color-text-danger); }

.b5-field__actions { display: flex; gap: var(--b5-space-2); }

.b5-field__row { display: flex; align-items: center; gap: var(--b5-space-2); }
.b5-field__row .b5-input, .b5-field__row .b5-select { flex: 1 1 auto; }

/* Numeric stepper */
.b5-stepper { display: flex; align-items: stretch; }
.b5-stepper .b5-input { text-align: center; border-radius: 0; border-left: none; border-right: none; min-width: 0; flex: 1 1 auto; }
.b5-stepper__btn {
  min-width: var(--b5-size-touch-min);
  min-height: var(--b5-size-touch-min);
  background: var(--b5-color-bg-surface-raised);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  color: var(--b5-color-text-primary);
  font-size: var(--b5-font-size-lg);
  cursor: pointer;
}
.b5-stepper__btn:first-child { border-radius: var(--b5-radius-md) 0 0 var(--b5-radius-md); }
.b5-stepper__btn:last-child { border-radius: 0 var(--b5-radius-md) var(--b5-radius-md) 0; }
.b5-stepper__btn:hover { background: var(--b5-color-bg-hover); }

/* Checkbox / toggle */
.b5-toggle { display: inline-flex; align-items: center; gap: var(--b5-space-2); cursor: pointer; min-height: var(--b5-size-touch-min); }
.b5-toggle__track {
  width: 40px; height: 22px;
  border-radius: var(--b5-radius-full);
  background: var(--b5-color-track);
  border: var(--b5-border-width-thin) solid var(--b5-color-track-border);
  position: relative;
  flex: none;
  transition: background var(--b5-motion-base) var(--b5-motion-ease);
}
.b5-toggle__track::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;
  border-radius: var(--b5-radius-full);
  background: var(--b5-color-thumb);
  transition: transform var(--b5-motion-base) var(--b5-motion-ease);
}
.b5-toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.b5-toggle input:checked + .b5-toggle__track { background: var(--b5-color-accent-fill); border-color: var(--b5-color-accent-border); }
.b5-toggle input:checked + .b5-toggle__track::after { transform: translateX(18px); background: var(--b5-color-accent-border); }
.b5-toggle input:focus-visible + .b5-toggle__track { box-shadow: var(--b5-shadow-focus); }

.b5-checkbox { display: inline-flex; align-items: center; gap: var(--b5-space-2); min-height: var(--b5-size-touch-min); cursor: pointer; }
.b5-checkbox input {
  width: 20px; height: 20px;
  accent-color: var(--b5-color-accent-border);
  background: var(--b5-color-bg-inset);
}

/* =========================================================
   Sensor gauge
   ========================================================= */
.b5-gauge { display: flex; flex-direction: column; gap: var(--b5-space-2); }
.b5-gauge__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--b5-space-2); }
.b5-gauge__label { font-size: var(--b5-font-size-sm); color: var(--b5-color-text-secondary); }
.b5-gauge__reading { font-family: var(--b5-font-mono); font-size: var(--b5-font-size-md); color: var(--b5-color-text-primary); }
.b5-gauge__reading .b5-gauge__unit { color: var(--b5-color-text-muted); font-size: var(--b5-font-size-xs); margin-left: var(--b5-space-1); }

.b5-gauge__track {
  position: relative;
  height: 14px;
  background: var(--b5-color-bg-inset);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-full);
}
.b5-gauge__band {
  position: absolute;
  top: 0; bottom: 0;
  background: var(--b5-color-bg-selected);
  border-left: var(--b5-border-width-thin) solid var(--b5-color-accent-border);
  border-right: var(--b5-border-width-thin) solid var(--b5-color-accent-border);
}
.b5-gauge__tick {
  position: absolute;
  top: -3px;
  width: 2px;
  height: 20px;
  background: var(--b5-color-border-strong);
}
.b5-gauge__marker {
  position: absolute;
  top: -5px;
  width: 4px;
  height: 24px;
  border-radius: var(--b5-radius-sm);
  background: var(--b5-color-accent-border);
  transform: translateX(-50%);
}
.b5-gauge--out-of-range .b5-gauge__marker {
  background: var(--b5-color-danger-border);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--b5-color-danger-border) 25%, transparent);
}
.b5-gauge__scale { display: flex; justify-content: space-between; font-size: var(--b5-font-size-xs); color: var(--b5-color-text-muted); font-family: var(--b5-font-mono); }
.b5-gauge__flag {
  display: inline-flex;
  align-items: center;
  gap: var(--b5-space-1);
  font-size: var(--b5-font-size-xs);
  color: var(--b5-color-text-danger);
  font-weight: var(--b5-font-weight-medium);
}
.b5-gauge__flag svg { width: 14px; height: 14px; }
/* No declared range fallback */
.b5-gauge--no-range .b5-gauge__track { display: none; }

/* =========================================================
   Tabs (desktop) / Accordion (mobile) — same content, same markup family
   ========================================================= */
.b5-tabs__list { display: flex; gap: var(--b5-space-1); border-bottom: var(--b5-border-width-thin) solid var(--b5-color-border-subtle); overflow-x: auto; }
.b5-tabs__tab {
  padding: var(--b5-space-3) var(--b5-space-4);
  background: none;
  border: none;
  border-bottom: var(--b5-border-width-thick) solid transparent;
  color: var(--b5-color-text-secondary);
  font: inherit;
  font-weight: var(--b5-font-weight-medium);
  cursor: pointer;
  min-height: var(--b5-size-touch-min);
  white-space: nowrap;
}
.b5-tabs__tab:hover { color: var(--b5-color-text-primary); }
.b5-tabs__tab.is-active { color: var(--b5-color-text-primary); border-bottom-color: var(--b5-color-accent-border); }
.b5-tabs__panel { padding: var(--b5-space-4) 0; }

.b5-accordion__item { border-bottom: var(--b5-border-width-thin) solid var(--b5-color-border-subtle); }
.b5-accordion__trigger {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--b5-space-2);
  padding: var(--b5-space-4);
  background: none;
  border: none;
  color: var(--b5-color-text-primary);
  font: inherit;
  font-size: var(--b5-font-size-lg);
  font-weight: var(--b5-font-weight-medium);
  cursor: pointer;
  min-height: var(--b5-size-touch-min);
  text-align: left;
}
.b5-accordion__trigger svg { width: 22px; height: 22px; flex: none; transition: transform var(--b5-motion-base) var(--b5-motion-ease); }
.b5-accordion__trigger.is-open svg { transform: rotate(180deg); }
.b5-accordion__panel { padding: 0 var(--b5-space-4) var(--b5-space-4); }

@media (min-width: 768px) {
  .b5-accordion { display: none; }
}
@media (max-width: 767px) {
  .b5-tabs { display: none; }
}

/* =========================================================
   Progress / counter (Rig Walk)
   ========================================================= */
.b5-counter { text-align: center; }
.b5-counter__value { font-size: var(--b5-font-size-3xl); font-weight: var(--b5-font-weight-medium); font-family: var(--b5-font-mono); line-height: 1; }
.b5-counter__label { font-size: var(--b5-font-size-sm); color: var(--b5-color-text-muted); margin-top: var(--b5-space-1); }

.b5-progress { height: 8px; border-radius: var(--b5-radius-full); background: var(--b5-color-bg-inset); overflow: hidden; }
.b5-progress__fill { height: 100%; background: var(--b5-color-accent-border); }

.b5-tally { display: flex; gap: var(--b5-space-4); justify-content: center; margin-top: var(--b5-space-3); }
.b5-tally__item { display: flex; flex-direction: column; align-items: center; gap: var(--b5-space-1); }
.b5-tally__value { font-family: var(--b5-font-mono); font-size: var(--b5-font-size-lg); font-weight: var(--b5-font-weight-medium); }
.b5-tally__label { font-size: var(--b5-font-size-xs); color: var(--b5-color-text-muted); }
.b5-tally__item--confirmed .b5-tally__value { color: var(--b5-color-text-success); }
.b5-tally__item--problem .b5-tally__value { color: var(--b5-color-text-danger); }

.b5-walk-bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  gap: var(--b5-space-3);
  padding: var(--b5-space-3) var(--b5-space-4);
  background: var(--b5-color-bg-surface);
  border-top: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  z-index: var(--b5-z-sticky);
  padding-bottom: calc(var(--b5-space-3) + env(safe-area-inset-bottom, 0));
}

/* =========================================================
   Alerts / toasts
   ========================================================= */
.b5-alert {
  display: flex;
  gap: var(--b5-space-3);
  padding: var(--b5-space-3) var(--b5-space-4);
  border-radius: var(--b5-radius-md);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  background: var(--b5-color-bg-surface-raised);
  font-size: var(--b5-font-size-sm);
  align-items: flex-start;
}
.b5-alert svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.b5-alert__title { font-weight: var(--b5-font-weight-medium); margin: 0 0 var(--b5-space-1); }
.b5-alert__body { color: var(--b5-color-text-secondary); margin: 0; }

.b5-alert--info { border-color: var(--b5-color-info-border); color: var(--b5-color-text-info); }
.b5-alert--info .b5-alert__body { color: var(--b5-color-text-secondary); }
.b5-alert--success { border-color: var(--b5-color-ok-border); color: var(--b5-color-text-success); }
.b5-alert--warning { border-color: var(--b5-color-warn-border); color: var(--b5-color-text-warning); }
.b5-alert--danger { border-color: var(--b5-color-danger-border); color: var(--b5-color-text-danger); }

.b5-alert--caution {
  border-color: var(--b5-color-warn-border);
  background: repeating-linear-gradient(135deg, var(--b5-color-bg-surface-raised) 0 10px, var(--b5-color-warn-fill) 10px 20px);
}

.b5-toast-region { position: fixed; right: var(--b5-space-4); bottom: var(--b5-space-4); display: flex; flex-direction: column; gap: var(--b5-space-2); z-index: var(--b5-z-toast); max-width: 360px; }
.b5-toast { box-shadow: var(--b5-shadow-md); }

/* =========================================================
   Empty states
   ========================================================= */
.b5-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: var(--b5-space-2);
  padding: var(--b5-space-12) var(--b5-space-4);
  color: var(--b5-color-text-muted);
}
.b5-empty svg { width: 36px; height: 36px; opacity: 0.6; }
.b5-empty__title { color: var(--b5-color-text-secondary); font-weight: var(--b5-font-weight-medium); font-size: var(--b5-font-size-md); }
.b5-empty__body { font-size: var(--b5-font-size-sm); max-width: 40ch; }

/* =========================================================
   Loading / pending indicators
   ========================================================= */
.b5-spinner {
  width: 18px; height: 18px;
  border-radius: var(--b5-radius-full);
  border: 2px solid var(--b5-color-border-default);
  border-top-color: var(--b5-color-accent-border);
  animation: b5-spin 800ms linear infinite;
  flex: none;
}
@keyframes b5-spin { to { transform: rotate(360deg); } }

.b5-inline-wait {
  display: inline-flex;
  align-items: center;
  gap: var(--b5-space-2);
  font-size: var(--b5-font-size-xs);
  color: var(--b5-color-text-muted);
}

.b5-skeleton {
  background: linear-gradient(90deg, var(--b5-color-bg-surface-raised) 25%, var(--b5-color-bg-hover) 50%, var(--b5-color-bg-surface-raised) 75%);
  background-size: 200% 100%;
  animation: b5-skeleton 1.4s ease infinite;
  border-radius: var(--b5-radius-sm);
}
@keyframes b5-skeleton { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* =========================================================
   Hex dump / monospace data block (Analyzer)
   ========================================================= */
.b5-hexdump {
  font-family: var(--b5-font-mono);
  font-size: var(--b5-font-size-xs);
  line-height: var(--b5-line-height-tight);
  background: var(--b5-color-bg-inset);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  border-radius: var(--b5-radius-md);
  padding: var(--b5-space-3);
  overflow-x: auto;
  white-space: pre;
  color: var(--b5-color-text-secondary);
}
.b5-hexdump__offset { color: var(--b5-color-text-muted); }
.b5-hexdump__byte { color: var(--b5-color-text-primary); }
.b5-hexdump__ascii { color: var(--b5-color-text-accent); }

.b5-packet-row {
  display: grid;
  grid-template-columns: 90px 70px 1fr 1fr 60px;
  gap: var(--b5-space-3);
  padding: var(--b5-space-2) var(--b5-space-3);
  font-family: var(--b5-font-mono);
  font-size: var(--b5-font-size-xs);
  border-bottom: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  align-items: center;
  cursor: pointer;
}
.b5-packet-row:hover { background: var(--b5-color-bg-hover); }
@media (max-width: 767px) {
  .b5-packet-row { grid-template-columns: 1fr 1fr; grid-auto-rows: auto; }
}

/* =========================================================
   Cards (device summary, node summary)
   ========================================================= */
.b5-card {
  background: var(--b5-color-bg-surface);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  border-radius: var(--b5-radius-lg);
  padding: var(--b5-space-4);
}
.b5-card__kicker { font-size: var(--b5-font-size-xs); color: var(--b5-color-text-muted); text-transform: none; }
.b5-card__title { font-size: var(--b5-font-size-md); font-weight: var(--b5-font-weight-medium); margin: var(--b5-space-1) 0; }

/* =========================================================
   Send grid (DMX channel entry)
   ========================================================= */
.b5-dmx-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
  gap: var(--b5-space-2);
}
.b5-dmx-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--b5-space-1);
  padding: var(--b5-space-2);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  border-radius: var(--b5-radius-sm);
  background: var(--b5-color-bg-surface-raised);
}
.b5-dmx-cell__ch { font-size: var(--b5-font-size-xs); color: var(--b5-color-text-muted); font-family: var(--b5-font-mono); }
.b5-dmx-cell input {
  width: 100%;
  text-align: center;
  background: var(--b5-color-bg-inset);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-sm);
  color: var(--b5-color-text-primary);
  font-family: var(--b5-font-mono);
  min-height: 36px;
}
.b5-dmx-cell.is-active { border-color: var(--b5-color-accent-border); background: var(--b5-color-bg-selected); }

.b5-fader {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--b5-space-2);
}
.b5-fader input[type="range"] { writing-mode: vertical-lr; direction: rtl; width: 32px; height: 160px; accent-color: var(--b5-color-accent-border); }

/* =========================================================
   Dialog (used sparingly — e.g. confirm destructive IP change)
   ========================================================= */
.b5-dialog-backdrop {
  position: fixed; inset: 0;
  background: var(--b5-color-scrim);
  display: flex; align-items: center; justify-content: center;
  z-index: var(--b5-z-modal);
  padding: var(--b5-space-4);
}
.b5-dialog {
  background: var(--b5-color-bg-surface-raised);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-lg);
  box-shadow: var(--b5-shadow-lg);
  max-width: 440px;
  width: 100%;
  padding: var(--b5-space-5);
}
.b5-dialog__title { margin: 0 0 var(--b5-space-2); font-size: var(--b5-font-size-lg); font-weight: var(--b5-font-weight-medium); }
.b5-dialog__body { color: var(--b5-color-text-secondary); font-size: var(--b5-font-size-sm); margin-bottom: var(--b5-space-4); }
.b5-dialog__actions { display: flex; justify-content: flex-end; gap: var(--b5-space-2); }

/* =========================================================
   Utility text styles
   ========================================================= */
.b5-text-muted { color: var(--b5-color-text-muted); }
.b5-text-mono { font-family: var(--b5-font-mono); }
.b5-text-sm { font-size: var(--b5-font-size-sm); }
.b5-text-xs { font-size: var(--b5-font-size-xs); }
.b5-hr { border: none; border-top: var(--b5-border-width-thin) solid var(--b5-color-border-subtle); margin: var(--b5-space-4) 0; }


/* ============================================================================
   BENNY512 SCREEN KIT
   ============================================================================
   One shared vocabulary for the screen shapes the owner signed off on the
   Reconcile and Rig Check "Function check" pages. Everything here was
   promoted out of those two screens' private `.b5-rcp-*` / `.b5-rcb-*`
   blocks, which had each grown their own spelling of the same idea. Read
   css/DESIGN.md before using any of it — that file carries the markup
   contract for each component and the rules that are not negotiable.

   The design target is a TABLET held at arm's length, in the dark, by
   someone standing under a truss with one hand free. That drives every
   number below.

   THE FOUR RULES THESE COMPONENTS EXIST TO ENFORCE
   ------------------------------------------------
   1. NEVER COLOUR AS THE SOLE SIGNAL. Every state is carried by a WORD
      first, then an icon, then a border weight or style, and only then by
      hue. Read this stylesheet with all colour removed and the screens
      still work. That is why .b5-statecard's left rule changes WIDTH as
      well as colour, why .b5-pill is a bordered pill with text in it
      rather than a coloured dot, and why .b5-bigbtn--go and
      .b5-bigbtn--stop are different SHAPES.
   2. 44px MINIMUM TOUCH TARGET on everything you can press. The kit's
      .b5-btn already carries it (min-height: var(--b5-size-touch-min)), so
      a container does NOT need to re-declare it — every component here is
      sized from that token, never from a literal.
   3. AN UNKNOWN IS NAMED, NOT HIDDEN. .b5-fromfile, .b5-pill--unread,
      .b5-pill--open and .b5-board__empty exist so a screen can say what it
      does not know instead of printing a plausible zero.
   4. WIDE CONTENT SCROLLS INSIDE ITS OWN BOX. Every container here that
      can hold wide content sets `min-width: 0` so the page body never
      scrolls sideways.

   ---- icon scale -----------------------------------------------------------
   These live here rather than in benny512-tokens.css only because that file
   is outside this change's ownership boundary; they are component-scale
   constants, not palette, so nothing about the theme depends on them. The
   global default that consumes them is in app.css, next to the existing
   global svg fill/stroke rule — see the long comment there for why every
   icon in this app needs a size it does not carry itself. */
:root {
  --b5-size-icon-sm: 14px;
  --b5-size-icon-md: 18px;
  --b5-size-icon-lg: 24px;
}

/* ---------------------------------------------------------------------------
   1. NUMBERED STEP SECTION
   Gives a screen a readable top-to-bottom order ("1 Testing scope",
   "2 Tests", "3 Output") rather than three unrelated panels.
   --------------------------------------------------------------------------- */
.b5-step-section { margin-bottom: var(--b5-space-6); }
.b5-step-section__head {
  display: flex;
  align-items: center;
  gap: var(--b5-space-3);
  margin: 0 0 var(--b5-space-3);
  font-size: var(--b5-font-size-lg);
  font-weight: var(--b5-font-weight-bold);
  letter-spacing: var(--b5-letter-spacing-sm);
  color: var(--b5-color-text-primary);
}
.b5-step-section__note {
  font-size: var(--b5-font-size-sm);
  font-weight: var(--b5-font-weight-regular);
  color: var(--b5-color-text-muted);
}
.b5-step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  flex: none;
  border-radius: var(--b5-radius-full);
  border: var(--b5-border-width-thick) solid var(--b5-color-border-strong);
  font-size: var(--b5-font-size-sm);
  color: var(--b5-color-text-secondary);
}

/* ---------------------------------------------------------------------------
   2. GROUP — a labelled band of related items inside a step section.
   --------------------------------------------------------------------------- */
.b5-group { margin-bottom: var(--b5-space-5); }
.b5-group__head {
  margin: 0 0 var(--b5-space-2);
  padding-bottom: var(--b5-space-1);
  border-bottom: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  font-size: var(--b5-font-size-md);
  font-weight: var(--b5-font-weight-bold);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--b5-color-text-muted);
}

/* ---------------------------------------------------------------------------
   3. SEGMENTED CONTROL / TOGGLE BUTTON
   One component, two shapes: inside .b5-segmented the buttons share the row
   and grow; standing alone (a filter toggle in a toolbar) a .b5-seg is a
   content-width 44px button. The on-state carries a thicker border and an
   inset underline as well as a tint — rule 1.
   --------------------------------------------------------------------------- */
.b5-segmented { display: flex; flex-wrap: wrap; gap: var(--b5-space-2); }
.b5-seg {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--b5-space-2);
  min-height: var(--b5-size-touch-min);
  padding: var(--b5-space-2) var(--b5-space-4);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-md);
  background: var(--b5-color-bg-surface-raised);
  color: var(--b5-color-text-secondary);
  font: inherit;
  font-size: var(--b5-font-size-md);
  font-weight: var(--b5-font-weight-medium);
  cursor: pointer;
}
.b5-segmented > .b5-seg { flex: 1 1 auto; min-height: 52px; min-width: 120px; }
.b5-segmented--sm > .b5-seg { min-height: var(--b5-size-touch-min); min-width: 96px; font-size: var(--b5-font-size-sm); }
.b5-seg:hover { background: var(--b5-color-bg-hover); }
.b5-seg.is-on {
  background: var(--b5-color-bg-selected);
  border-color: var(--b5-color-accent-border);
  border-width: var(--b5-border-width-thick);
  color: var(--b5-color-text-accent);
  font-weight: var(--b5-font-weight-bold);
  box-shadow: inset 0 -3px 0 var(--b5-color-accent-border);
}
.b5-seg:focus-visible { outline: none; box-shadow: var(--b5-shadow-focus); }

/* ---------------------------------------------------------------------------
   4. STATUS PILL — the single way this app draws a state.
   Pick exactly one SKIN (--sm | --md | --lg | --tag), optionally one TONE
   (--ok | --warn | --danger | --info | --accent | --open | --unread), and
   optionally --solid to fill it with that tone's tint. A pill ALWAYS
   contains a word; there is no icon-only variant on purpose.
   --------------------------------------------------------------------------- */
.b5-pill {
  display: inline-flex;
  align-items: center;
  gap: var(--b5-space-1);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-full);
  white-space: nowrap;
}

/* skins */
.b5-pill--sm {
  padding: 2px var(--b5-space-2);
  border-color: var(--b5-color-border-strong);
  font-size: var(--b5-font-size-xs);
  font-weight: var(--b5-font-weight-bold);
  letter-spacing: 0.08em;
  color: var(--b5-color-text-muted);
}
.b5-pill--sm svg { width: 16px; height: 16px; }
.b5-pill--md {
  padding: 4px var(--b5-space-3);
  background: var(--b5-color-bg-inset);
  color: var(--b5-color-text-secondary);
  font-size: var(--b5-font-size-sm);
  font-weight: var(--b5-font-weight-medium);
  line-height: 1.4;
}
.b5-pill--md svg { width: var(--b5-size-icon-sm); height: var(--b5-size-icon-sm); }
.b5-pill--lg {
  gap: var(--b5-space-2);
  padding: var(--b5-space-1) var(--b5-space-3);
  border-width: var(--b5-border-width-thick);
  border-color: var(--b5-color-border-strong);
  font-weight: var(--b5-font-weight-bold);
  letter-spacing: 0.08em;
  color: var(--b5-color-text-muted);
}
/* --tag: the compact, square-cornered word used inside a dense list row
   (a diff line) where a full pill would out-shout the value beside it. */
.b5-pill--tag {
  padding: 2px var(--b5-space-2);
  border-radius: var(--b5-radius-sm);
  font-size: var(--b5-font-size-xs);
  font-weight: var(--b5-font-weight-bold);
}

/* tones — border colour + text colour only, so a tone is safe on any skin.
   Each also publishes its tint for --solid to pick up. */
.b5-pill--ok      { border-color: var(--b5-color-ok-border); color: var(--b5-color-text-success); --b5-pill-tint: var(--b5-color-ok-fill); }
.b5-pill--warn    { border-color: var(--b5-color-warn-border); border-width: var(--b5-border-width-thick); color: var(--b5-color-text-warning); --b5-pill-tint: var(--b5-color-warn-fill); }
.b5-pill--danger  { border-color: var(--b5-color-danger-border);  color: var(--b5-color-text-danger);  --b5-pill-tint: var(--b5-color-danger-fill); }
.b5-pill--info    { border-color: var(--b5-color-text-info);    color: var(--b5-color-text-info);    --b5-pill-tint: var(--b5-color-bg-surface-raised); }
.b5-pill--accent  { border-color: var(--b5-color-accent-border);  border-width: var(--b5-border-width-thick); color: var(--b5-color-text-accent); --b5-pill-tint: var(--b5-color-accent-fill); }
/* --open and --unread are the two honest-unknown tones: a dashed border
   reads as "nothing is attached here" with no colour at all. */
.b5-pill--open    { border-style: dashed; border-color: var(--b5-color-border-strong); color: var(--b5-color-text-secondary); }
.b5-pill--unread  { border-style: dashed; color: var(--b5-color-text-muted); }
.b5-pill--solid   { background: var(--b5-pill-tint, transparent); }

/* ---------------------------------------------------------------------------
   5. TILE GRID — a large touch target per item with an unmistakable
   on/off state, plus an optional disclosure panel underneath.
   auto-fill rather than auto-fit: a lone tile in a group keeps a sane width
   instead of stretching the full width of a landscape tablet.
   --------------------------------------------------------------------------- */
.b5-tilegrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: var(--b5-space-3);
}
.b5-tile {
  display: flex;
  flex-direction: column;
  min-width: 0;
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-md);
  background: var(--b5-color-bg-surface);
  overflow: hidden;
}
.b5-tile.is-on {
  border-color: var(--b5-color-accent-border);
  border-width: var(--b5-border-width-thick);
  background: var(--b5-color-bg-selected);
}
/* 88px — double the touch minimum, so a mis-tap in the dark is unlikely. */
.b5-tile__toggle {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--b5-space-1);
  width: 100%;
  min-height: 88px;
  padding: var(--b5-space-3) var(--b5-space-4);
  border: none;
  background: transparent;
  color: var(--b5-color-text-primary);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.b5-tile__toggle:hover { background: var(--b5-color-bg-hover); }
.b5-tile__toggle:focus-visible { outline: none; box-shadow: inset var(--b5-shadow-focus); }
.b5-tile__toggle:disabled { cursor: progress; opacity: 0.6; }
.b5-tile__label {
  font-size: var(--b5-font-size-lg);
  font-weight: var(--b5-font-weight-medium);
  line-height: var(--b5-line-height-tight);
}
.b5-tile.is-on .b5-tile__label { font-weight: var(--b5-font-weight-bold); }
/* (a tile's one-line supporting caption is the shared .b5-caption, below) */
.b5-tile__notes { font-size: var(--b5-font-size-xs); color: var(--b5-color-text-warning); }
.b5-tile__more {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--b5-space-2);
  min-height: var(--b5-size-touch-min);
  border: none;
  border-top: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  background: transparent;
  color: var(--b5-color-text-secondary);
  font: inherit;
  font-size: var(--b5-font-size-sm);
  cursor: pointer;
}
.b5-tile__more:hover { background: var(--b5-color-bg-hover); }
.b5-tile__more svg { width: 16px; height: 16px; }
.b5-tile__panel {
  padding: var(--b5-space-3) var(--b5-space-4) var(--b5-space-4);
  border-top: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  background: var(--b5-color-bg-inset);
  display: flex;
  flex-direction: column;
  gap: var(--b5-space-4);
}

/* ---------------------------------------------------------------------------
   6. PARAMETER ROW — one labelled control inside a disclosure panel.
   --------------------------------------------------------------------------- */
.b5-param { display: flex; flex-direction: column; gap: var(--b5-space-2); }
.b5-param__label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--b5-space-2);
  font-size: var(--b5-font-size-sm);
  font-weight: var(--b5-font-weight-medium);
  color: var(--b5-color-text-secondary);
}
.b5-param__hint { font-size: var(--b5-font-size-xs); color: var(--b5-color-text-muted); }
.b5-param__value { color: var(--b5-color-text-primary); font-size: var(--b5-font-size-md); }
/* A compact numeric entry that still clears a fingertip. */
.b5-numinput { min-height: 48px; width: 8em; font-size: var(--b5-font-size-md); }

/* Parameter faders on a MOUSE/desktop pointer. app.css ships a touch-safe
   .b5-range-touch restyle, but it is deliberately gated to (hover:none) and
   (pointer:coarse) so a desktop grid never gets a 44px thumb — which leaves
   the fader as the browser default (bright blue, off-palette, thin) on a
   laptop. This mirrors that treatment at desktop proportions and is gated to
   the opposite side of the same query, so on a tablet the coarse-pointer rule
   in app.css still wins. Scoped to .b5-param, NOT to .b5-range-touch
   globally: Send's 512-cell desktop grid must keep its compact thumb. */
@media (hover: hover) and (pointer: fine) {
  .b5-param .b5-range-touch {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 28px;
    background: transparent;
    cursor: pointer;
  }
  .b5-param .b5-range-touch::-webkit-slider-runnable-track {
    height: 6px;
    background: var(--b5-color-track);
    border: var(--b5-border-width-thin) solid var(--b5-color-track-border);
    border-radius: var(--b5-radius-full);
  }
  .b5-param .b5-range-touch::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px;
    margin-top: -11px;
    border-radius: var(--b5-radius-full);
    background: var(--b5-color-thumb);
    border: var(--b5-border-width-thin) solid var(--b5-color-thumb-border);
  }
  .b5-param .b5-range-touch::-moz-range-track {
    height: 6px;
    background: var(--b5-color-track);
    border: var(--b5-border-width-thin) solid var(--b5-color-track-border);
    border-radius: var(--b5-radius-full);
  }
  .b5-param .b5-range-touch::-moz-range-thumb {
    width: 26px; height: 26px;
    border-radius: var(--b5-radius-full);
    background: var(--b5-color-thumb);
    border: var(--b5-border-width-thin) solid var(--b5-color-thumb-border);
  }
  .b5-param .b5-range-touch:focus-visible { outline: none; box-shadow: var(--b5-shadow-focus); }
}

/* ---------------------------------------------------------------------------
   7. CHOICE CARD — one big consequential checkbox that needs a sentence of
   explanation beside it, not a bare toggle in a row of fields.
   --caution is for a mode that makes the RIG behave surprisingly (Rig
   Check's Isolate makes fixtures emit no light); the default on-state is
   the kit's ordinary accent.
   --------------------------------------------------------------------------- */
.b5-choicecard {
  display: flex;
  align-items: flex-start;
  gap: var(--b5-space-3);
  padding: var(--b5-space-3) var(--b5-space-4);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-md);
  background: var(--b5-color-bg-surface);
  cursor: pointer;
  min-height: var(--b5-size-touch-min);
}
.b5-choicecard input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.b5-choicecard__box {
  flex: none;
  width: 30px; height: 30px;
  display: inline-flex; align-items: center; justify-content: center;
  border: var(--b5-border-width-thick) solid var(--b5-color-border-strong);
  border-radius: var(--b5-radius-sm);
}
.b5-choicecard__box svg { width: 20px; height: 20px; }
.b5-choicecard input:focus-visible + .b5-choicecard__box { box-shadow: var(--b5-shadow-focus); }
.b5-choicecard__title { display: block; font-weight: var(--b5-font-weight-bold); color: var(--b5-color-text-primary); }
.b5-choicecard__body { display: block; margin-top: var(--b5-space-1); font-size: var(--b5-font-size-sm); color: var(--b5-color-text-muted); }
.b5-choicecard.is-on { border-color: var(--b5-color-accent-border); border-width: var(--b5-border-width-thick); background: var(--b5-color-bg-selected); }
.b5-choicecard.is-on .b5-choicecard__box { border-color: var(--b5-color-accent-border); }
.b5-choicecard--caution .b5-choicecard__box { color: var(--b5-color-text-warning); }
.b5-choicecard--caution.is-on { border-color: var(--b5-color-warn-border); background: var(--b5-color-warn-fill); }
.b5-choicecard--caution.is-on .b5-choicecard__box { border-color: var(--b5-color-warn-border); }

/* ---------------------------------------------------------------------------
   8. PICK LIST — a bounded, scrolling list of checkbox rows.
   --------------------------------------------------------------------------- */
.b5-picklist {
  max-height: 260px;
  overflow-y: auto;
  border: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  border-radius: var(--b5-radius-md);
  padding: var(--b5-space-2);
}
.b5-pickrow {
  display: flex;
  align-items: center;
  gap: var(--b5-space-3);
  min-height: var(--b5-size-touch-min);
  padding: var(--b5-space-1) var(--b5-space-2);
  cursor: pointer;
  color: var(--b5-color-text-secondary);
}
.b5-pickrow input { width: 24px; height: 24px; flex: none; accent-color: var(--b5-color-accent-border); }

/* ---------------------------------------------------------------------------
   9. STICKY ACTION BAR — the primary and destructive actions of a screen,
   in fixed non-moving positions, always both present.
   Sticky rather than fixed: this app has been bitten before by fixed bars
   needing a body reserve-space dance (see app.css's --b5-walk-bar-reserve
   comment), and sticky keeps STOP on screen without one.
   --------------------------------------------------------------------------- */
.b5-actionbar {
  position: sticky;
  bottom: 0;
  z-index: var(--b5-z-sticky);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--b5-space-3) var(--b5-space-4);
  margin-top: var(--b5-space-6);
  padding: var(--b5-space-3) var(--b5-space-4);
  border: var(--b5-border-width-thick) solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-md);
  background: var(--b5-color-bg-surface-raised);
  box-shadow: var(--b5-shadow-lg);
}
.b5-actionbar__status { display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-3); margin-right: auto; }
.b5-actionbar__title { display: inline-flex; align-items: center; gap: var(--b5-space-2); font-weight: var(--b5-font-weight-bold); }
.b5-actionbar__buttons { display: flex; gap: var(--b5-space-3); flex: 1 1 auto; justify-content: flex-end; }

/* The affirmative and the destructive action are deliberately different
   SHAPES as well as different colours: --go is an outlined pill, --stop is a
   filled square-cornered slab. In a dark truss at arm's length the
   silhouette reads before the hue does, and the two can never be confused by
   a colour-blind reader. */
.b5-bigbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--b5-space-2);
  min-height: 64px;
  min-width: 150px;
  padding: 0 var(--b5-space-6);
  font: inherit;
  font-size: var(--b5-font-size-xl);
  font-weight: var(--b5-font-weight-bold);
  letter-spacing: 0.06em;
  cursor: pointer;
}
.b5-bigbtn svg { width: var(--b5-size-icon-lg); height: var(--b5-size-icon-lg); }
.b5-bigbtn:focus-visible { outline: none; box-shadow: var(--b5-shadow-focus); }
.b5-bigbtn--go {
  border: var(--b5-border-width-thick) solid var(--b5-color-ok-border);
  border-radius: var(--b5-radius-full);
  background: var(--b5-color-ok-fill);
  color: var(--b5-color-text-success);
}
.b5-bigbtn--go:hover:not(:disabled) { color: var(--b5-color-text-primary); }
.b5-bigbtn--go:disabled { opacity: 0.4; cursor: not-allowed; }
.b5-bigbtn--stop {
  border: var(--b5-border-width-thick) solid var(--b5-color-danger-border);
  border-radius: var(--b5-radius-sm);
  background: var(--b5-color-disarm-slab-bg);
  color: var(--b5-color-disarm-slab-text);
}
.b5-bigbtn--stop:hover { background: var(--b5-color-disarm-slab-bg); }

@media (max-width: 640px) {
  .b5-actionbar__buttons { flex-basis: 100%; }
  .b5-bigbtn { flex: 1 1 0; min-width: 0; }
}

/* ---------------------------------------------------------------------------
   10. TOOLBAR — the screen-top control row. Distinct from the older
   .b5-filterbar (chips + summary, authored desktop-first): every control in
   a .b5-toolbar is a full touch target and the row wraps instead of
   scrolling. New screens use this one.
   --------------------------------------------------------------------------- */
.b5-toolbar { margin-bottom: var(--b5-space-4); }
.b5-toolbar__row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--b5-space-2);
  align-items: center;
}
.b5-toolbar__search { flex: 1 1 220px; min-width: 180px; }
/* Deliberately NOT .b5-input: a search that sits in the control row reads as
   part of that row (raised surface) rather than as a form field cut into the
   page (inset surface). Same height and focus ring as every other control. */
.b5-toolbar__search input {
  width: 100%;
  min-height: var(--b5-size-touch-min);
  padding: var(--b5-space-2) var(--b5-space-3);
  font: inherit;
  font-size: var(--b5-font-size-md);
  color: var(--b5-color-text-primary);
  background: var(--b5-color-bg-surface-raised);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-md);
}
.b5-toolbar__search input:focus-visible { outline: none; box-shadow: var(--b5-shadow-focus); }

/* ---------------------------------------------------------------------------
   11. MODE BAR — a sticky reminder of a mode the user has entered and must
   leave deliberately ("you are committing X — now pick its partner").
   Sticky because the gesture it describes involves a long scroll.
   --------------------------------------------------------------------------- */
.b5-modebar {
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  flex-wrap: wrap;
  gap: var(--b5-space-3);
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--b5-space-3);
  padding: var(--b5-space-3) var(--b5-space-4);
  border: var(--b5-border-width-thick) solid var(--b5-color-accent-border);
  border-radius: var(--b5-radius-md);
  background: var(--b5-color-bg-selected);
  color: var(--b5-color-text-primary);
}
.b5-modebar__label { font-size: var(--b5-font-size-md); line-height: 1.5; }

/* ---------------------------------------------------------------------------
   12. BOARD — two panes side by side, each with a title and an explanatory
   sub-caption saying what that pane actually contains.
   Side by side on tablet-landscape and wider, stacked below that.
   Deliberately NOT a fixed two-column grid at every width: at 820px portrait
   two columns leave each card too narrow for the diff blocks inside it, and
   the diff is the part he actually reads.
   --------------------------------------------------------------------------- */
.b5-board {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--b5-space-4);
}
@media (min-width: 900px) {
  .b5-board { grid-template-columns: 1fr 1fr; align-items: start; }
}
.b5-board__pane {
  min-width: 0; /* lets the grid track shrink so wide content scrolls INSIDE the pane instead of widening the page */
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-lg);
  background: var(--b5-color-bg-surface);
}
.b5-board__head {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 0;
  padding: var(--b5-space-3) var(--b5-space-4);
  border-bottom: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  background: var(--b5-color-bg-surface-raised);
  border-radius: var(--b5-radius-lg) var(--b5-radius-lg) 0 0;
}
.b5-board__title {
  font-size: var(--b5-font-size-lg);
  font-weight: var(--b5-font-weight-bold);
  letter-spacing: var(--b5-letter-spacing-sm);
  color: var(--b5-color-text-primary);
}
/* The sub-caption is not decoration. It is where a pane says in the owner's
   own words what it holds ("what the patch says should be there" /
   "what actually answered"). Do not ship a pane without one. */
.b5-board__sub {
  font-size: var(--b5-font-size-sm);
  font-weight: var(--b5-font-weight-regular);
  color: var(--b5-color-text-muted);
}
.b5-board__list { display: flex; flex-direction: column; gap: var(--b5-space-3); padding: var(--b5-space-3); }
/* An empty pane names what is missing rather than rendering nothing. */
.b5-board__empty { margin: 0; padding: var(--b5-space-4); color: var(--b5-color-text-muted); font-size: var(--b5-font-size-md); line-height: 1.6; }

/* ---------------------------------------------------------------------------
   13. STATE CARD — one row in a board pane. The left border is the card's
   state marker, and its WIDTH changes with state as well as its colour
   (rule 1): a settled card has a hairline, anything needing attention has a
   thick one, so the pane scans correctly in greyscale.
   --------------------------------------------------------------------------- */
.b5-statecard {
  min-width: 0;
  padding: var(--b5-space-3);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  border-left-width: 6px;
  border-radius: var(--b5-radius-md);
  background: var(--b5-color-bg-surface-raised);
}
.b5-statecard.is-ok { border-left-color: var(--b5-color-ok-border); }
.b5-statecard.is-warn { border-left-color: var(--b5-color-warn-border); border-left-width: 10px; }
.b5-statecard.is-danger { border-left-color: var(--b5-color-danger-border); border-left-width: 10px; }
/* An unattached item reads as unattached even with no colour at all. */
.b5-statecard.is-open { border-left-color: var(--b5-color-border-strong); border-left-style: dashed; }
.b5-statecard.is-armed {
  border-color: var(--b5-color-accent-border);
  border-width: var(--b5-border-width-thick);
  border-left-width: 10px;
  border-left-color: var(--b5-color-accent-border);
  background: var(--b5-color-bg-selected);
}
.b5-statecard__top { display: flex; gap: var(--b5-space-3); align-items: flex-start; }
.b5-statecard__id { min-width: 0; }
.b5-statecard__name {
  display: block;
  font-size: var(--b5-font-size-lg);
  line-height: 1.35;
  color: var(--b5-color-text-primary);
  overflow-wrap: anywhere;
}
.b5-statecard__meta {
  display: block;
  margin-top: 2px;
  font-size: var(--b5-font-size-sm);
  line-height: 1.6;
  color: var(--b5-color-text-secondary);
  overflow-wrap: anywhere;
}
.b5-statecard__state { display: flex; flex-wrap: wrap; gap: var(--b5-space-2); align-items: center; margin-top: var(--b5-space-3); }
.b5-statecard__actions { display: flex; flex-wrap: wrap; gap: var(--b5-space-2); align-items: center; margin-top: var(--b5-space-3); }

/* ---------------------------------------------------------------------------
   14. LINK BADGE — the same number on both sides of a related pair. This is
   how a relation is readable ACROSS two panes without drawing a line between
   them, and without depending on colour to say which goes with which.
   --------------------------------------------------------------------------- */
.b5-linkbadge {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px; height: 32px;
  border-radius: var(--b5-radius-full);
  border: var(--b5-border-width-thick) solid var(--b5-color-accent-border);
  background: var(--b5-color-bg-selected);
  color: var(--b5-color-text-accent);
  font-size: var(--b5-font-size-sm);
  font-weight: var(--b5-font-weight-bold);
  font-variant-numeric: tabular-nums;
}
.b5-linkbadge--none {
  border-style: dashed;
  border-color: var(--b5-color-border-default);
  background: transparent;
  color: var(--b5-color-text-disabled);
}

/* ---------------------------------------------------------------------------
   15. DIFF LINE — one stacked block per setting: what we intended, what we
   found, and the one press that resolves it.
   Deliberately NOT a table. A five-column table was tried and render-proofing
   it in Chromium at 1024x768 killed it outright: with two panes side by side
   each card is about 430px wide, so the table overflowed and the ACTION
   column — the Apply button — sat entirely outside the visible card,
   reachable only by dragging a nested horizontal scrollbar. A control a
   tablet user cannot see is a control that does not exist. Stacked blocks
   have no minimum width to overflow.
   --------------------------------------------------------------------------- */
.b5-diffline {
  padding: var(--b5-space-3);
  margin-bottom: var(--b5-space-2);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-subtle);
  border-left-width: 4px;
  border-left-color: var(--b5-color-border-default);
  border-radius: var(--b5-radius-md);
  background: var(--b5-color-bg-surface);
}
/* A line that needs attention is marked three independent ways — a thick
   left rule, a tint, and its own worded pill — so it survives greyscale. */
.b5-diffline.is-warn {
  border-left-width: 8px;
  border-left-color: var(--b5-color-warn-border);
  background: var(--b5-color-warn-fill);
}
.b5-diffline.is-info { border-left-color: var(--b5-color-info-border); }
.b5-diffline.is-ok { border-left-color: var(--b5-color-ok-border); }
.b5-diffline.is-unread { border-left-style: dashed; color: var(--b5-color-text-muted); }
/* The tint is the warn-fill role, which console-tokens.css resolves per
   theme, so the old [data-theme="light"] override (warning-100) is gone.
   It had replaced a `@media (prefers-color-scheme: dark)` override that
   keyed off the OS rather than the app's own theme. */

.b5-diffline__head {
  display: flex;
  flex-wrap: wrap;
  gap: var(--b5-space-2);
  align-items: center;
  justify-content: space-between;
}
.b5-diffline__label { font-size: var(--b5-font-size-md); font-weight: var(--b5-font-weight-bold); color: var(--b5-color-text-primary); }
/* Two-column definition list: the label column is fixed and narrow so the two
   values line up under each other and the eye can compare them vertically,
   which is the whole job of this block. */
.b5-diffline__vals {
  display: grid;
  grid-template-columns: 6.5em 1fr;
  gap: 2px var(--b5-space-3);
  margin: var(--b5-space-2) 0 0;
  font-size: var(--b5-font-size-sm);
  line-height: 1.55;
}
.b5-diffline__vals dt { color: var(--b5-color-text-muted); }
.b5-diffline__vals dd { margin: 0; color: var(--b5-color-text-primary); overflow-wrap: anywhere; }
.b5-diffline__action { margin-top: var(--b5-space-3); }

/* ---------------------------------------------------------------------------
   16. INSET — "about the thing above", not another item in the list.
   Dashed border so it never reads as a card of its own.
   --------------------------------------------------------------------------- */
.b5-inset {
  margin-top: var(--b5-space-3);
  padding: var(--b5-space-3);
  border: var(--b5-border-width-thin) dashed var(--b5-color-border-strong);
  border-radius: var(--b5-radius-md);
  background: var(--b5-color-bg-inset);
}
.b5-inset__head {
  display: flex;
  gap: var(--b5-space-2);
  align-items: flex-start;
  margin: 0 0 var(--b5-space-3);
  font-size: var(--b5-font-size-md);
  line-height: 1.55;
  color: var(--b5-color-text-secondary);
}
.b5-inset__head svg { margin-top: 2px; }

/* ---------------------------------------------------------------------------
   17. WHY LIST — the evidence behind a conclusion the app is offering.
   This is the part that stops the wrong fixture being committed when two are
   identical, so it is body-sized text, never fine print.
   --------------------------------------------------------------------------- */
.b5-why { margin: var(--b5-space-2) 0 0; padding-left: var(--b5-space-5); font-size: var(--b5-font-size-sm); line-height: 1.65; color: var(--b5-color-text-secondary); }
.b5-why li { margin-bottom: 2px; }
.b5-why__kind { display: inline-block; min-width: 6.5em; font-weight: var(--b5-font-weight-bold); color: var(--b5-color-text-primary); }

/* ---------------------------------------------------------------------------
   18. HONEST-UNKNOWN MARKERS AND CAPTIONS
   .b5-fromfile marks a label the app is only repeating out of a fixture file,
   not a name it chose — said plainly rather than passed off as considered
   wording. Dashed, because dashed means "not ours" everywhere in this kit.
   --------------------------------------------------------------------------- */
.b5-fromfile {
  display: inline-block;
  margin-left: var(--b5-space-2);
  padding: 0 var(--b5-space-2);
  border: var(--b5-border-width-thin) dashed var(--b5-color-border-strong);
  border-radius: var(--b5-radius-sm);
  font-size: var(--b5-font-size-xs);
  font-weight: var(--b5-font-weight-regular);
  color: var(--b5-color-text-muted);
  vertical-align: middle;
}
/* .b5-note is a wrapping explanatory sentence; .b5-caption is a single line
   of supporting text under a label. Two classes because their line-heights
   are genuinely different jobs, not an accident. */
.b5-note { font-size: var(--b5-font-size-sm); line-height: 1.5; color: var(--b5-color-text-muted); }
.b5-caption { font-size: var(--b5-font-size-sm); color: var(--b5-color-text-muted); }

/* ============================================================
   Rig Check "Function check" (rigcheck.js) — what is left after the
   screen kit above absorbed everything reusable. Everything here is
   specific to the test-pattern engine's own controls.
   ============================================================ */

.b5-rcp-alert { margin-bottom: var(--b5-space-4); }
.b5-rcp-list { margin: var(--b5-space-2) 0 0; padding-left: var(--b5-space-5); color: var(--b5-color-text-secondary); font-size: var(--b5-font-size-sm); }
.b5-rcp-list li { margin-bottom: var(--b5-space-1); }

/* ---- scope ---- */
.b5-rcp-scope__value { margin-top: var(--b5-space-3); display: flex; flex-direction: column; gap: var(--b5-space-2); }
.b5-rcp-scope__count { margin: var(--b5-space-3) 0 0; font-size: var(--b5-font-size-md); color: var(--b5-color-text-secondary); }
.b5-rcp-scope__note { margin: var(--b5-space-1) 0 0; font-size: var(--b5-font-size-sm); color: var(--b5-color-text-muted); }

/* ---- per-test parameters ---- */
.b5-rcp-hint { margin: 0; font-size: var(--b5-font-size-sm); color: var(--b5-color-text-muted); }
/* Phase spread: two numeric fields plus two presets, on one wrapping line. */
.b5-rcp-phase { display: flex; flex-wrap: wrap; align-items: center; gap: var(--b5-space-2); }
.b5-rcp-phase__field { display: inline-flex; align-items: center; gap: var(--b5-space-1); font-size: var(--b5-font-size-sm); color: var(--b5-color-text-muted); }
.b5-rcp-phase__field .b5-numinput { width: 6em; }

/* ============================================================
   Reconcile board (reconcile.js) — what is left after the screen kit
   above absorbed everything reusable. Everything here is specific to the
   weighted matcher's candidate list and to the board's own tallies.
   ============================================================ */

.b5-rcb-alert { margin-bottom: var(--b5-space-4); }
.b5-rcb-tally { margin: var(--b5-space-3) 0 0; font-size: var(--b5-font-size-md); line-height: 1.6; color: var(--b5-color-text-secondary); }
.b5-rcb-tally strong { color: var(--b5-color-text-primary); }
.b5-rcb-uid { font-size: var(--b5-font-size-sm); color: var(--b5-color-text-muted); }
.b5-rcb-readat { margin: var(--b5-space-2) 0 0; font-size: var(--b5-font-size-sm); color: var(--b5-color-text-muted); line-height: 1.5; }

/* ---- one candidate from the matcher ---- */
.b5-rcb-cand {
  margin-bottom: var(--b5-space-3);
  padding: var(--b5-space-3);
  border: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  border-radius: var(--b5-radius-md);
  background: var(--b5-color-bg-surface-raised);
}
.b5-rcb-cand__top { display: flex; flex-wrap: wrap; gap: var(--b5-space-2); justify-content: space-between; align-items: baseline; }
.b5-rcb-cand__conf { font-size: var(--b5-font-size-sm); font-weight: var(--b5-font-weight-bold); color: var(--b5-color-text-primary); font-variant-numeric: tabular-nums; }
.b5-rcb-cand__actions { display: flex; flex-wrap: wrap; gap: var(--b5-space-2); margin-top: var(--b5-space-3); }

/* ---- the diff panel wrapper ---- */
.b5-rcb-diff {
  margin-top: var(--b5-space-3);
  padding-top: var(--b5-space-3);
  border-top: var(--b5-border-width-thin) solid var(--b5-color-border-default);
}
.b5-rcb-diff__lead { margin: 0 0 var(--b5-space-3); font-size: var(--b5-font-size-sm); line-height: 1.6; color: var(--b5-color-text-secondary); }
.b5-rcb-adoptall { margin-top: var(--b5-space-2); }

/* ============================================================
   Reconcile board — per-pane scroll and per-pane sort.
   APPENDED BLOCK: everything below is new and scoped to
   .b5-rcb-board / .b5-rcb-*. Nothing above it is modified.

     "Can we add separate scrollbars to the reconcile page, so the
      'intended devices' has its own and so does the 'rdm devices' pane.
      Also, let's add sorting options to each pane, as well as automatically
      move committed devices to the bottom of sorting order, still following
      the sort filter set."

   Scoped to a .b5-rcb-board modifier rather than written against the kit's
   own .b5-board / .b5-board__list, so the three other screens that use the
   board component are untouched by any of it.
   ============================================================ */

/* ---- per-pane sort control ----------------------------------------------
   Sits BETWEEN the pane's header and its scrolling list, so both the title
   and the control that orders the list stay put while the list moves under
   them. The <select> is a real .b5-select, which already carries
   min-height: var(--b5-size-touch-min) — the literal 44px is never restated
   here (kit rule 2). */
.b5-rcb-panetools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--b5-space-2);
  padding: var(--b5-space-2) var(--b5-space-4);
  border-bottom: var(--b5-border-width-thin) solid var(--b5-color-border-default);
  background: var(--b5-color-bg-surface-raised);
}
.b5-rcb-panetools__label {
  font-size: var(--b5-font-size-sm);
  font-weight: var(--b5-font-weight-bold);
  color: var(--b5-color-text-secondary);
}
/* min-width: 0 so a long option label shrinks the control instead of widening
   the pane and, through it, the page (kit rule 4). */
.b5-rcb-panetools__select { flex: 1 1 12rem; min-width: 0; }

/* ---- the two independent scroll boxes -----------------------------------
   Only ABOVE 900px, which is exactly the width at which .b5-board stops
   stacking and puts the panes side by side. That gate is deliberate and is
   the whole point of the feature: two capped boxes let him hold a patch entry
   on the left against the fixture he thinks it is on the right and move each
   side separately. Stacked (820px portrait, phone), there is only ever one
   pane in view at a time, nothing to line up against anything, and two short
   nested scroll boxes on a long page would be a trap for a thumb — so below
   900px the rules simply do not apply and the page scrolls as it always did.

   overscroll-behavior: contain stops a flick that reaches the end of one pane
   from carrying on into the page behind it. Momentum on iPad comes from the
   platform for any element with overflow: auto; -webkit-overflow-scrolling is
   the belt-and-braces for older WebKit. */
@media (min-width: 900px) {
  .b5-rcb-board .b5-board__list {
    max-height: min(68vh, 60rem);
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-gutter: stable;
    scrollbar-color: var(--b5-color-border-strong) var(--b5-color-bg-surface);
  }
  /* A scrollbar wide enough to see and grab in the dark, and visible at all:
     the default overlay bar on a touch device fades out entirely, which would
     leave the pane with no standing sign that there is more below it. */
  .b5-rcb-board .b5-board__list::-webkit-scrollbar { width: 14px; }
  .b5-rcb-board .b5-board__list::-webkit-scrollbar-track {
    background: var(--b5-color-bg-surface);
    border-radius: var(--b5-radius-sm);
  }
  .b5-rcb-board .b5-board__list::-webkit-scrollbar-thumb {
    background: var(--b5-color-border-strong);
    border-radius: var(--b5-radius-sm);
  }
  .b5-rcb-board .b5-board__list:focus-visible { outline: none; box-shadow: var(--b5-shadow-focus); }
}

/* ---- the done / not-done divider ----------------------------------------
   Committed rows sink to the bottom of their pane. That has to READ as "these
   are finished", not as "the sort is broken", so the boundary is named rather
   than merely positional — and it is named with a WORD and an ICON and a
   border STYLE (dashed while a group is still open, solid once it is done —
   the kit's own dashed = "nothing is attached here" convention), so it
   survives greyscale and does not depend on hue at all (kit rule 1).

   Deliberately not .b5-group__head: that one is text-transform: uppercase,
   which is right for a three-word band label and wrong for a whole sentence
   under the standing dyslexia-friendly constraint ("no all-caps runs longer
   than a chip label"). See the report's note on this. */
.b5-rcb-groupdiv {
  display: flex;
  align-items: center;
  gap: var(--b5-space-2);
  margin: var(--b5-space-2) 0 0;
  padding-bottom: var(--b5-space-2);
  font-size: var(--b5-font-size-md);
  font-weight: var(--b5-font-weight-bold);
  line-height: 1.4;
  color: var(--b5-color-text-primary);
}
.b5-rcb-groupdiv:first-child { margin-top: 0; }
.b5-rcb-groupdiv--todo {
  border-bottom: var(--b5-border-width-thick) dashed var(--b5-color-border-strong);
}
.b5-rcb-groupdiv--done {
  border-bottom: var(--b5-border-width-thick) solid var(--b5-color-border-strong);
  color: var(--b5-color-text-secondary);
}
